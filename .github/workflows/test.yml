# Runs the whole test suite on every push and pull request, so a change that breaks something is seen before it is merged.
# Render deploys main automatically: keep main green, and merge only pull requests whose check passed.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Isolated PostgreSQL for the Partner API order tests (real transactions, two processes, crash after commit)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kinan_test
          POSTGRES_DB: kinan_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kinan_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Partner API orders, fulfilment and Shopify connector on real PostgreSQL
        run: node --test --test-concurrency=1 test/partner-orders.test.js test/partner-fulfilment.test.js test/partner-shopify.test.js
        env:
          KINAN_TEST_PG: '1'
      - run: node --check src/server.js
      - run: node --check src/db.js
      - run: node --check src/auth.js
      - name: Staging smoke check (isolated data, no production keys, jobs off)
        run: npm run staging:local
