<head>

<link rel="manifest" href="/assets/seller.webmanifest">

<meta name="apple-mobile-web-app-title" content="Kinan Seller">

<link rel="stylesheet" href="/assets/kinan.css">
<style>
  /* Seller Center wears the colours of its app icon: deep blue with the Kinan marigold dot (the shop stays green) */
  :root { --jade: #4b319b; --jade-ink: #ffffff; --jade-soft: #eee9fb; --logo: #4b319b; --nav: #2b2050; --nav-ink: #ffffff; --nav-muted: #cfc6ee; }
  :root[data-theme="dark"] { --jade: #b3a1f5; --jade-ink: #1a1033; --jade-soft: #2a2150; --logo: #4b319b; --nav: #1d1638; --nav-ink: #ffffff; --nav-muted: #c4b9ea; }
  .kyc { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 16px; }
  .kyc .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kyc .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .kyc .steps span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--chip, #f1f3f7); color: var(--ink-2); }
  .kyc h3 { display: flex; gap: 10px; align-items: center; margin: 0; }
  .kyc h3 i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--jade); color: #fff; font-size: 14px; }
  .kyc .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .kyc .grid-2 { grid-template-columns: 1fr; } }
  .docbox { border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 8px; justify-items: start; }
  .docbox img { max-width: 100%; max-height: 180px; border-radius: 10px; object-fit: contain; background: var(--chip, #f1f3f7); }
  .cam { position: relative; width: 100%; max-width: 360px; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #111; }
  .cam video, .cam img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .cam img { transform: none; }
  .cam .oval { position: absolute; inset: 10% 18% 14%; border: 3px solid rgba(255,255,255,.85); border-radius: 50%; pointer-events: none; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } }
  .side { position: sticky; top: 0; height: 100vh; padding: 18px 14px; border-inline-end: 1px solid var(--line); background: var(--nav); color: var(--nav-ink); display: flex; flex-direction: column; gap: 22px; }
  .side .brand { color: var(--nav-ink); } .side .brand small, .side .foot .muted { color: var(--nav-muted); }
  .side .foot .btn.ghost { color: var(--nav-ink); border-color: rgba(255,255,255,.28); }
  .side nav { display: grid; gap: 2px; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-md); text-decoration: none; color: var(--nav-muted); font-weight: 500; }
  .side nav a:hover { background: rgba(255,255,255,.08); color: var(--nav-ink); }
  .side :focus-visible { outline-color: #ffffff; }
  .side nav a svg { width: 20px; height: 20px; }
  .side nav a.on { background: rgba(255,255,255,.14); color: var(--nav-ink); font-weight: 650; }
  .payflow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; counter-reset: pf; }
  .payflow li { position: relative; padding: 10px 12px; border-radius: var(--r-md); background: var(--jade-soft); display: grid; gap: 2px; font-size: 13px; counter-increment: pf; }
  .payflow li b::before { content: counter(pf) ". "; }
  .payflow li span { color: var(--ink-2); font-size: 12px; }
  @media (max-width: 760px) { .payflow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .attn-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; }
  .attn-list a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; font-weight: 600; font-size: 14px; }
  .attn-list a:hover { color: var(--jade); }
  .side .foot { margin-top: auto; display: grid; gap: 8px; }
  .ocard { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  details.ocard > summary { list-style: none; cursor: pointer; display: grid; gap: 6px; min-height: 44px; }
  details.ocard > summary::-webkit-details-marker { display: none; }
  details.ocard > summary .ochev { transition: transform .15s; color: var(--muted); flex: none; }
  details.ocard[open] > summary .ochev { transform: rotate(180deg); }
  details.ocard .obody { display: grid; gap: 10px; margin-top: 10px; }
  .osum { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
  .osum .ot { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .ocancelled > summary { cursor: pointer; padding: 6px 0; }
  .ocard:last-child { border-bottom: 0; }
  .ohead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .oamt { display: grid; justify-items: end; gap: 2px; text-align: end; font-size: 16px; }
  .olines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .olines li { display: flex; gap: 6px; min-width: 0; } .olines li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .olines .qty { flex: none; font-weight: 700; color: var(--ink-2); }
  .opills { gap: 6px; }
  .otrack { display: grid; gap: 2px; } .otrack .trk { font-variant-numeric: tabular-nums; word-break: break-all; }
  .oacts { gap: 8px; flex-wrap: wrap; } .oacts .btn { flex: 1 1 auto; }
  @media (min-width: 761px) { .oacts .btn { flex: 0 0 auto; } }
  .mtop .row { flex-wrap: nowrap; min-width: 0; }
  .mtop .row a.btn { max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
  .mtop { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .content { padding: 22px clamp(16px, 3vw, 36px) 40px; max-width: 1120px; width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 2px; text-decoration: none; color: inherit; }
  .kpi b { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); }
  .banner.ok { background: var(--jade-soft); border-color: color-mix(in srgb, var(--jade) 30%, var(--line)); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tabs button { font: 600 14px var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: var(--r-md); cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--chip); color: var(--ink); }
  .prod { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .prod:last-child { border-bottom: 0; }
  .prod img, .prod .thumb { width: 64px; height: 64px; border-radius: var(--r-md); object-fit: cover; background: var(--chip); }
  .prod .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Product list: when the list itself is narrow (tablet + sidebar, larger phone text), put the buttons under the title instead of squeezing it */
  .prodlist { container-type: inline-size; }
  .prod .pick { position: relative; display: block; cursor: pointer; }
  .prod .pick input { position: absolute; top: -6px; inset-inline-start: -6px; width: 22px; height: 22px; margin: 0; accent-color: var(--jade); background: var(--bg, #fff); border-radius: 6px; box-shadow: 0 0 0 2px var(--bg, #fff); }
  .prod.sel { background: color-mix(in srgb, var(--jade) 7%, transparent); }
  .selbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 10px; border-radius: var(--r-md); background: var(--chip); }
  .selbar label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
  .selbar input { width: 20px; height: 20px; accent-color: var(--jade); }
  .btn.danger { background: #c0392b; color: #fff; border-color: #c0392b; }
  @container (max-width: 760px) { .prod { grid-template-columns: 64px minmax(0, 1fr); } .prod .acts { grid-column: 2; } }
  @media (max-width: 560px) { .prod { grid-template-columns: 56px minmax(0, 1fr); } .prod .acts { grid-column: 1 / -1; } .prod img, .prod .thumb { width: 56px; height: 56px; } }
  .steps { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .steps b { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--chip); color: var(--ink-2); font-size: 12px; }
  .steps .on b { background: var(--jade); color: var(--jade-ink); }
  .steps .on { color: var(--ink); font-weight: 600; }
  .steps i { width: 24px; height: 1px; background: var(--line); }
  .editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .editor { grid-template-columns: 1fr; } }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos img { width: 76px; height: 76px; object-fit: cover; border-radius: var(--r-md); background: var(--chip); }
  .price-in { width: 110px; }
  .margin { font-weight: 600; font-variant-numeric: tabular-nums; }
  .preview-card { position: sticky; top: 20px; }
  .preview-card .ph { aspect-ratio: 1; background: var(--chip); border-radius: var(--r-md); overflow: hidden; position: relative; }
  .preview-card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .preview-card .tag { position: absolute; inset-inline-start: 10px; bottom: 10px; }
  .vrow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  @media (max-width: 600px) { .vrow { grid-template-columns: 1fr 1fr 1fr auto; } .vrow .vname { grid-column: 1 / -1; } }
  .ebaycta { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; margin-bottom: 14px; max-width: 1100px; border: 1.5px solid var(--jade, #0e7c66); }
  .ebaycta > div { flex: 1; } .ebayico { width: 46px; height: 46px; background: linear-gradient(135deg, var(--jade, #4b319b), #13245a); color: #fff; font-size: 14px; font-weight: 800; letter-spacing: -.2px; position: relative; box-shadow: 0 4px 12px rgba(14,124,102,.25); }
  .ebayico::after { content: ""; position: absolute; top: 5px; inset-inline-end: 5px; width: 7px; height: 7px; border-radius: 50%; background: #f4b400; }
  .ebayico.img { background: #fff; border: 1px solid var(--line); box-shadow: none; padding: 5px; } .ebayico.img::after { display: none; } .ebayico img { width: 100%; height: 100%; object-fit: contain; }
  .srcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; max-width: 1100px; }
  .srchead { display: flex; gap: 12px; align-items: flex-start; }
  .srcico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; color: #fff; }
  .srcico.tb { background: #ff5000; } .srcico.ae { background: #e62e04; font-size: 14px; } .srcico.mn { background: var(--jade); }
  .callout { font-size: 13px; padding: 10px 12px; border-radius: var(--r-md); background: var(--chip); color: var(--ink-2); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 14px 0; }
.kitem { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.kitem img, .kitem .kimg { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--surface-2, #f2f4f7); }
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/common.js"></script>
<script>
// The platform owner has full access to every app: act as this app's role
const asMe = (u) => (u && u.owner ? { ...u, role: 'seller' } : u);
const { $, $$, esc, money, num, date, plain, api, toast, ICONS, pill } = K;
K.offerInstall({ name: 'Kinan Seller', icon: '/assets/icon-seller-192.png' });
let me = null, shop = null, cfg = { currency: 'usd', cny_rate: 7.2 };
let draft = null; // product being imported or edited

const PRODUCT_STATUS = { pending_review: ['In review', 'warn'], active: ['Live', 'ok'], paused: ['Paused', ''], rejected: ['Needs changes', 'bad'], unavailable: ['Unavailable on Taobao', 'bad'] };
const PO_STATUS_CLS = (s) => /WAIT_BUYER_P/.test(s) ? 'warn' : /CREATE_FAILED|TRADE_CLOSED/.test(s) ? 'bad' : 'ok';
const NAV = [['#/', 'Dashboard', ICONS.home], ['#/products', 'Products', ICONS.shop], ['#/add', 'Add product', ICONS.plus], ['#/orders', 'Orders', ICONS.box], ['#/earnings', 'Earnings', ICONS.wallet], ['#/ebay', 'eBay', ICONS.tag || ICONS.shop], ['#/settings', 'Account', ICONS.user]];

function variantLabel(props) {
  if (!props) return 'Standard';
  try { const j = JSON.parse(props); if (Array.isArray(j)) return j.map((x) => typeof x === 'object' ? (x.value_name || x.value || Object.values(x).join(' ')) : x).join(' / '); if (j && typeof j === 'object') return Object.values(j).join(' / '); } catch {}
  return String(props).split(/[;,]/).map((p) => p.split(':').pop()).filter(Boolean).join(' / ') || 'Standard';
}
const costInSale = (cny) => Number(cny) / Number(cfg.cny_rate || 7.2);
function marginPct(price, cny) { const c = costInSale(cny); return price > 0 ? Math.round(((price - c) / price) * 100) : null; }
const marginCls = (m) => m === null ? '' : m < 10 ? 'bad' : m < 25 ? 'warn' : 'ok';

// ---------- shell ----------
function shell() {
  const h = location.hash || '#/';
  const isOn = (href) => href === '#/' ? h === '#/' || h === '#' : h.startsWith(href);
  $('#app').innerHTML = `<div class="shell">
    <aside class="side desk-only">${K.brand('Seller Center')}
      <nav>${NAV.map(([href, t, ic]) => `<a href="${href}" class="${isOn(href) ? 'on' : ''}">${ic}${t}</a>`).join('')}</nav>
      <div class="foot"><div class="small"><b>${esc(shop?.shop_name || '')}</b><div class="muted">${esc(me.email)}</div></div><div class="row">${KinanTheme.button('btn ghost sm')}<button class="btn ghost sm" data-out>Sign out</button></div></div>
    </aside>
    <div><div class="mtop mob-only">${K.brand('Seller')}<span class="row" style="gap:6px">${KinanTheme.button('btn sm ghost')}<a class="btn sm quiet" href="#/settings">${esc((shop?.shop_name || '').slice(0, 18))}</a></span></div>
    <main class="content" id="view"></main>${K.footer(cfg.operator?.name)}</div></div>
    <nav class="tabbar">${NAV.filter(([href]) => href !== '#/ebay').map(([href, t, ic]) => `<a href="${href}" class="${isOn(href) ? 'on' : ''}">${ic}${t === 'Add product' ? 'Add' : t}</a>`).join('')}</nav>`;
  document.body.classList.add('has-tabbar');
  $$('[data-out]').forEach((b) => b.onclick = signOut);
}
async function signOut() { await api('/api/auth/logout', 'POST').catch(() => {}); me = null; shop = null; authScreen(); }

const routes = [[/^#\/?$/, dashboard], [/^#\/products$/, products], [/^#\/add$/, addStart], [/^#\/catalog(?:\?(.*))?$/, catalogPage], [/^#\/edit\/([\w-]+)$/, editProduct], [/^#\/review$/, editorScreen], [/^#\/manual(?:\/([\w-]+)|\?(ae))?$/, manualForm], [/^#\/orders$/, orders], [/^#\/earnings$/, earnings], [/^#\/ebay$/, ebayPage], [/^#\/settings$/, settings]];
async function route() {
  if (!me) return;
  if (shop && shop.terms_ok === false) return termsScreen();
  if (needsVerification()) { try { await verifyScreen(); } catch (e) { $('#app').innerHTML = `<div class="kyc"><div class="empty"><h3>Couldn’t load this page</h3><p>${esc(e.message)}</p><button class="btn ghost" onclick="route()">Try again</button></div></div>`; } return; }
  shell();
  const h = location.hash || '#/';
  for (const [re, fn] of routes) {
    const m = h.match(re);
    if (m) { try { await fn(...m.slice(1)); } catch (e) { $('#view').innerHTML = `<div class="empty"><h3>Couldn’t load this page</h3><p>${esc(e.message)}</p><button class="btn ghost" onclick="route()">Try again</button></div>`; } window.scrollTo(0, 0); return; }
  }
  location.hash = '#/';
}
window.addEventListener('hashchange', route);
const refreshShop = async () => { shop = await api('/api/seller/me'); };
const NEXT_KEY = 'kinan_seller_next';
function rememberNext(h) { try { localStorage.setItem(NEXT_KEY, JSON.stringify({ h, at: Date.now() })); } catch { /* private mode */ } }
/** After signing in: go to the page the person was opening (saved less than 30 minutes ago). */
function takeNext() {
  try {
    const v = JSON.parse(localStorage.getItem(NEXT_KEY) || 'null'); localStorage.removeItem(NEXT_KEY);
    if (v && /^#\/[\w\-/?=]*$/.test(v.h) && Date.now() - v.at < 30 * 60e3 && (!location.hash || location.hash === '#/')) history.replaceState(null, '', '/seller' + v.h);
  } catch { /* ignore */ }
}

function approvalBanner() {
  if (shop.status === 'pending') return `<div class="banner"><div><b>Your shop is waiting for approval</b><div class="small">Kinan reviews new sellers before they can publish. Meanwhile, connect your Taobao account and prepare products.</div></div></div>`;
  if (shop.status === 'suspended') return `<div class="banner" style="background:color-mix(in srgb,var(--bad) 10%,var(--surface))"><div><b>Your shop is suspended</b><div class="small">Your products are hidden from buyers. Contact Kinan support for details.</div></div></div>`;
  return '';
}
function taobaoCard() {
  const t = shop.taobao || {};
  // Kinan's own Taobao account is used for every seller: nothing to connect
  if (cfg.taobao_kinan) return '';
  // Connected: nothing to show, unless the authorization is about to expire
  if (t.connected && !t.needs_reauth_soon) return '';
  if (t.connected) return `<div class="banner ok"><div><b>Taobao account connected</b><div class="small">${t.account ? esc(t.account) + ' · ' : ''}Orders are bought from this account.${t.needs_reauth_soon ? ' <span class="warn">Authorization expires soon — reconnect to keep orders flowing.</span>' : ''}</div></div>${t.needs_reauth_soon ? '<button class="btn sm" data-connect>Reconnect</button>' : ''}</div>`;
  return `<div class="banner"><div><b>Connect your Taobao account</b><div class="small">You need a Taobao Distribution Platform account to import products. Kinan buys each order from your account and ships it to our China warehouse.</div></div><button class="btn" data-connect>Connect Taobao</button></div>`;
}
function wireConnect() {
  $$('[data-connect]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api(`/api/seller/taobao/connect?return_to=${encodeURIComponent(location.origin + '/seller?taobao=connected')}`); location.href = r.url; }
    catch (e) { toast(e.message); b.disabled = false; }
  });
}

// ---------- dashboard ----------
async function dashboard() {
  const v = $('#view');
  v.innerHTML = '<div class="skeleton" style="height:120px"></div>';
  const summary = await api('/api/seller/dashboard');
  const { recent: ords, earnings: earn, counts } = summary;
  const count = (status) => counts[status] || 0;
  const toPay = cfg.taobao_kinan ? 0 : summary.awaiting;
  v.innerHTML = `<div class="head"><div><h1>Hello, ${esc(shop.shop_name)}</h1><p class="muted">Here’s what needs your attention today.</p></div><a class="btn" href="#/add">Add product</a></div>
    ${approvalBanner()}${taobaoCard()}
    ${toPay ? `<div class="banner" style="background:color-mix(in srgb,var(--bad) 9%,var(--surface))"><div><b>${toPay} order${toPay > 1 ? 's' : ''} waiting for your payment to Taobao</b><div class="small">Unpaid purchase orders are closed by Taobao at the deadline and the buyer is refunded.</div></div><a class="btn" href="#/orders">Pay now</a></div>` : ''}
    <div class="kpis">
      <a class="kpi" href="#/ebay"><span>Sell on eBay</span><b>🏷</b></a>
      <a class="kpi" href="#/products"><span>Live products</span><b>${count('active')}</b></a>
      <a class="kpi" href="#/products"><span>In review</span><b>${count('pending_review')}</b></a>
      <a class="kpi" href="#/products"><span>Needs changes</span><b class="${count('rejected') ? 'bad' : ''}">${count('rejected')}</b></a>
      <a class="kpi" href="#/orders"><span>Orders</span><b>${summary.orderCount}</b></a>
      <a class="kpi" href="#/earnings"><span>Available to pay out</span><b>${money(earn.available, earn.currency)}</b></a>
      <a class="kpi" href="#/earnings"><span>On the way</span><b>${money(earn.pending, earn.currency)}</b></a>
    </div>
    ${attentionPanel(summary, toPay)}
    <section class="panel" id="stats"></section>

/** One list of what the seller should look at, most urgent first; every row links to the screen that fixes it. */
function attentionPanel(summary, toPay) {
  const { counts, earnings: earn } = summary;

    [toPay, 'Orders waiting for your Taobao payment', '#/orders', 'bad'],
    [summary.problems, 'Orders with a purchase problem', '#/orders', 'bad'],

    [counts.unavailable, 'Products unavailable at the supplier', '#/products', 'warn'],

    [summary.preparing, 'Orders being prepared', '#/orders', ''],

  ].filter((r) => r[0] > 0);

}

/** Small CSV reader (quotes, commas and new lines inside quotes; comma or semicolon separated). */
function parseCsv(text) {
  text = text.replace(/^\ufeff/, '');
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = []; let cell = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; continue; }
    if (ch === '"') q = true; else if (ch === sep) { row.push(cell); cell = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map((h) => h.trim().toLowerCase().replace(/\s+/g, '_'));
  return rows.filter((r) => r.some((c) => c.trim())).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}

function resizeImage(file, max = 1000) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.85, out = c.toDataURL('image/jpeg', q);
      while (out.length > 380 * 1024 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}

const AI_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>';
/**
 * A panel that sends the listing to the AI assistant and shows its suggestions.
 * read() → { title, description, options, category, images }; apply(field, value) puts one suggestion in the form;
 * removePhoto(index) (optional) takes a flagged photo out.
 */
function aiBox(el, { read, apply, removePhoto }) {
  if (!el) return;
  if (!cfg.ai) { el.hidden = true; return; }
  el.innerHTML = `<div class="row between" style="gap:12px;flex-wrap:wrap"><div class="row" style="gap:10px;flex-wrap:nowrap"><span class="aiicon">${AI_ICON}</span><div><b>AI assistant</b><div class="muted small">Rewrites your title, description and keywords, translates to Arabic and checks your photos. You choose what to use.</div></div></div>
    <button type="button" class="btn sm" id="aigo">Improve with AI</button></div><div id="aiout" class="stack"></div>`;
  const go = el.querySelector('#aigo'); const out = el.querySelector('#aiout');
  go.onclick = async () => {
    const b = read();
    if ((b.title || '').trim().length < 3 && !(b.images || []).length) { out.innerHTML = '<div class="error">Write a title or add a photo first.</div>'; return; }
    go.disabled = true; go.textContent = 'Thinking…';
    out.innerHTML = '<div class="skeleton" style="height:120px"></div><p class="muted small" style="margin:0">This takes about 10–20 seconds.</p>';
    try {
      const r = await api('/api/seller/ai/listing', 'POST', { ...b, lang: KinanLang.lang });
      const sug = [['title', 'Title', r.title], ['description', 'Description', r.description], ['keywords', 'Search keywords', (r.keywords || []).join(', ')], ['title_ar', 'Arabic title', r.title_ar], ['description_ar', 'Arabic description', r.description_ar]].filter(([, , v]) => v);
      const cat = r.category && (cfg.categories || []).find((c) => c.id === r.category);
      const V = { good: ['Good', 'ok'], fix: ['Improve', 'warn'], remove: ['Remove', 'bad'] };
      out.innerHTML = `<div class="row between"><b>Suggestions</b><button type="button" class="btn sm" id="aiall">Use all</button></div>
        ${sug.map(([k, label, v]) => `<div class="aisug"><div class="row between"><span class="muted small">${label}</span><button type="button" class="btn sm ghost" data-ai="${k}">Use</button></div><div class="aitext" ${/_ar$/.test(k) ? 'dir="rtl"' : 'dir="auto"'} data-no-tr>${esc(v)}</div></div>`).join('')}
        ${cat ? `<div class="aisug"><div class="row between"><span class="muted small">Category</span><button type="button" class="btn sm ghost" data-ai="category">Use</button></div><div class="aitext">${esc(KinanLang.lang === 'ar' && cat.ar ? cat.ar : cat.en)}</div></div>` : ''}
        ${(r.photos || []).length ? `<div class="stack" style="gap:8px"><b>Photo check</b>${r.photos.map((p) => `<div class="aiphoto" data-pi="${p.index}"><span class="pill ${V[p.verdict][1]}">${V[p.verdict][0]}</span><span><b><span>Photo</span> ${p.index}</b>${p.issues.length ? `<span class="muted small" style="display:block" data-no-tr>${p.issues.map(esc).join(' · ')}</span>` : ''}</span>${p.verdict === 'remove' && removePhoto ? `<button type="button" class="btn sm quiet" data-airm="${p.index}">Remove photo</button>` : ''}</div>`).join('')}</div>` : ''}
        ${(r.tips || []).length ? `<div class="stack" style="gap:4px"><b>Tips</b><ul class="small" style="margin:0;padding-inline-start:18px" data-no-tr>${r.tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
        <p class="muted small" style="margin:0"><span>Check the text before saving — you are responsible for what your listing says.</span> <span>AI uses left today:</span> ${r.uses_left_today}</p>`;
      const vals = Object.fromEntries([...sug.map(([k, , v]) => [k, v]), ...(cat ? [['category', cat.id]] : [])]);
      const use = (k, btn) => { apply(k, vals[k]); if (btn) { btn.textContent = 'Used ✓'; btn.disabled = true; } };
      out.querySelectorAll('[data-ai]').forEach((b2) => b2.onclick = () => use(b2.dataset.ai, b2));
      out.querySelector('#aiall').onclick = () => { out.querySelectorAll('[data-ai]').forEach((b2) => use(b2.dataset.ai, b2)); toast('Suggestions added — check them, then save'); };
      // Remove flagged photos from the highest number down so the numbers stay right
      out.querySelectorAll('[data-airm]').forEach((b2) => b2.onclick = () => {
        const i = Number(b2.dataset.airm);
        removePhoto(i - 1);
        out.querySelectorAll('[data-airm]').forEach((x) => { if (Number(x.dataset.airm) > i) x.dataset.airm = Number(x.dataset.airm) - 1; });
        b2.closest('.aiphoto').remove();
      });
    } catch (e) { out.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    go.disabled = false; go.textContent = 'Improve again';
  };
}

/** "CAINIAO_FULFILLMENT_STD" → "Cainiao": carrier codes from suppliers are not for people. */
function carrierName(c) {
  const k = String(c || '').trim(); if (!k) return '';
  const known = { CAINIAO: 'Cainiao', YANWEN: 'Yanwen', '4PX': '4PX', YUNEXPRESS: 'YunExpress', YUN: 'YunExpress', CNE: 'CNE', SUNYOU: 'SunYou', UBI: 'UBI', DHL: 'DHL', FEDEX: 'FedEx', UPS: 'UPS', EMS: 'EMS', USPS: 'USPS', ROYALMAIL: 'Royal Mail', CORREOS: 'Correos', POSTNL: 'PostNL', GLS: 'GLS', DPD: 'DPD', SF: 'SF Express', CJPACKET: 'CJPacket' };
  const first = k.split(/[_\s-]+/)[0].toUpperCase();
  if (known[first]) return known[first];
  return /^[A-Z0-9_]+$/.test(k) ? k.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, (m) => m.toUpperCase()) : k;
}
function orderRow(o) {
  const p = o.purchase;
  const due = p && /WAIT_BUYER_P/.test(p.status);
  const tone = (st) => (['delivered', 'shipped'].includes(st) ? 'ok' : ['cancelled', 'refunded'].includes(st) ? 'bad' : 'warn');
  // Direct (supplier-to-customer) purchases describe the same thing as the order status in more detail: show one pill.
  const pills = p && p.direct
    ? pill(p.status_label, ['AE_SHIPPED', 'AE_DELIVERED'].includes(p.status) ? 'ok' : p.status === 'AE_CANCELLED' ? 'bad' : 'warn')
    : pill(o.status_label, tone(o.status)) + (p ? pill(p.manual ? p.status_label : `Taobao: ${p.status_label}`, PO_STATUS_CLS(p.status)) : '');
  const purchases = o.purchases || (p ? [p] : []);
  const parcels = purchases.map((part, i) => {
    const links = (part.logistics || []).map((x) => {
      const label = `<span>${esc(carrierName(x.carrier) || 'Carrier')}</span> <bdi dir="ltr" class="trk">${esc(x.tracking)}</bdi>`;
      return x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${label}</a>` : label;
    }).join('<br>');
    return `<div class="otrack small"><span class="muted">${purchases.length > 1 ? `Parcel ${i + 1} · ` : ''}${part.direct ? 'To the customer' : 'To warehouse'}</span>
      <div>${esc(part.status_label)}${links ? '<br>' + links : ''}</div>
      ${part.error ? `<div class="small bad">${esc(part.error)}</div>` : ''}
      ${part.direct ? K.journey(part.track, { seller: true, key: part.logistics?.[0]?.tracking && o.id.slice(-8).toUpperCase() + ':' + part.logistics[0].tracking }) : ''}</div>`;
  }).join('');
  const items = o.lines.reduce((n, l) => n + l.qty, 0);
  // closed by default: the summary shows what to scan (order, amount, first item, status); the rest opens on tap
  return `<details class="ocard" data-order="${esc(o.id)}">
    <summary><header class="ohead"><div><b>Order <bdi dir="ltr">${esc(o.id.slice(-8).toUpperCase())}</bdi></b><div class="muted small">${date(o.created_at)}</div></div>
      <div class="oamt"><b>${money(o.revenue, o.currency)}</b>${o.cost_cny ? `<span class="muted small">cost ¥${num(o.cost_cny)}</span>` : ''}</div></header>
      <div class="osum"><span class="ot" dir="auto">${items}× ${esc(o.lines[0]?.title || '')}${o.lines.length > 1 ? ` <span class="muted">+${o.lines.length - 1} more</span>` : ''}</span>${pills}<svg class="ochev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></div></summary>
    <div class="obody">
    <ul class="olines">${o.lines.map((l) => `<li><span class="qty">${l.qty}×</span><span dir="auto">${esc(l.title)}${l.props ? ` <span class="muted">(${esc(variantLabel(l.props))})</span>` : ''}</span></li>`).join('')}</ul>
    <div class="row opills">${pills}${due && p.pay_deadline ? `<span class="small bad">Pay by ${date(p.pay_deadline)}</span>` : ''}</div>
    ${parcels}
    <div class="row oacts">${due && !cfg.taobao_kinan ? `<button class="btn sm" data-pay="${esc(o.id)}">Pay Taobao</button>` : ''}${purchases.some((part) => !part.manual && (!part.direct || (part.logistics || []).length)) ? `<button class="btn sm ghost" data-osync="${esc(o.id)}">${p.direct ? 'Refresh tracking' : 'Refresh'}</button>` : ''}<button class="btn sm quiet" data-msgs="${esc(o.id)}">Messages</button></div>
    ${isCancelled(o) ? `<div class="row"><button type="button" class="btn sm ghost" data-ohide="${esc(o.id)}">Remove from my list</button></div>` : ''}
    <div class="stack" data-mbox="${esc(o.id)}" hidden></div></div></details>`;
}
/** Cancelled or refunded for this seller: nothing left to do, so these sit apart and can be removed from the list. */
function isCancelled(o) {
  const parts = o.purchases || (o.purchase ? [o.purchase] : []);
  return ['cancelled', 'refunded'].includes(o.status) || (parts.length > 0 && parts.every((part) => /CANCEL/i.test(part.status || '')));
}
function wireOrderActions() {
  $$('[data-pay]').forEach((b) => b.onclick = async () => { if (!confirm('Pay this purchase order from your Taobao Distribution account balance?')) return; b.disabled = true; try { await api(`/api/seller/orders/${b.dataset.pay}/pay`, 'POST'); toast('Payment sent to Taobao'); } catch (e) { toast(e.message); } route(); });
  $$('[data-osync]').forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/api/seller/orders/${b.dataset.osync}/sync`, 'POST'); toast('Order updated'); } catch (e) { toast(e.message); } route(); });
  $$('[data-ohide]').forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/api/seller/orders/${b.dataset.ohide}/hide`, 'POST'); b.closest('details.ocard')?.remove(); toast('Removed from your list'); } catch (e) { b.disabled = false; toast(e.message); } });
  const all = $('#ohideall'); if (all) all.onclick = async () => { if (!confirm('Remove all cancelled orders from your list? Kinan keeps its records; they just stop showing here.')) return; all.disabled = true; try { const r = await api('/api/seller/orders/hide-cancelled', 'POST'); toast(`${r.hidden} removed from your list`); } catch (e) { toast(e.message); } route(); };
}
async function orders() {
  const v = $('#view'); v.innerHTML = '<div class="skeleton" style="height:240px"></div>';
  const result = await api(`/api/seller/orders?page=${orderPage}`);
  orderPage = result.page;
  const list = result.items;
  const cancelled = list.filter(isCancelled); const active = list.filter((o) => !isCancelled(o));
  v.innerHTML = `<div class="head"><div><h1>Orders</h1><p class="muted">${cfg.taobao_kinan ? 'Kinan orders and pays the supplier for every order and ships it to the customer — nothing to do on your side. ' : shop.taobao?.connected ? `For products imported from Taobao, Kinan creates a purchase order from your account. ${shop.auto_pay ? 'Automatic payment is on.' : 'Pay each one before its deadline.'} Kinan buys AliExpress and manually added products for you.` : 'Kinan buys AliExpress and manually added products for you.'}</p></div></div>
    <section class="panel">${active.map(orderRow).join('') || `<div class="empty"><h3>${cancelled.length ? 'No open orders' : 'No orders yet'}</h3><p>Paid orders for your products appear here.</p></div>`}</section>

    <p class="muted">Buyer names and addresses stay private. Kinan takes care of delivery to the buyer.</p>`;
  v.insertAdjacentHTML('beforeend', sellerPager(result));
  wireSellerPager((page) => { orderPage = page; orders(); });
  wireOrderActions();
  $$('[data-msgs]').forEach((b) => b.onclick = async () => {
    const box = $(`[data-mbox="${b.dataset.msgs}"]`); box.hidden = !box.hidden; if (box.hidden) return;
    const paint = async () => {
      const ms = await api(`/api/seller/orders/${b.dataset.msgs}/messages`).catch(() => []);
      box.innerHTML = `${ms.map((m) => `<div class="small" style="padding:8px 10px;border-radius:12px;background:${m.from === 'seller' ? 'var(--jade-soft)' : 'var(--chip)'}"><b>${esc(m.from === 'seller' ? 'You' : m.name)}</b> <span class="muted">${date(m.at)}</span><div dir="auto">${esc(m.text)}</div></div>`).join('') || '<span class="muted small">No messages yet. Customers can write to you about this order.</span>'}

    };
    paint();
  });
}

      ${d.products.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Product</th><th>Status</th><th>eBay price</th><th></th></tr></thead><tbody>${d.products.map((p) => `<tr><td>${esc(p.title)}${p.reason && p.status !== 'live' ? `<div class="muted small">${esc(p.reason)}</div>` : ''}</td><td>${stLabel[p.status] || ''}</td><td>${p.price != null ? esc(String(p.price)) : '—'}</td><td>${p.status === 'live' ? `<button class="btn sm quiet" data-ebend="${esc(p.id)}">End</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No CJ products yet — add products from CJdropshipping first.</p>'}</div>
    <div class="card"><h2>eBay orders</h2>${d.orders.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>eBay order</th><th>Items</th><th>Sold for</th><th>eBay fees</th><th>Product + delivery</th><th>Kinan ${d.pct}%</th><th>Your share</th><th>Status</th></tr></thead><tbody>${d.orders.map((o) => `<tr><td>${date(o.created)}</td><td>${esc(o.ebay_order || '')}</td><td class="small">${esc(o.items)}</td><td>${m(o.money.revenue)}</td><td>${m(o.money.fees)}</td><td>${m(o.money.goods + o.money.ship)}</td><td>${m(o.money.cut)}</td><td><b>${m(o.money.seller_net)}</b></td><td>${o.to_pay ? `<button class="btn sm" data-ebpay="${esc(o.id)}">Pay ${m(o.to_pay)} to ship</button>` : esc(o.status)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No eBay orders yet. They appear here within 15 minutes of being paid on eBay.</p>'}

        <div class="error" id="we"></div><button class="btn" style="justify-self:start">Request withdrawal</button></form>`}

    </section>
    <section class="panel stack" style="max-width:720px"><div><h2>Account statement</h2><p class="muted small" style="margin:4px 0 0">A PDF of your sales, Kinan commission, refunds and withdrawals for a period, with your balance.</p></div>
      <div class="seg" id="stp"><button type="button" data-p="this">This month</button><button type="button" data-p="last">Last month</button><button type="button" data-p="3m">Last 3 months</button><button type="button" data-p="year">This year</button></div>
      <div class="grid-2"><label class="field">From<input type="date" id="stfrom"></label><label class="field">To<input type="date" id="stto"></label></div>
      <div class="row"><button type="button" class="btn" id="stdl">Download PDF</button><span class="error" id="ste"></span></div></section>
    <section class="panel"><h2 style="margin-bottom:8px">History</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Order</th><th>Sales</th><th>Kinan commission</th><th>Cost</th><th>You earn</th><th>Status</th></tr></thead><tbody>
      ${e.entries.map((x) => `<tr><td class="muted">${date(x.created_at, false)}</td><td><code>${esc(String(x.order_id).slice(-8).toUpperCase())}</code>${x.type === 'refund' ? ' <span class="pill bad">Refund</span>' : ''}</td><td>${money(x.gross, x.currency)}</td><td class="muted">−${money(x.commission, x.currency)}</td><td class="muted">${x.cost ? `−${money(x.cost, x.currency)}` : '—'}</td><td><b>${money(x.net, x.currency)}</b></td><td>${pill(...(ST[x.status] || [x.status, '']))}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No earnings yet.</td></tr>'}
    </tbody></table></div></section>
    <p class="muted">Earnings become available when the buyer receives the order. Your earnings are your sale price minus the product cost, minus Kinan’s commission: ${esc(shop.profit_commission_pct ?? 20)}% of your profit (sale price − cost) for products Kinan supplies or buys for you, or ${esc(shop.commission_pct)}% of the sale price for products you ship yourself.</p>`;
  // Account statement
  const iso = (dt) => dt.toISOString().slice(0, 10);
  const setPeriod = (k) => {
    const n = new Date(); const y = n.getUTCFullYear(); const m = n.getUTCMonth();
    const r = { this: [new Date(Date.UTC(y, m, 1)), n], last: [new Date(Date.UTC(y, m - 1, 1)), new Date(Date.UTC(y, m, 0))], '3m': [new Date(Date.UTC(y, m - 2, 1)), n], year: [new Date(Date.UTC(y, 0, 1)), n] }[k];
    $('#stfrom').value = iso(r[0]); $('#stto').value = iso(r[1]);
    $$('#stp button').forEach((b) => b.classList.toggle('on', b.dataset.p === k));
  };
  $$('#stp button').forEach((b) => b.onclick = () => setPeriod(b.dataset.p)); setPeriod('this');
  ['#stfrom', '#stto'].forEach((q) => $(q).onchange = () => $$('#stp button').forEach((b) => b.classList.remove('on')));
  $('#stdl').onclick = async () => {
    const btn = $('#stdl'); $('#ste').textContent = ''; btn.disabled = true; btn.textContent = 'Preparing…';
    try {
      const r = await fetch(`/api/seller/statement.pdf?from=${encodeURIComponent($('#stfrom').value)}&to=${encodeURIComponent($('#stto').value)}`, { credentials: 'same-origin' });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not make the statement');
      const name = (r.headers.get('content-disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'Kinan-statement.pdf';
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { $('#ste').textContent = e.message; }
    btn.disabled = false; btn.textContent = 'Download PDF';
  };
  // payout accounts
  let ptype = 'bank';
  const pmPaint = () => { $$('#pmt button').forEach((b) => b.classList.toggle('on', b.dataset.t === ptype)); $('#pmbank').hidden = ptype !== 'bank'; $('#pmmail').hidden = ptype === 'bank'; $('#pmpid').hidden = ptype !== 'payoneer'; $('#pmmaill').textContent = `${({ paypal: 'PayPal', payoneer: 'Payoneer', wise: 'Wise' })[ptype] || ''} account email`; };
  if ($('#pmf')) {
    $$('#pmt button').forEach((b) => b.onclick = () => { ptype = b.dataset.t; pmPaint(); }); pmPaint();
    $('#pmf').onsubmit = async (ev) => {
      ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); $('#pme').textContent = '';
      try { await api('/api/seller/payout-methods', 'POST', { type: ptype, ...f }); toast('Account added — Kinan will send the test payment'); earnings(); }
      catch (err) { $('#pme').textContent = err.message; }
    };
  }
  $$('[data-pmc]').forEach((f) => f.onsubmit = async (ev) => {
    ev.preventDefault();
    try { await api(`/api/seller/payout-methods/${f.dataset.pmc}/confirm`, 'POST', { amount: f.amount.value }); toast('Account confirmed ✓'); } catch (err) { toast(err.message); }
    earnings();
  });
  $$('[data-pmd]').forEach((b) => b.onclick = async () => { try { await api(`/api/seller/payout-methods/${b.dataset.pmd}/default`, 'POST'); earnings(); } catch (err) { toast(err.message); } });
  $$('[data-pmx]').forEach((b) => b.onclick = async () => { if (!confirm('Remove this payout account?')) return; try { await api(`/api/seller/payout-methods/${b.dataset.pmx}`, 'DELETE'); earnings(); } catch (err) { toast(err.message); } });
  const sg = $('#stripego'); if (sg) sg.onclick = async () => { sg.disabled = true; try { const r = await api('/api/seller/stripe/onboard', 'POST'); location.href = r.url; } catch (err) { toast(err.message); sg.disabled = false; } };
  const wf = $('#wf'); if (!wf) return;
  const feeLine = () => {
    const a = Number(wf.amount.value) || 0; const t = wf.method_id.selectedOptions[0]?.dataset.type; const r = (R.methods || {})[t] || {};
    const fee = Math.min(a, Math.round(((r.fee_fixed || 0) + a * (r.fee_pct || 0) / 100) * 100) / 100);
    $('#wfee').innerHTML = `${r.min ? `Minimum to this account: ${money(r.min, e.currency)}. ` : ''}${fee ? `Fee: ${money(fee, e.currency)} · <b>You receive ${money(a - fee, e.currency)}</b>` : `No fee · <b>You receive ${money(a, e.currency)}</b>`}`;
  };
  wf.amount.oninput = feeLine; wf.method_id.onchange = feeLine; feeLine();
  wf.onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; $('#we').textContent = '';
    try { await api('/api/seller/payouts', 'POST', { amount: Number(f.amount.value), method_id: f.method_id.value }); toast('Withdrawal requested'); earnings(); }
    catch (err) { $('#we').textContent = err.message; }
  };
}

// ---------- settings ----------
function settings() {
  $('#view').innerHTML = `<div class="head"><h1>Account</h1></div>
    <div style="max-width:640px;margin-bottom:16px">${KinanLang.folded('Language', 'The Seller Center and Kinan’s emails to you use this language.', 'panel')}</div>
    <form class="panel stack" id="stf" style="max-width:640px"><h2>Shop</h2>
      <label class="field">Shop name<input name="shop_name" required maxlength="80" value="${esc(shop.shop_name)}"></label>
      <div class="row" style="gap:14px"><div id="logoprev"></div><div class="stack" style="gap:6px"><b>Shop logo</b><span class="muted small">Square PNG, JPEG or WebP. Shown to customers in Kinan Shop.</span>
        <div class="row"><label class="btn sm quiet" style="cursor:pointer">Upload<input type="file" accept="image/png,image/jpeg,image/webp" id="logofile" hidden></label><button type="button" class="btn sm ghost" id="logorm">Remove</button></div></div></div>
      <label class="field">Shop description<textarea name="description" maxlength="600" rows="3" placeholder="What you sell and why customers will love it">${esc(shop.description || '')}</textarea></label>
      <label class="field">Return policy<textarea name="return_policy" maxlength="1500" rows="4" placeholder="e.g. Returns accepted within 7 days of delivery only if the item arrives damaged or different from the listing.">${esc(shop.return_policy || '')}</textarea><span class="muted small">Shown on your shop page and on every product. Keep it clear — international returns are expensive.</span></label>
      <label class="field">Default markup on Taobao cost (%)<input name="default_markup_pct" type="number" min="0" max="500" value="${esc(shop.default_markup_pct)}"></label>
      <div class="row"><button class="btn">Save</button><span class="muted">Commission: ${esc(shop.profit_commission_pct ?? 20)}% of profit (${esc(shop.commission_pct)}% of the price on products you ship yourself) · Status: ${esc(shop.status)}</span></div>
    </form>
    ${shop.status === 'active' ? `<section class="panel row between" style="max-width:640px"><span><b>Your shop in Kinan Shop</b><br><span class="muted small">See your store the way customers do.</span></span><a class="btn sm ghost" href="/#/s/${esc(shop.id)}" target="_blank" rel="noopener">View shop</a></section>` : ''}
    <section class="stack" style="max-width:640px">${taobaoCard()}</section>
    <section class="panel stack" style="max-width:640px"><h2>Install the app</h2>
      <p class="muted">Add the Seller Center to your phone’s home screen. On iPhone: Share, then “Add to Home Screen”. On Android: menu, then “Install app”.</p>
      <div class="row">${KinanTheme.button('btn ghost', true)}<button class="btn quiet" id="installbtn" style="display:none">Install Seller Center</button><button class="btn danger" data-out>Sign out</button></div></section>
`;
  wireConnect(); wireInstall();
  $$('[data-out]').forEach((b) => b.onclick = signOut);
  let logo = shop.logo || null;
  const paintLogo = () => { $('#logoprev').innerHTML = logo ? `<img src="${esc(logo)}" alt="Shop logo" style="width:64px;height:64px;border-radius:16px;object-fit:cover;border:1px solid var(--line)">` : `<div style="width:64px;height:64px;border-radius:16px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:24px">${esc((shop.shop_name || '?').charAt(0).toUpperCase())}</div>`; $('#logorm').style.display = logo ? '' : 'none'; };
  paintLogo();
  $('#logorm').onclick = () => { logo = null; paintLogo(); };
  $('#logofile').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { // resize to 256px square to keep it small
      const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
      const m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 256, 256);
      logo = c.toDataURL('image/jpeg', 0.85); URL.revokeObjectURL(url); paintLogo();
    };
    img.onerror = () => toast('Could not read that image');
    img.src = url;
  };
  const pb = document.createElement('section'); pb.className = 'panel stack'; pb.style.maxWidth = '640px'; pb.style.marginTop = '14px'; $('#stf').after(pb); K.pushPanel(pb, 'seller');
  $('#stf').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target;
    try { shop = await api('/api/seller/me', 'PATCH', { shop_name: f.shop_name.value.trim(), logo, description: f.description.value, return_policy: f.return_policy.value, default_markup_pct: Number(f.default_markup_pct.value) }); toast('Settings saved'); route(); }
    catch (err) { toast(err.message); }
  };
}

// ---------- auth ----------
// ---------- seller identity verification (KYC) ----------
const ID_TYPES = [['passport', 'Passport'], ['national_id', 'National ID card'], ['residence_permit', 'Residence permit'], ['driving_licence', 'Driving licence']];
function needsVerification() { return shop && shop.status === 'pending'; }
async function verifyScreen() {
  document.body.classList.remove('has-tabbar');
  const k = await api('/api/seller/verification');
  const top = `<div class="top">${K.brand('Seller Center')}<span class="row" style="gap:6px">${KinanTheme.button('btn sm ghost')}<button class="btn sm ghost" data-out>Sign out</button></span></div>`;
  if (k.state === 'submitted') {
    $('#app').innerHTML = `<div class="kyc">${top}<section class="panel stack" style="text-align:center;justify-items:center;padding:28px 18px">
      <div style="font-size:44px">⏳</div><h2>Your application is being reviewed</h2>
      <p class="muted">Thank you, ${esc(k.details?.full_name || '')}. Kinan checks your details and documents, usually within 1–2 working days. We will email you and you can start adding products as soon as your shop is approved.</p>
      <div class="muted small">Sent ${new Date(k.submitted_at).toLocaleString()}</div>
      <button class="btn ghost" id="kref">Check again</button></section></div>${K.footer(cfg.operator?.name)}`;
    $$('[data-out]').forEach((b) => b.onclick = signOut);
    $('#kref').onclick = async () => { await refreshShop(); route(); };
    return;
  }
  const d = k.details || {};
  const cs = KinanLang.sortCountries(cfg.countries || []);
  const cSel = (name, cur) => `<select name="${name}" required><option value="">Choose…</option>${cs.map(([c, n]) => `<option value="${esc(c)}" ${c === cur ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const photos = { id_front: null, id_back: null, selfie: null };
  $('#app').innerHTML = `<div class="kyc">${top}
    <div class="stack" style="gap:6px"><h1 style="margin:0">Verify your identity</h1><p class="muted" style="margin:0">To keep Kinan safe for customers, every seller confirms who they are before opening a shop. It takes about 3 minutes.</p>
      <div class="steps"><span>1 · Your details</span><span>2 · Your shop</span><span>3 · ID document</span><span>4 · Live selfie</span></div></div>
    ${k.state === 'rejected' ? `<div class="banner" style="background:color-mix(in srgb,var(--bad) 10%,var(--surface))"><div><b>Please correct your application</b><div class="small">${esc(k.reason || '')}</div></div></div>` : ''}
    <form id="kf" class="stack" style="gap:16px" novalidate>
      <section class="panel stack"><h3><i>1</i>Your details</h3>
        <label class="field">Full name (as on your document)<input name="full_name" required maxlength="100" autocomplete="name" value="${esc(d.full_name || me.name || '')}"></label>
        <div class="grid-2"><label class="field">Date of birth<input name="date_of_birth" type="date" required value="${esc(d.date_of_birth || '')}"></label>
          <label class="field">Nationality${cSel('nationality', d.nationality)}</label></div>
        <label class="field">Phone number (with country code)<input name="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="+356 …" value="${esc(d.phone || '')}"></label>
        <div class="grid-2"><label class="field">Country you live in${cSel('country', d.country)}</label>
          <label class="field">City<input name="city" required maxlength="80" autocomplete="address-level2" value="${esc(d.city || '')}"></label></div>
        <label class="field">Address<input name="address" required maxlength="300" autocomplete="street-address" value="${esc(d.address || '')}"></label>
        <label class="field">Postal code <span class="muted">(optional)</span><input name="postal_code" maxlength="20" autocomplete="postal-code" value="${esc(d.postal_code || '')}"></label>
      </section>
      <section class="panel stack"><h3><i>2</i>Your shop</h3>
        <label class="field">Shop name<input name="shop_name" required maxlength="80" value="${esc(d.shop_name || (shop.shop_name || '').replace(/'s Shop$/, '') || '')}"></label>
        <div class="seg" id="btype"><button type="button" data-b="individual" class="${d.business_type !== 'company' ? 'on' : ''}">Individual</button><button type="button" data-b="company" class="${d.business_type === 'company' ? 'on' : ''}">Company</button></div>
        <div class="grid-2" id="cofields" ${d.business_type === 'company' ? '' : 'hidden'}><label class="field">Company name<input name="company_name" maxlength="120" value="${esc(d.company_name || '')}"></label>
          <label class="field">Registration number <span class="muted">(optional)</span><input name="company_number" maxlength="60" value="${esc(d.company_number || '')}"></label></div>
        <label class="field">What will you sell? <span class="muted">(optional)</span><input name="products" maxlength="300" placeholder="e.g. clothes, phone accessories" value="${esc(d.products || '')}"></label>
      </section>
      <section class="panel stack"><h3><i>3</i>Identity document</h3>
        <div class="grid-2"><label class="field">Document type<select name="id_type" required>${ID_TYPES.map(([v, t]) => `<option value="${v}" ${v === (d.id_type || 'passport') ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
          <label class="field">Document number<input name="id_number" required maxlength="40" value="${esc(d.id_number || '')}"></label></div>
        <label class="field">Expiry date <span class="muted">(optional)</span><input name="id_expiry" type="date" value="${esc(d.id_expiry || '')}"></label>
        <p class="muted small" style="margin:0">Take clear photos of the whole document: all 4 corners visible, no glare, text readable.</p>
        <div class="grid-2">
          <div class="docbox" data-doc="id_front"><b id="lblfront">Photo page / front</b><div data-prev>${k.has?.id_front ? '<span class="ok small">✓ Already sent — add a new one only to replace it</span>' : ''}</div><label class="btn sm ghost" style="cursor:pointer">Take or choose photo<input type="file" accept="image/*" hidden></label></div>
          <div class="docbox" data-doc="id_back" id="backbox"><b>Back side</b><div data-prev>${k.has?.id_back ? '<span class="ok small">✓ Already sent</span>' : ''}</div><label class="btn sm ghost" style="cursor:pointer">Take or choose photo<input type="file" accept="image/*" hidden></label></div>
        </div>
      </section>
      <section class="panel stack"><h3><i>4</i>Live selfie</h3>
        <p class="muted small" style="margin:0">Take a selfie now with your camera so we can match your face to your document. Face the camera in good light, without glasses or a hat.</p>
        <div class="cam" id="cam"><div class="oval"></div></div>
        <div class="row"><button type="button" class="btn" id="camstart">Open camera</button><button type="button" class="btn" id="snap" hidden>Take selfie</button><button type="button" class="btn ghost" id="retake" hidden>Retake</button>
          <label class="btn ghost" id="camalt" hidden style="cursor:pointer">Use phone camera<input type="file" accept="image/*" capture="user" hidden></label></div>
        <div class="small" id="selfiest">${k.has?.selfie ? '<span class="ok">✓ Selfie already sent — take a new one only to replace it</span>' : ''}</div>
      </section>
      <label class="row" style="gap:10px;align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" name="agree" style="margin-top:4px;flex:none;width:20px;height:20px"><span class="small">I confirm that this information is true and belongs to me, and I agree to the <a href="/seller-terms" target="_blank">Seller Terms</a> and <a href="/privacy" target="_blank">Privacy Policy</a>. Kinan uses my documents only to verify my identity.</span></label>
      <div class="error" id="kerr"></div>
      <button class="btn" id="ksend" style="min-height:52px">Send for approval</button>
    </form></div>${K.footer(cfg.operator?.name)}`;
  $$('[data-out]').forEach((b) => b.onclick = signOut);
  const f = $('#kf');
  let btype = d.business_type === 'company' ? 'company' : 'individual';
  $$('#btype button').forEach((b) => b.onclick = () => { btype = b.dataset.b; $$('#btype button').forEach((x) => x.classList.toggle('on', x === b)); $('#cofields').hidden = btype !== 'company'; });
  const paintDocType = () => { const pass = f.id_type.value === 'passport'; $('#backbox').style.display = pass ? 'none' : ''; $('#lblfront').textContent = pass ? 'Photo page' : 'Front side'; };
  f.id_type.onchange = paintDocType; paintDocType();
  $$('[data-doc]').forEach((box) => { box.querySelector('input').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try { photos[box.dataset.doc] = await resizeImage(file, 1600); box.querySelector('[data-prev]').innerHTML = `<img src="${photos[box.dataset.doc]}" alt="">`; } catch (err) { toast(err.message); }
  }; });
  // Live selfie with the front camera; phones without camera access in the browser use the camera app instead
  let stream = null;
  const stop = () => { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } };
  const showShot = (src) => { $('#cam').innerHTML = `<img src="${src}" alt="Your selfie"><div class="oval"></div>`; $('#snap').hidden = true; $('#retake').hidden = false; $('#camstart').hidden = true; $('#selfiest').innerHTML = '<span class="ok">✓ Selfie taken</span>'; };
  const start = async () => {
    $('#selfiest').textContent = '';
    if (!navigator.mediaDevices?.getUserMedia) { $('#camalt').hidden = false; $('#camstart').hidden = true; $('#selfiest').textContent = 'Tap “Use phone camera” to take your selfie.'; return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
      $('#cam').innerHTML = '<video autoplay playsinline muted></video><div class="oval"></div>';
      const v = $('#cam video'); v.srcObject = stream; await v.play().catch(() => {});
      $('#snap').hidden = false; $('#camstart').hidden = true; $('#retake').hidden = true;
    } catch { $('#camalt').hidden = false; $('#selfiest').textContent = 'Camera permission was not given. Allow the camera for kinan.shop, or tap “Use phone camera”.'; }
  };
  $('#camstart').onclick = start;
  $('#retake').onclick = () => { photos.selfie = null; start(); };
  $('#snap').onclick = () => {
    const v = $('#cam video'); if (!v || !v.videoWidth) return;
    const sz = Math.min(v.videoWidth, v.videoHeight, 1200); const c = document.createElement('canvas');
    c.width = Math.round(sz * 3 / 4); c.height = sz;
    const x = c.getContext('2d'); const sw = v.videoHeight * 3 / 4; x.drawImage(v, (v.videoWidth - sw) / 2, 0, sw, v.videoHeight, 0, 0, c.width, c.height);
    photos.selfie = c.toDataURL('image/jpeg', 0.85); stop(); showShot(photos.selfie);
  };
  $('#camalt input').onchange = async (e) => { const file = e.target.files[0]; if (!file) return; try { photos.selfie = await resizeImage(file, 1200); showShot(photos.selfie); } catch (err) { toast(err.message); } };
  window.addEventListener('hashchange', stop, { once: true });
  f.onsubmit = async (e) => {
    e.preventDefault(); $('#kerr').textContent = '';
    const v = Object.fromEntries(new FormData(f));
    if (!photos.id_front && !k.has?.id_front) { $('#kerr').textContent = 'Add a photo of your document.'; return; }
    if (f.id_type.value !== 'passport' && !photos.id_back && !k.has?.id_back) { $('#kerr').textContent = 'Add a photo of the back of your document.'; return; }
    if (!photos.selfie && !k.has?.selfie) { $('#kerr').textContent = 'Take your live selfie.'; return; }
    if (!v.agree) { $('#kerr').textContent = 'Please confirm that the information is true.'; return; }
    const btn = $('#ksend'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await api('/api/seller/verification', 'POST', { ...v, business_type: btype, agree: true, id_front: photos.id_front, id_back: f.id_type.value === 'passport' ? null : photos.id_back, selfie: photos.selfie, selfie_live: Boolean(photos.selfie) });
      stop(); await refreshShop(); toast('Sent to Kinan for approval'); verifyScreen(); window.scrollTo(0, 0);
    } catch (err) { $('#kerr').textContent = err.message; btn.disabled = false; btn.textContent = 'Send for approval'; }
  };
}
// The Kinan Seller guide (PDF, English and Arabic) — on the sign-up page and in the Seller Center
const guideBox = () => `<div class="panel stack" style="gap:8px;background:var(--soft,#f0fdfa)">
    <b>📘 How to use Kinan Seller</b><span class="muted small">A short step-by-step guide: opening your shop, adding products, orders, earnings and eBay.</span>
    <div class="row" style="gap:8px;flex-wrap:wrap"><a class="btn ghost sm" href="/assets/kinan-seller-guide-en.pdf" download target="_blank">⬇ Guide (English) PDF</a><a class="btn ghost sm" href="/assets/kinan-seller-guide-ar.pdf" download target="_blank">⬇ الدليل بالعربية PDF</a></div></div>`;
// Sellers who joined before the current Seller Terms (or with Google/Facebook) accept them once
function termsScreen(msg = '') {
  document.body.classList.remove('has-tabbar');
  $('#app').innerHTML = `<div class="auth"><form class="panel stack" id="tf">
      <div class="row between">${K.brand('Seller Center')}</div>
      <h2>Please accept the Seller Terms</h2>
      <p class="muted">To keep selling on Kinan, read and accept the current <a href="/seller-terms" target="_blank">Seller Terms</a> (version ${esc(shop.terms_version || '')}). They explain what you may sell, how orders, commission and payouts work, and your rights.</p>
      <label class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" name="accept" required style="width:22px;height:22px;flex:none;margin-top:2px">
        <span>I have read and accept the <a href="/seller-terms" target="_blank">Seller Terms</a> and the <a href="/privacy" target="_blank">Privacy Policy</a>, and I confirm that I will only sell legal, safe and genuine products.</span></label>
      <div class="error">${esc(msg)}</div>
      <button class="btn">Accept and continue</button>
      ${guideBox()}
      <a class="muted small" href="#" id="tout">Sign out</a></form></div>`;
  $('#tout').onclick = async (e) => { e.preventDefault(); await api('/api/auth/logout', 'POST').catch(() => {}); me = null; authScreen('in'); };
  $('#tf').onsubmit = async (e) => { e.preventDefault(); try { await api('/api/seller/terms', 'POST', { accept: true }); await refreshShop(); route(); } catch (err) { termsScreen(err.message); } };
}

function authScreen(mode = 'in', msg = '') {
  document.body.classList.remove('has-tabbar');
  $('#app').innerHTML = `<div class="auth"><form class="panel stack" id="af">
      <div class="row between">${K.brand('Seller Center')}</div>
      <h2>${mode === 'in' ? 'Sign in to sell on Kinan' : 'Open your Kinan shop'}</h2>
      <div class="seg"><button type="button" data-m="in" class="${mode === 'in' ? 'on' : ''}">Sign in</button><button type="button" data-m="up" class="${mode === 'up' ? 'on' : ''}">Open a shop</button></div>
      ${K.googleButton(cfg, 'seller')}
      <p class="muted small" style="margin:0">Already shopping on Kinan? You can use the same email or Gmail — your shop is a separate account.</p>
      ${mode === 'up' ? '<label class="field">Shop name<input name="shop_name" required maxlength="80"></label><label class="field">Your name<input name="name" required autocomplete="name"></label>' : ''}
      <label class="field">Email<input name="email" type="email" required autocomplete="username"></label>
      <label class="field">Password<input name="password" type="password" required minlength="${mode === 'up' ? 8 : 1}" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}"></label>
      ${mode === 'up' ? `<span class="muted small">At least 8 characters. Kinan reviews new shops before they can publish.</span>
        <label class="row" style="gap:10px;align-items:flex-start"><input type="checkbox" name="accept_terms" required style="width:22px;height:22px;flex:none;margin-top:2px">
          <span>I have read and accept the <a href="/seller-terms" target="_blank">Seller Terms</a> and the <a href="/privacy" target="_blank">Privacy Policy</a>, and I confirm that I will only sell legal, safe and genuine products.</span></label>` : ''}
      <div class="error">${esc(msg)}</div>
      <button class="btn">${mode === 'in' ? 'Sign in' : 'Open shop'}</button>
      ${mode === 'up' ? guideBox() : ''}
      <a class="muted" href="/">Go to the Kinan store</a>
    ${mode === 'in' ? '<a class="muted small" href="/reset?app=seller">Forgot your password?</a>' : ''}</form></div>${K.footer(cfg.operator?.name)}`;
  $$('.seg button').forEach((b) => b.onclick = () => authScreen(b.dataset.m));
  $('#af').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try {
      if (mode === 'up') await api('/api/auth/register', 'POST', { ...f, accept_terms: f.accept_terms === 'on', role: 'seller' });
      const r = await api('/api/auth/login', 'POST', { email: f.email, password: f.password, app: 'seller' });
      if (asMe(r.user).role !== 'seller') { await api('/api/auth/logout', 'POST'); return authScreen(mode, 'This is not a seller account. Customers shop at the Kinan store.'); }
      me = asMe(r.user); await refreshShop(); takeNext(); route();
    } catch (err) { authScreen(mode, err.message); }
  };
}
K.onUnauthorized = () => { me = null; authScreen('in', 'Your session ended. Please sign in again.'); };

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; wireInstall(); });
function wireInstall() {
  const b = $('#installbtn'); if (!b) return;
  b.style.display = deferredInstall ? 'inline-flex' : 'none';
  b.onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; b.style.display = 'none'; };
}

(async () => {
  const loginError = K.takeLoginError();
  const params = new URLSearchParams(location.search);
  const connected = params.get('taobao') === 'connected';
  if (params.toString()) history.replaceState(null, '', '/seller' + location.hash);
  cfg = await api('/api/config/public').catch(() => cfg);
  try { const u = asMe(await api('/api/me')); if (u.role === 'seller') { me = u; await refreshShop(); } } catch {}
  // A link from an email (e.g. /seller#/add) must still open that page after signing in — also with Google,
  // which comes back without the #part
  if (!me && location.hash && location.hash !== '#/') rememberNext(location.hash);
  if (me) takeNext();
  if (!me) authScreen('in', loginError); else { route(); if (connected) toast('Taobao account connected'); }
  K.registerSW();
  try { K.presence('seller'); } catch { /* optional */ }
})();
</script>
</body>
</html>
