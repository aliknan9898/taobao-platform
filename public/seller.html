<style>
  .kyc { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 16px; }
  .kyc .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kyc .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .kyc .steps span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--chip, #f1f3f7); color: var(--ink-2); }
  .kyc h3 { display: flex; gap: 10px; align-items: center; margin: 0; }
  .kyc h3 i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--jade); color: #fff; font-size: 14px; }
  .kyc .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .kyc .grid-2 { grid-template-columns: 1fr; } }
  .docbox { border: 1.5px dashed var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 8px; justify-items: start; }
  .docbox img { max-width: 100%; max-height: 180px; border-radius: 10px; object-fit: contain; background: var(--chip, #f1f3f7); }
  .cam { position: relative; width: 100%; max-width: 360px; aspect-ratio: 3 / 4; border-radius: 18px; overflow: hidden; background: #111; }
  .cam video, .cam img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .cam img { transform: none; }
  .cam .oval { position: absolute; inset: 10% 18% 14%; border: 3px solid rgba(255,255,255,.85); border-radius: 50%; pointer-events: none; }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 760px) { .shell { grid-template-columns: minmax(0, 1fr); } }
  .side { position: sticky; top: 0; height: 100vh; padding: 18px 14px; border-inline-end: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 22px; }
  .side nav { display: grid; gap: 2px; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-md); text-decoration: none; color: var(--ink-2); font-weight: 500; }
  .side nav a svg { width: 20px; height: 20px; }
  .side nav a.on { background: var(--jade-soft); color: var(--jade); font-weight: 650; }
  .side .foot { margin-top: auto; display: grid; gap: 8px; }
  .mtop { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .content { padding: 22px clamp(16px, 3vw, 36px) 40px; max-width: 1120px; width: 100%; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 2px; text-decoration: none; color: inherit; }
  .kpi b { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); }
  .banner.ok { background: var(--jade-soft); border-color: color-mix(in srgb, var(--jade) 30%, var(--line)); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .tabs button { font: 600 14px var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: var(--r-md); cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--chip); color: var(--ink); }
  .prod { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .prod:last-child { border-bottom: 0; }
  .prod img, .prod .thumb { width: 64px; height: 64px; border-radius: var(--r-md); object-fit: cover; background: var(--chip); }
  .prod .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Product list: when the list itself is narrow (tablet + sidebar, larger phone text), put the buttons under the title instead of squeezing it */
  .prodlist { container-type: inline-size; }
  @container (max-width: 760px) { .prod { grid-template-columns: 64px minmax(0, 1fr); } .prod .acts { grid-column: 2; } }
  @media (max-width: 560px) { .prod { grid-template-columns: 56px minmax(0, 1fr); } .prod .acts { grid-column: 1 / -1; } .prod img, .prod .thumb { width: 56px; height: 56px; } }
  .steps { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .steps b { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--chip); color: var(--ink-2); font-size: 12px; }
  .steps .on b { background: var(--jade); color: var(--jade-ink); }
  .steps .on { color: var(--ink); font-weight: 600; }
  .steps i { width: 24px; height: 1px; background: var(--line); }
  .editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }

  .preview-card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .preview-card .tag { position: absolute; inset-inline-start: 10px; bottom: 10px; }
  .vrow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  @media (max-width: 600px) { .vrow { grid-template-columns: 1fr 1fr 1fr auto; } .vrow .vname { grid-column: 1 / -1; } }
  .srcgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; max-width: 1100px; }
  .srchead { display: flex; gap: 12px; align-items: flex-start; }

<body>
<div id="app"></div>

<script>
// The platform owner has full access to every app: act as this app's role
const asMe = (u) => (u && u.owner ? { ...u, role: 'seller' } : u);
const { $, $$, esc, money, num, date, plain, api, toast, ICONS, pill } = K;
K.offerInstall({ name: 'Kinan Seller', icon: '/assets/icon-seller-192.png' });
let me = null, shop = null, cfg = { currency: 'usd', cny_rate: 7.2 };
let draft = null; // product being imported or edited

const PRODUCT_STATUS = { pending_review: ['In review', 'warn'], active: ['Live', 'ok'], paused: ['Paused', ''], rejected: ['Needs changes', 'bad'], unavailable: ['Unavailable on Taobao', 'bad'] };
const PO_STATUS_CLS = (s) => /WAIT_BUYER_P/.test(s) ? 'warn' : /CREATE_FAILED|TRADE_CLOSED/.test(s) ? 'bad' : 'ok';
const NAV = [['#/', 'Dashboard', ICONS.home], ['#/products', 'Products', ICONS.shop], ['#/add', 'Add product', ICONS.plus], ['#/orders', 'Orders', ICONS.box], ['#/earnings', 'Earnings', ICONS.wallet], ['#/settings', 'Account', ICONS.user]];

function variantLabel(props) {
  if (!props) return 'Standard';
  try { const j = JSON.parse(props); if (Array.isArray(j)) return j.map((x) => typeof x === 'object' ? (x.value_name || x.value || Object.values(x).join(' ')) : x).join(' / '); if (j && typeof j === 'object') return Object.values(j).join(' / '); } catch {}
  return String(props).split(/[;,]/).map((p) => p.split(':').pop()).filter(Boolean).join(' / ') || 'Standard';
}
const costInSale = (cny) => Number(cny) / Number(cfg.cny_rate || 7.2);
function marginPct(price, cny) { const c = costInSale(cny); return price > 0 ? Math.round(((price - c) / price) * 100) : null; }
const marginCls = (m) => m === null ? '' : m < 10 ? 'bad' : m < 25 ? 'warn' : 'ok';

// ---------- shell ----------
function shell() {
  const h = location.hash || '#/';
  const isOn = (href) => href === '#/' ? h === '#/' || h === '#' : h.startsWith(href);
  $('#app').innerHTML = `<div class="shell">
    <aside class="side desk-only">${K.brand('Seller Center')}
      <nav>${NAV.map(([href, t, ic]) => `<a href="${href}" class="${isOn(href) ? 'on' : ''}">${ic}${t}</a>`).join('')}</nav>
      <div class="foot"><div class="small"><b>${esc(shop?.shop_name || '')}</b><div class="muted">${esc(me.email)}</div></div><div class="row">${KinanTheme.button('btn ghost sm')}<button class="btn ghost sm" data-out>Sign out</button></div></div>
    </aside>
    <div><div class="mtop mob-only">${K.brand('Seller')}<span class="row" style="gap:6px">${KinanTheme.button('btn sm ghost')}<a class="btn sm quiet" href="#/settings">${esc((shop?.shop_name || '').slice(0, 18))}</a></span></div>
    <main class="content" id="view"></main>${K.footer(cfg.operator?.name)}</div></div>
    <nav class="tabbar">${NAV.map(([href, t, ic]) => `<a href="${href}" class="${isOn(href) ? 'on' : ''}">${ic}${t === 'Add product' ? 'Add' : t}</a>`).join('')}</nav>`;
  document.body.classList.add('has-tabbar');
  $$('[data-out]').forEach((b) => b.onclick = signOut);
}
async function signOut() { await api('/api/auth/logout', 'POST').catch(() => {}); me = null; shop = null; authScreen(); }

const routes = [[/^#\/?$/, dashboard], [/^#\/products$/, products], [/^#\/add$/, addStart], [/^#\/edit\/([\w-]+)$/, editProduct], [/^#\/review$/, editorScreen], [/^#\/manual(?:\/([\w-]+)|\?(ae))?$/, manualForm], [/^#\/orders$/, orders], [/^#\/earnings$/, earnings], [/^#\/settings$/, settings]];
async function route() {
  if (!me) return;
  if (needsVerification()) { try { await verifyScreen(); } catch (e) { $('#app').innerHTML = `<div class="kyc"><div class="empty"><h3>Couldn’t load this page</h3><p>${esc(e.message)}</p><button class="btn ghost" onclick="route()">Try again</button></div></div>`; } return; }
  shell();
  const h = location.hash || '#/';
  for (const [re, fn] of routes) {
    const m = h.match(re);
    if (m) { try { await fn(...m.slice(1)); } catch (e) { $('#view').innerHTML = `<div class="empty"><h3>Couldn’t load this page</h3><p>${esc(e.message)}</p><button class="btn ghost" onclick="route()">Try again</button></div>`; } window.scrollTo(0, 0); return; }
  }
  location.hash = '#/';
}
window.addEventListener('hashchange', route);
const refreshShop = async () => { shop = await api('/api/seller/me'); };
const NEXT_KEY = 'kinan_seller_next';
function rememberNext(h) { try { localStorage.setItem(NEXT_KEY, JSON.stringify({ h, at: Date.now() })); } catch { /* private mode */ } }
/** After signing in: go to the page the person was opening (saved less than 30 minutes ago). */
function takeNext() {
  try {
    const v = JSON.parse(localStorage.getItem(NEXT_KEY) || 'null'); localStorage.removeItem(NEXT_KEY);
    if (v && /^#\/[\w\-/?=]*$/.test(v.h) && Date.now() - v.at < 30 * 60e3 && (!location.hash || location.hash === '#/')) history.replaceState(null, '', '/seller' + v.h);
  } catch { /* ignore */ }
}

function approvalBanner() {
  if (shop.status === 'pending') return `<div class="banner"><div><b>Your shop is waiting for approval</b><div class="small">Kinan reviews new sellers before they can publish. Meanwhile, connect your Taobao account and prepare products.</div></div></div>`;
  if (shop.status === 'suspended') return `<div class="banner" style="background:color-mix(in srgb,var(--bad) 10%,var(--surface))"><div><b>Your shop is suspended</b><div class="small">Your products are hidden from buyers. Contact Kinan support for details.</div></div></div>`;
  return '';
}
function taobaoCard() {
  const t = shop.taobao || {};
  // Kinan's own Taobao account is used for every seller: nothing to connect
  if (cfg.taobao_kinan) return '';
  // Connected: nothing to show, unless the authorization is about to expire
  if (t.connected && !t.needs_reauth_soon) return '';
  if (t.connected) return `<div class="banner ok"><div><b>Taobao account connected</b><div class="small">${t.account ? esc(t.account) + ' · ' : ''}Orders are bought from this account.${t.needs_reauth_soon ? ' <span class="warn">Authorization expires soon — reconnect to keep orders flowing.</span>' : ''}</div></div>${t.needs_reauth_soon ? '<button class="btn sm" data-connect>Reconnect</button>' : ''}</div>`;
  return `<div class="banner"><div><b>Connect your Taobao account</b><div class="small">You need a Taobao Distribution Platform account to import products. Kinan buys each order from your account and ships it to our China warehouse.</div></div><button class="btn" data-connect>Connect Taobao</button></div>`;
}
function wireConnect() {
  $$('[data-connect]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api(`/api/seller/taobao/connect?return_to=${encodeURIComponent(location.origin + '/seller?taobao=connected')}`); location.href = r.url; }
    catch (e) { toast(e.message); b.disabled = false; }
  });
}

// ---------- dashboard ----------
async function dashboard() {
  const v = $('#view');
  v.innerHTML = '<div class="skeleton" style="height:120px"></div>';
  const [prods, ords, earn] = await Promise.all([api('/api/seller/products'), api('/api/seller/orders'), api('/api/seller/earnings')]);
  const count = (s) => prods.filter((p) => p.status === s).length;
  const toPay = cfg.taobao_kinan ? [] : ords.filter((o) => o.purchase && /WAIT_BUYER_P/.test(o.purchase.status));
  v.innerHTML = `<div class="head"><div><h1>Hello, ${esc(shop.shop_name)}</h1><p class="muted">Here’s what needs your attention today.</p></div><a class="btn" href="#/add">Add product</a></div>
    ${approvalBanner()}${taobaoCard()}
    ${toPay.length ? `<div class="banner" style="background:color-mix(in srgb,var(--bad) 9%,var(--surface))"><div><b>${toPay.length} order${toPay.length > 1 ? 's' : ''} waiting for your payment to Taobao</b><div class="small">Unpaid purchase orders are closed by Taobao at the deadline and the buyer is refunded.</div></div><a class="btn" href="#/orders">Pay now</a></div>` : ''}
    <div class="kpis">
      <a class="kpi" href="#/products"><span>Live products</span><b>${count('active')}</b></a>
      <a class="kpi" href="#/products"><span>In review</span><b>${count('pending_review')}</b></a>
      <a class="kpi" href="#/products"><span>Needs changes</span><b class="${count('rejected') ? 'bad' : ''}">${count('rejected')}</b></a>
      <a class="kpi" href="#/orders"><span>Orders</span><b>${ords.length}</b></a>
      <a class="kpi" href="#/earnings"><span>Available to pay out</span><b>${money(earn.payable, earn.currency)}</b></a>
      <a class="kpi" href="#/earnings"><span>On the way</span><b>${money(earn.pending, earn.currency)}</b></a>
    </div>
    <section class="panel" id="stats"></section>
    <section class="panel"><div class="row between" style="margin-bottom:6px"><h2>Recent orders</h2><a class="muted" href="#/orders">See all</a></div>
      ${ords.slice(0, 5).map(orderRow).join('') || '<div class="empty" style="padding:24px"><p>No orders yet. Once buyers order your products, they appear here.</p></div>'}</section>`;
  wireConnect(); wireOrderActions();
  api('/api/seller/stats').then((st) => {
    const days = Object.keys(st.per_day).sort(); const max = Math.max(1, ...Object.values(st.per_day));
    $('#stats').innerHTML = `<div class="row between"><h2>Last 30 days</h2><span class="muted small">${st.views} views · ${st.orders} orders · ${money(st.revenue, st.currency)}</span></div>
      ${days.length ? `<div style="display:flex;align-items:flex-end;gap:2px;height:60px;margin:10px 0" aria-label="Views per day">${days.map((d) => `<span title="${d}: ${st.per_day[d]}" style="flex:1;background:var(--jade);opacity:.75;border-radius:3px 3px 0 0;height:${Math.max(4, (st.per_day[d] / max) * 100)}%"></span>`).join('')}</div>` : ''}
      ${st.products.length ? `<div class="scroll"><table><thead><tr><th>Product</th><th>Views</th><th>Orders</th><th>Conversion</th></tr></thead><tbody>${st.products.slice(0, 10).map((p) => `<tr><td>${esc(p.title.slice(0, 60))}</td><td>${p.views}</td><td>${p.orders}</td><td>${p.conversion === null ? '—' : p.conversion + '%'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Views of your products will appear here.</p>'}`;
  }).catch(() => { $('#stats').hidden = true; });
}

/** Small CSV reader (quotes, commas and new lines inside quotes; comma or semicolon separated). */
function parseCsv(text) {
  text = text.replace(/^\ufeff/, '');
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = []; let cell = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; continue; }
    if (ch === '"') q = true; else if (ch === sep) { row.push(cell); cell = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map((h) => h.trim().toLowerCase().replace(/\s+/g, '_'));
  return rows.filter((r) => r.some((c) => c.trim())).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}

// ---------- products ----------
let prodFilter = 'all';
async function products() {
  const v = $('#view');
  v.innerHTML = '<div class="skeleton" style="height:240px"></div>';
  const list = (await api('/api/seller/products')).sort((a, b) => (b.updated_at || b.created_at || 0) - (a.updated_at || a.created_at || 0));
  const F = [['all', 'All'], ['active', 'Live'], ['pending_review', 'In review'], ['rejected', 'Needs changes'], ['paused', 'Paused']];
  const shown = list.filter((p) => prodFilter === 'all' || p.status === prodFilter);
  v.innerHTML = `<div class="head"><h1>Products</h1><a class="btn" href="#/add">Add product</a></div>
    <div class="tabs">${F.map(([k, t]) => `<button data-f="${k}" class="${k === prodFilter ? 'on' : ''}">${t} (${k === 'all' ? list.length : list.filter((p) => p.status === k).length})</button>`).join('')}</div>
    <section class="panel prodlist">${shown.map((p) => {
      const img = [...(p.own_images || []), ...(p.images || [])][0];
      const [lab, cls] = PRODUCT_STATUS[p.status] || [p.status, ''];
      const prices = p.skus.map((s) => s.price); const lo = Math.min(...prices), hi = Math.max(...prices);
      return `<div class="prod">${img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer" loading="lazy">` : '<div class="thumb"></div>'}
        <div style="min-width:0;display:grid;gap:4px"><div class="t">${esc(p.title)}</div>
          <div class="row">${pill(lab, cls)}<span class="muted">${money(lo, p.currency)}${hi !== lo ? ` – ${money(hi, p.currency)}` : ''} · ${p.skus.length} option${p.skus.length > 1 ? 's' : ''}</span></div>
          ${p.status === 'rejected' && p.review?.reason ? `<div class="small bad">Kinan’s note: ${esc(p.review.reason)}</div>` : ''}
          ${p.sync_error ? `<div class="small warn">${esc(p.sync_error)}</div>` : ''}
          ${p.price_alert?.skus?.length ? `<div class="small bad">Supplier price went up — ${p.price_alert.skus.map((s) => `${esc(s.props || 'Standard')}: price ${money(s.price, p.currency)} < cost ${money(s.cost, p.currency)}`).join('; ')}.${p.price_alert.paused ? ' Paused to avoid a loss.' : ''} Raise the price.</div>` : ''}</div>
        <div class="row acts">
          <a class="btn sm ghost" href="${['manual', 'aliexpress'].includes(p.source) ? '#/manual/' : '#/edit/'}${esc(p.id)}">Edit</a>
          ${p.status === 'active' ? `<button class="btn sm ghost" data-st="paused" data-id="${esc(p.id)}">Pause</button>` : ''}
          ${p.status === 'paused' ? `<button class="btn sm" data-st="active" data-id="${esc(p.id)}">Go live</button>` : ''}
          ${p.source === 'cj' ? `<span class="pill">CJdropshipping · ships direct</span><button class="btn sm quiet" data-sync="${esc(p.id)}">Refresh</button>` : p.source === 'aliexpress' ? `<span class="pill">AliExpress · ships direct</span>${p.ae_product_id && cfg.aliexpress?.import ? `<button class="btn sm quiet" data-sync="${esc(p.id)}">Refresh</button>` : ''}` : p.source === 'manual' ? '<span class="muted small">Added manually</span>' : `<button class="btn sm quiet" data-sync="${esc(p.id)}" title="Refresh cost and stock from Taobao">Refresh</button>`}

function resizeImage(file, max = 1000) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.85, out = c.toDataURL('image/jpeg', q);
      while (out.length > 380 * 1024 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => reject(new Error('Could not read that image'));
    img.src = url;
  });
}

      const cat = r.category && (cfg.categories || []).find((c) => c.id === r.category);
      const V = { good: ['Good', 'ok'], fix: ['Improve', 'warn'], remove: ['Remove', 'bad'] };
      out.innerHTML = `<div class="row between"><b>Suggestions</b><button type="button" class="btn sm" id="aiall">Use all</button></div>
        ${sug.map(([k, label, v]) => `<div class="aisug"><div class="row between"><span class="muted small">${label}</span><button type="button" class="btn sm ghost" data-ai="${k}">Use</button></div><div class="aitext" ${/_ar$/.test(k) ? 'dir="rtl"' : 'dir="auto"'} data-no-tr>${esc(v)}</div></div>`).join('')}
        ${cat ? `<div class="aisug"><div class="row between"><span class="muted small">Category</span><button type="button" class="btn sm ghost" data-ai="category">Use</button></div><div class="aitext">${esc(KinanLang.lang === 'ar' && cat.ar ? cat.ar : cat.en)}</div></div>` : ''}
        ${(r.photos || []).length ? `<div class="stack" style="gap:8px"><b>Photo check</b>${r.photos.map((p) => `<div class="aiphoto" data-pi="${p.index}"><span class="pill ${V[p.verdict][1]}">${V[p.verdict][0]}</span><span><b><span>Photo</span> ${p.index}</b>${p.issues.length ? `<span class="muted small" style="display:block" data-no-tr>${p.issues.map(esc).join(' · ')}</span>` : ''}</span>${p.verdict === 'remove' && removePhoto ? `<button type="button" class="btn sm quiet" data-airm="${p.index}">Remove photo</button>` : ''}</div>`).join('')}</div>` : ''}
        ${(r.tips || []).length ? `<div class="stack" style="gap:4px"><b>Tips</b><ul class="small" style="margin:0;padding-inline-start:18px" data-no-tr>${r.tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
        <p class="muted small" style="margin:0"><span>Check the text before saving — you are responsible for what your listing says.</span> <span>AI uses left today:</span> ${r.uses_left_today}</p>`;
      const vals = Object.fromEntries([...sug.map(([k, , v]) => [k, v]), ...(cat ? [['category', cat.id]] : [])]);
      const use = (k, btn) => { apply(k, vals[k]); if (btn) { btn.textContent = 'Used ✓'; btn.disabled = true; } };
      out.querySelectorAll('[data-ai]').forEach((b2) => b2.onclick = () => use(b2.dataset.ai, b2));
      out.querySelector('#aiall').onclick = () => { out.querySelectorAll('[data-ai]').forEach((b2) => use(b2.dataset.ai, b2)); toast('Suggestions added — check them, then save'); };
      // Remove flagged photos from the highest number down so the numbers stay right
      out.querySelectorAll('[data-airm]').forEach((b2) => b2.onclick = () => {
        const i = Number(b2.dataset.airm);
        removePhoto(i - 1);
        out.querySelectorAll('[data-airm]').forEach((x) => { if (Number(x.dataset.airm) > i) x.dataset.airm = Number(x.dataset.airm) - 1; });
        b2.closest('.aiphoto').remove();
      });
    } catch (e) { out.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
    go.disabled = false; go.textContent = 'Improve again';
  };
}

async function editProduct(id) {
  const p = (await api('/api/seller/products')).find((x) => x.id === id);
  if (!p) throw new Error('Product not found');
  draft = { mode: 'edit', category: p.category, id: p.id, link: p.taobao_item_id, taobao_item_id: p.taobao_item_id, item_type: p.item_type, status: p.status, review: p.review,
    title: p.title, description: plain(p.description), taobao_images: p.images || [], own_images: p.own_images || [], skus: p.skus.map((s) => ({ ...s })),
    keywords: p.keywords || [],
    orig: { title: p.title, description: plain(p.description), own: JSON.stringify(p.own_images || []), prices: JSON.stringify(p.skus.map((s) => s.price)), keywords: (p.keywords || []).join(', ') } };
  editorScreen();
}

            : d.taobao_images.length ? `<div class="small muted">From Taobao</div><div class="photos">${d.taobao_images.slice(0, 8).map((u) => `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy">`).join('')}</div>` : ''}

          <label class="check"><input type="checkbox" name="rights" ${d.own_images.length ? 'checked' : ''}><span>I own these photos or have permission to use them.</span></label>
        </section>

          <div class="scroll"><table><thead><tr><th>Option</th><th>Taobao cost</th><th>Your price (${esc(cfg.currency.toUpperCase())})</th><th>Margin</th><th>Stock</th></tr></thead><tbody>
            ${d.skus.map((s, i) => `<tr><td>${esc(variantLabel(s.props))}</td><td class="muted">¥${num(s.cost_cny)} <span class="small">(${money(costInSale(s.cost_cny), cfg.currency)})</span></td>
              <td><input class="price-in" type="number" min="0.01" step="0.01" required value="${esc(s.price)}" data-p="${i}"></td>
              <td class="margin" data-m="${i}"></td><td>${s.stock >= 200 ? '200+' : s.stock}</td></tr>`).join('')}
          </tbody></table></div>
          <span class="muted">Margin is before Kinan’s ${esc(shop.commission_pct)}% commission. Cost uses ¥${num(cfg.cny_rate)} = 1 ${esc(cfg.currency.toUpperCase())}.</span>

      </aside>
    </form>`;
  const f = $('#ef');
  const paint = () => {
    d.skus.forEach((s, i) => { const m = marginPct(Number(s.price), s.cost_cny); const el = $(`[data-m="${i}"]`); el.textContent = m === null ? '—' : `${m}%`; el.className = `margin ${marginCls(m)}`; });
    const own = f.own_images.value.split(/\s+/).filter((u) => /^https:\/\//.test(u));
    const img = own[0] || (noMaterial ? null : d.taobao_images[0]);
    const lo = Math.min(...d.skus.map((s) => Number(s.price) || 0));
    $('#pvimg').innerHTML = (img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">` : '<div style="display:grid;place-items:center;height:100%" class="muted">No photo</div>') + `<span class="tag">${money(lo, cfg.currency)}</span>`;
    $('#pvt').textContent = f.title.value || 'Untitled';
  };
  $$('[data-p]').forEach((inp) => inp.oninput = () => { d.skus[+inp.dataset.p].price = Number(inp.value); paint(); });
  f.title.oninput = paint; f.own_images.oninput = paint;
  aiBox($('#aibox'), {
    read: () => ({ title: f.title.value, description: f.description.value, category: f.category.value, options: d.skus.map((x) => variantLabel(x.props)).filter(Boolean), images: [...f.own_images.value.split(/\s+/).filter((u) => /^https:\/\//.test(u)), ...(noMaterial ? [] : d.taobao_images)].slice(0, 6) }),
    apply: (k, v) => { if (f[k]) { f[k].value = v; paint(); } }
  });
  $('#mkgo').onclick = () => {
    const mk = Number($('#mk').value) || 0;
    d.skus.forEach((s, i) => { s.price = Math.round(costInSale(s.cost_cny) * (1 + mk / 100) * 100) / 100; $(`[data-p="${i}"]`).value = s.price; });
    paint();
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const title = f.title.value.trim(); const description = f.description.value.trim();
    const own = f.own_images.value.split(/\s+/).map((x) => x.trim()).filter(Boolean);
    if (own.some((u) => !/^https:\/\//.test(u))) { $('#ee').textContent = 'Photo links must start with https://'; return; }
    if (own.length && !f.rights.checked) { $('#ee').textContent = 'Confirm that you own the photos, or remove them.'; return; }
    if (noMaterial && !own.length) { $('#ee').textContent = 'Add at least one photo of your own for this product.'; return; }
    const prices = Object.fromEntries(d.skus.map((s) => [s.mp_sku_id, Number(s.price)]));
    if (Object.values(prices).some((p) => !(p > 0))) { $('#ee').textContent = 'Every option needs a price.'; return; }
    const btn = $('#save'); btn.disabled = true; btn.textContent = 'Saving…'; $('#ee').textContent = '';
    try {
      const priceOnly = d.mode === 'edit' && title === d.orig.title && description === d.orig.description && JSON.stringify(own) === d.orig.own && f.keywords.value.trim() === d.orig.keywords;
      if (priceOnly) {
        await api(`/api/seller/products/${d.id}`, 'PATCH', { prices });
        toast('Prices updated');
      } else {
        await api('/api/seller/products', 'POST', { link: d.link, title, description, prices, own_images: own, images_rights_confirmed: f.rights.checked, category: f.category.value, keywords: f.keywords.value });
        toast(d.mode === 'new' ? 'Sent to Kinan for review' : 'Saved — sent back for review');
      }
      draft = null; location.hash = '#/products';
    } catch (err) { $('#ee').textContent = err.message; btn.disabled = false; btn.textContent = d.mode === 'new' ? 'Submit for review' : 'Save changes'; }
  };
  paint();
}

function wireOrderActions() {
  $$('[data-pay]').forEach((b) => b.onclick = async () => { if (!confirm('Pay this purchase order from your Taobao Distribution account balance?')) return; b.disabled = true; try { await api(`/api/seller/orders/${b.dataset.pay}/pay`, 'POST'); toast('Payment sent to Taobao'); } catch (e) { toast(e.message); } route(); });
  $$('[data-osync]').forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/api/seller/orders/${b.dataset.osync}/sync`, 'POST'); toast('Order updated'); } catch (e) { toast(e.message); } route(); });

async function earnings() {
  const e = await api('/api/seller/earnings');
  const ST = { pending_payout: ['On the way', 'warn'], payable: ['Available', 'ok'], paid: ['Paid out', ''] };
  const PS = { requested: ['Requested', 'warn'], paid: ['Sent', 'ok'], declined: ['Declined', 'bad'] };
  const d = e.payout_details || {};
  const waiting = e.payouts.find((p) => p.status === 'requested');
  $('#view').innerHTML = `<div class="head"><h1>Earnings</h1></div>
    <div class="kpis"><div class="kpi"><span>On the way (order not delivered yet)</span><b>${money(e.pending, e.currency)}</b></div>
      <div class="kpi"><span>Available to withdraw</span><b class="ok">${money(e.available, e.currency)}</b></div>
      <div class="kpi"><span>Withdrawal in progress</span><b>${money(e.requested, e.currency)}</b></div>
      <div class="kpi"><span>Withdrawn</span><b>${money(e.withdrawn, e.currency)}</b></div></div>
    <section class="panel stack" style="max-width:720px"><h2>Withdraw</h2>
      ${waiting ? `<p>Your request for <b>${money(waiting.amount, waiting.currency)}</b> is waiting — Kinan pays withdrawals by hand, usually within a few working days.</p>`
      : e.available < e.min_withdrawal ? `<p class="muted">You can withdraw once you have at least ${money(e.min_withdrawal, e.currency)} available.</p>`
      : `<form class="stack" id="wf">
        <div class="seg" id="wm"><button type="button" data-m="bank">Bank (IBAN)</button><button type="button" data-m="wise">Wise</button><button type="button" data-m="paypal">PayPal</button></div>
        <div class="grid-2"><label class="field">Amount (${esc(String(e.currency).toUpperCase())})<input name="amount" type="number" step="0.01" min="${e.min_withdrawal}" max="${e.available}" value="${e.available}" required></label>
        <label class="field">Account holder<input name="holder" required value="${esc(d.holder || '')}" autocomplete="name"></label></div>
        <div class="grid-2" id="wbank"><label class="field">IBAN<input name="iban" value="${esc(d.iban || '')}" autocomplete="off"></label><label class="field">BIC / SWIFT (optional)<input name="bic" value="${esc(d.bic || '')}"></label></div>
        <label class="field" id="wmail" hidden>Account email<input name="email" type="email" value="${esc(d.email || '')}"></label>
        <div class="error" id="we"></div><button class="btn" style="justify-self:start">Request withdrawal</button></form>`}
      ${e.payouts.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Amount</th><th>To</th><th>Status</th></tr></thead><tbody>${e.payouts.map((p) => `<tr><td class="muted">${date(p.created_at, false)}</td><td>${money(p.amount, p.currency)}</td><td class="muted">${esc(p.details.method === 'bank' ? `IBAN …${p.details.iban.slice(-4)}` : p.details.email)}</td><td>${pill(...(PS[p.status] || [p.status, '']))}${p.reference ? ` <span class="muted small">${esc(p.reference)}</span>` : ''}${p.note ? `<div class="small bad">${esc(p.note)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </section>
    <section class="panel stack" style="max-width:720px"><div><h2>Account statement</h2><p class="muted small" style="margin:4px 0 0">A PDF of your sales, Kinan commission, refunds and withdrawals for a period, with your balance.</p></div>
      <div class="seg" id="stp"><button type="button" data-p="this">This month</button><button type="button" data-p="last">Last month</button><button type="button" data-p="3m">Last 3 months</button><button type="button" data-p="year">This year</button></div>
      <div class="grid-2"><label class="field">From<input type="date" id="stfrom"></label><label class="field">To<input type="date" id="stto"></label></div>
      <div class="row"><button type="button" class="btn" id="stdl">Download PDF</button><span class="error" id="ste"></span></div></section>
    <section class="panel"><h2 style="margin-bottom:8px">History</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Order</th><th>Sales</th><th>Kinan commission</th><th>Cost</th><th>You earn</th><th>Status</th></tr></thead><tbody>
      ${e.entries.map((x) => `<tr><td class="muted">${date(x.created_at, false)}</td><td><code>${esc(String(x.order_id).slice(-8).toUpperCase())}</code>${x.type === 'refund' ? ' <span class="pill bad">Refund</span>' : ''}</td><td>${money(x.gross, x.currency)}</td><td class="muted">−${money(x.commission, x.currency)}</td><td class="muted">${x.cost ? `−${money(x.cost, x.currency)}` : '—'}</td><td><b>${money(x.net, x.currency)}</b></td><td>${pill(...(ST[x.status] || [x.status, '']))}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No earnings yet.</td></tr>'}
    </tbody></table></div></section>
    <p class="muted">Earnings become available when the buyer receives the order. Your earnings are your sale price minus Kinan’s ${esc(shop.commission_pct)}% commission, and minus the purchase cost for items Kinan buys for you (AliExpress and manually added products).</p>`;
  // Account statement
  const iso = (dt) => dt.toISOString().slice(0, 10);
  const setPeriod = (k) => {
    const n = new Date(); const y = n.getUTCFullYear(); const m = n.getUTCMonth();
    const r = { this: [new Date(Date.UTC(y, m, 1)), n], last: [new Date(Date.UTC(y, m - 1, 1)), new Date(Date.UTC(y, m, 0))], '3m': [new Date(Date.UTC(y, m - 2, 1)), n], year: [new Date(Date.UTC(y, 0, 1)), n] }[k];
    $('#stfrom').value = iso(r[0]); $('#stto').value = iso(r[1]);
    $$('#stp button').forEach((b) => b.classList.toggle('on', b.dataset.p === k));
  };
  $$('#stp button').forEach((b) => b.onclick = () => setPeriod(b.dataset.p)); setPeriod('this');
  ['#stfrom', '#stto'].forEach((q) => $(q).onchange = () => $$('#stp button').forEach((b) => b.classList.remove('on')));
  $('#stdl').onclick = async () => {
    const btn = $('#stdl'); $('#ste').textContent = ''; btn.disabled = true; btn.textContent = 'Preparing…';
    try {
      const r = await fetch(`/api/seller/statement.pdf?from=${encodeURIComponent($('#stfrom').value)}&to=${encodeURIComponent($('#stto').value)}`, { credentials: 'same-origin' });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not make the statement');
      const name = (r.headers.get('content-disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'Kinan-statement.pdf';
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) { $('#ste').textContent = e.message; }
    btn.disabled = false; btn.textContent = 'Download PDF';
  };
  const wf = $('#wf'); if (!wf) return;
  let method = d.method || 'bank';
  const paint = () => { $$('#wm button').forEach((b) => b.classList.toggle('on', b.dataset.m === method)); $('#wbank').hidden = method !== 'bank'; $('#wmail').hidden = method === 'bank'; };
  $$('#wm button').forEach((b) => b.onclick = () => { method = b.dataset.m; paint(); }); paint();
  wf.onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target; $('#we').textContent = '';
    try { await api('/api/seller/payouts', 'POST', { amount: Number(f.amount.value), details: { method, holder: f.holder.value, iban: f.iban.value, bic: f.bic.value, email: f.email.value } }); toast('Withdrawal requested'); earnings(); }
    catch (err) { $('#we').textContent = err.message; }
  };
}

      const v = $('#cam video'); v.srcObject = stream; await v.play().catch(() => {});
      $('#snap').hidden = false; $('#camstart').hidden = true; $('#retake').hidden = true;
    } catch { $('#camalt').hidden = false; $('#selfiest').textContent = 'Camera permission was not given. Allow the camera for kinan.shop, or tap “Use phone camera”.'; }
  };
  $('#camstart').onclick = start;
  $('#retake').onclick = () => { photos.selfie = null; start(); };
  $('#snap').onclick = () => {
    const v = $('#cam video'); if (!v || !v.videoWidth) return;
    const sz = Math.min(v.videoWidth, v.videoHeight, 1200); const c = document.createElement('canvas');
    c.width = Math.round(sz * 3 / 4); c.height = sz;
    const x = c.getContext('2d'); const sw = v.videoHeight * 3 / 4; x.drawImage(v, (v.videoWidth - sw) / 2, 0, sw, v.videoHeight, 0, 0, c.width, c.height);
    photos.selfie = c.toDataURL('image/jpeg', 0.85); stop(); showShot(photos.selfie);
  };
  $('#camalt input').onchange = async (e) => { const file = e.target.files[0]; if (!file) return; try { photos.selfie = await resizeImage(file, 1200); showShot(photos.selfie); } catch (err) { toast(err.message); } };
  window.addEventListener('hashchange', stop, { once: true });
  f.onsubmit = async (e) => {
    e.preventDefault(); $('#kerr').textContent = '';
    const v = Object.fromEntries(new FormData(f));
    if (!photos.id_front && !k.has?.id_front) { $('#kerr').textContent = 'Add a photo of your document.'; return; }
    if (f.id_type.value !== 'passport' && !photos.id_back && !k.has?.id_back) { $('#kerr').textContent = 'Add a photo of the back of your document.'; return; }
    if (!photos.selfie && !k.has?.selfie) { $('#kerr').textContent = 'Take your live selfie.'; return; }
    if (!v.agree) { $('#kerr').textContent = 'Please confirm that the information is true.'; return; }
    const btn = $('#ksend'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await api('/api/seller/verification', 'POST', { ...v, business_type: btype, agree: true, id_front: photos.id_front, id_back: f.id_type.value === 'passport' ? null : photos.id_back, selfie: photos.selfie, selfie_live: Boolean(photos.selfie) });
      stop(); await refreshShop(); toast('Sent to Kinan for approval'); verifyScreen(); window.scrollTo(0, 0);
    } catch (err) { $('#kerr').textContent = err.message; btn.disabled = false; btn.textContent = 'Send for approval'; }
  };
}
function authScreen(mode = 'in', msg = '') {
  document.body.classList.remove('has-tabbar');
  $('#app').innerHTML = `<div class="auth"><form class="panel stack" id="af">
      <div class="row between">${K.brand('Seller Center')}</div>
      <h2>${mode === 'in' ? 'Sign in to sell on Kinan' : 'Open your Kinan shop'}</h2>
      <div class="seg"><button type="button" data-m="in" class="${mode === 'in' ? 'on' : ''}">Sign in</button><button type="button" data-m="up" class="${mode === 'up' ? 'on' : ''}">Open a shop</button></div>
      ${K.googleButton(cfg, 'seller')}
      <p class="muted small" style="margin:0">Already shopping on Kinan? You can use the same email or Gmail — your shop is a separate account.</p>
      ${mode === 'up' ? '<label class="field">Shop name<input name="shop_name" required maxlength="80"></label><label class="field">Your name<input name="name" required autocomplete="name"></label>' : ''}
      <label class="field">Email<input name="email" type="email" required autocomplete="username"></label>
      <label class="field">Password<input name="password" type="password" required minlength="${mode === 'up' ? 8 : 1}" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}"></label>
      ${mode === 'up' ? '<span class="muted">At least 8 characters. Kinan reviews new shops before they can publish. By opening a shop you agree to the <a href="/seller-terms" target="_blank">Seller Terms</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</span>' : ''}
      <div class="error">${esc(msg)}</div>
      <button class="btn">${mode === 'in' ? 'Sign in' : 'Open shop'}</button>
      <a class="muted" href="/">Go to the Kinan store</a>
    ${mode === 'in' ? '<a class="muted small" href="/reset?app=seller">Forgot your password?</a>' : ''}</form></div>${K.footer(cfg.operator?.name)}`;
  $$('.seg button').forEach((b) => b.onclick = () => authScreen(b.dataset.m));
  $('#af').onsubmit = async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try {
      if (mode === 'up') await api('/api/auth/register', 'POST', { ...f, role: 'seller' });
      const r = await api('/api/auth/login', 'POST', { email: f.email, password: f.password, app: 'seller' });
      if (asMe(r.user).role !== 'seller') { await api('/api/auth/logout', 'POST'); return authScreen(mode, 'This is not a seller account. Customers shop at the Kinan store.'); }
      me = asMe(r.user); await refreshShop(); takeNext(); route();
    } catch (err) { authScreen(mode, err.message); }
  };
}
K.onUnauthorized = () => { me = null; authScreen('in', 'Your session ended. Please sign in again.'); };

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; wireInstall(); });
function wireInstall() {
  const b = $('#installbtn'); if (!b) return;
  b.style.display = deferredInstall ? 'inline-flex' : 'none';
  b.onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; b.style.display = 'none'; };
}

(async () => {
  const loginError = K.takeLoginError();
  const params = new URLSearchParams(location.search);
  const connected = params.get('taobao') === 'connected';
  if (params.toString()) history.replaceState(null, '', '/seller' + location.hash);
  cfg = await api('/api/config/public').catch(() => cfg);
  try { const u = asMe(await api('/api/me')); if (u.role === 'seller') { me = u; await refreshShop(); } } catch {}
  // A link from an email (e.g. /seller#/add) must still open that page after signing in — also with Google,
  // which comes back without the #part
  if (!me && location.hash && location.hash !== '#/') rememberNext(location.hash);
  if (me) takeNext();
  if (!me) authScreen('in', loginError); else { route(); if (connected) toast('Taobao account connected'); }
  K.registerSW();
})();
</script>
</body>
