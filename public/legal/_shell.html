<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Kinan</title>
<meta name="theme-color" content="#036747">
<link rel="icon" href="/assets/favicon-48.png" type="image/png" sizes="48x48">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/kinan.css">
<style>
  .doc { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  .doc h1 { font-size: clamp(28px, 5vw, 40px); margin: 18px 0 6px; }
  .doc h2 { font-size: 19px; margin: 30px 0 8px; }
  .doc p, .doc li { color: var(--ink-2); line-height: 1.65; }
  .doc p + p { margin-top: 10px; }
  .doc ul { padding-left: 20px; margin: 8px 0; }
  .doc li { margin: 4px 0; }
  .doc .meta { color: var(--muted); font-size: 14px; }
  .doc table { margin: 10px 0; }
  .legalnav { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; margin-top: 8px; }
  .legalnav a { color: var(--muted); }
  .legalnav a[aria-current] { color: var(--ink); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="/" aria-label="Kinan home"><img class="brand-mark" src="/assets/logo-main.png" width="32" height="32" alt=""><span class="brand-name" dir="ltr">KINAN<span class="brand-tld">.shop</span></span></a></div></header>
<main class="doc">
  <nav class="legalnav" aria-label="Legal">{{NAV}}</nav>
  {{BODY}}
</main>
{{FOOTER}}
</body>
</html>
