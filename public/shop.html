<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinan Shop</title>
<meta name="description" content="Kinan Shop — shop thousands of products and get them delivered to your door with tracking.">
<meta name="theme-color" content="#ffffff">
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
<link rel="manifest" href="/assets/shop.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kinan Shop">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/kinan.css">
<link rel="stylesheet" href="/assets/shop-app.css">
</head>
<body class="has-tabbar">
<header class="topbar">
  <div class="wrap">
    <span id="brand"></span>
    <form class="search grow" id="sf" role="search" autocomplete="off">
      <span class="sico" id="sicon"></span>
      <input name="q" type="search" enterkeyhint="search" placeholder="Search products or shops" aria-label="Search products" autocomplete="off">
      <button type="button" class="sclear" aria-label="Clear">×</button>
      <button type="button" class="scam" id="scam" aria-label="Search by photo" title="Search by photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.3" r="3.4"/></svg></button>
      <input type="file" accept="image/*" id="scamfile" hidden>
      <button class="sgo" aria-label="Search"><span id="sgoicon"></span><b>Search</b></button>
      <div class="ssug" id="ssug" role="listbox"></div>
    </form>
    <div class="grow mob-only"></div>
    <a class="iconbtn desk-only" href="#/orders" aria-label="Orders" id="nav-orders"></a>
    <a class="iconbtn desk-only" href="#/account" aria-label="Account" id="nav-account"></a>
    <a class="iconbtn sellbtn" href="/seller" aria-label="Seller Center" title="Seller Center" id="nav-sell"></a>
    <button class="iconbtn" data-theme-toggle aria-label="Dark mode"></button>
    <a class="iconbtn" href="#/cart" aria-label="Cart" id="nav-cart"></a>
  </div>
</header>
<main id="view" class="wrap"></main>
<div id="foot"></div>
<nav class="tabbar" id="tabbar"></nav>

<script src="/assets/common.js"></script>
<script src="/assets/shop-app.js"></script>
</body>
</html>
