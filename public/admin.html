<style>
  :root { --bg:#ffffff; --card:#fff; --ink:#172923; --muted:#55655e; --line:#e3e9e4; --accent:#036747; --accent-ink:#fff; --accent-soft:#e7f2ec; --nav:#172e26; --nav-ink:#fff; --nav-muted:rgba(255,255,255,.72); --ok:#1f7a4d; --warn:#9a6400; --bad:#b42318; --chip:#eceff5; --marigold:#f4b400; }
  :root { color-scheme: light; }
  :root[data-theme="dark"] { --bg:#0f1428; --card:#171d36; --ink:#eef0f7; --muted:#9097b3; --line:#2a3150; --chip:#222a47; --accent:#3cc08f; --accent-ink:#04221b; --accent-soft:#123a2c; --nav:#0b1712; color-scheme: dark; }
  [data-theme-toggle] { display:inline-flex; align-items:center; gap:6px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Instrument Sans",system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header > .row { flex-wrap:wrap; justify-content:flex-end; }
  @media (max-width: 760px) {
    header { flex-wrap:wrap; padding:10px 12px; }
    header > .row { width:100%; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; gap:6px; scrollbar-width:none; }
    header > .row::-webkit-scrollbar { display:none; }
    header > .row .btn, header > .row button { padding:6px 10px; font-size:13px; white-space:nowrap; }
    header > .row .muted { display:none; }
  }
  .brand { display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:750; font-size:21px; letter-spacing:-.03em; }
  .brand svg, .brand .brand-mark { width:32px; height:32px; border-radius:8px; background:#fff; object-fit:contain; flex:none; }
  header .brand { color:var(--nav-ink); } header .brand small, header > .row .muted { color:var(--nav-muted); }
  header { background:var(--nav) !important; border-bottom-color:transparent !important; }
  header .btn.ghost { color:var(--nav-ink); border-color:rgba(255,255,255,.3); background:transparent; }
  header :focus-visible { outline-color:#fff; } .brand small { font:500 13px "Instrument Sans",system-ui,sans-serif; color:var(--muted); letter-spacing:0; }
  h1, h2 { font-family:"Bricolage Grotesque",system-ui,sans-serif; letter-spacing:-.01em; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  nav button { background:transparent; color:var(--muted); border:0; padding:8px 12px; border-radius:8px; font:inherit; cursor:pointer; white-space:nowrap; }
  nav button.on { background:var(--chip); color:var(--ink); font-weight:600; }
  .admin-shell { display:grid; grid-template-columns:226px minmax(0,1fr); min-height:calc(100vh - 65px); background:var(--chip); }
  .admin-menu { position:sticky; top:65px; align-self:start; max-height:calc(100vh - 65px); overflow:auto; background:var(--card); border-inline-end:1px solid var(--line); }
  .admin-menu nav { display:grid; gap:15px; padding:16px 10px; border:0; }
  .nav-group { display:grid; gap:2px; }
  .nav-label { padding:5px 12px; color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.08em; }
  .admin-menu nav button { text-align:start; white-space:normal; }
  .admin-menu nav button:hover { background:var(--chip); color:var(--ink); }
  .admin-menu nav button.on { color:var(--accent); }
  .admin-menu-toggle { display:none; }
  .admin-content { min-width:0; width:100%; max-width:1500px; margin-inline:auto; padding:24px; }
  .admin-content h1 { font-size:clamp(23px,3vw,32px); line-height:1.2; margin:0 0 16px; }
  .admin-shell main { max-width:none; padding:0; align-content:start; }
  .overview-priority { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  @media(max-width:1100px) { .overview-priority { grid-template-columns:minmax(0,1fr); } }
  @media(max-width:900px) {
    .admin-shell { grid-template-columns:minmax(0,1fr); }
    .admin-content { padding:14px; }
    .admin-menu { position:static; max-height:none; border-inline-end:0; border-bottom:1px solid var(--line); }
    .admin-menu-toggle { display:block; margin:9px 14px; }
    .admin-menu nav { display:none; }
    .admin-menu.menu-open nav { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); }
  }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
  main > * { min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  button.kpi { cursor:pointer; text-align:start; font:inherit; color:var(--ink); }
  .kpi b { display:block; font-size:22px; font-variant-numeric:tabular-nums; } .kpi span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  th, td { text-align:start; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .scroll { overflow-x:auto; }
  .pill { display:inline-block; font-size:12px; padding:1px 9px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); font-size:13px; }
  button.btn { font:inherit; border:0; border-radius:8px; padding:7px 12px; background:var(--accent); color:var(--accent-ink); cursor:pointer; white-space:nowrap; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  input, select { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .alerts li { margin:4px 0; } .alerts { margin:0; padding-inline-start:18px; }
  code { direction:ltr; unicode-bidi:embed; font-size:12px; background:var(--chip); padding:1px 5px; border-radius:4px; }
  .login { max-width:360px; margin:12vh auto; display:grid; gap:10px; }
  .login input { width:100%; }
  .err { color:var(--bad); white-space:pre-wrap; font-size:14px; }
  .exq { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .exq li { background:var(--card); border:1px solid var(--line); border-inline-start:4px solid var(--muted); border-radius:10px; padding:12px 14px; display:grid; gap:8px; }
  .exq li.sev-high { border-inline-start-color:var(--bad); } .exq li.sev-medium { border-inline-start-color:var(--warn); }
  .exq .exhead { display:flex; gap:8px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; }
  .exq .exmeta { display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .exq .exmeta span { background:var(--chip); border-radius:99px; padding:1px 8px; }
  .exq .exact { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .exq .exact input { flex:1; min-width:160px; }
  .exfilters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; } .exfilters select { min-width:140px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); width:min(720px,94vw); padding:0; }
  .gbtn { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; border-radius:8px; border:1px solid #dadce0; background:#fff; color:#1f1f1f; font-weight:600; text-decoration:none; }
  .ordiv { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
  .ordiv::before, .ordiv::after { content:""; flex:1; height:1px; background:var(--line); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg { padding:16px; display:grid; gap:12px; }
  .sub { border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:4px; }
  /* Kinan business dashboard */
  .kb-tabs { display:flex; gap:6px; flex-wrap:wrap; } .kb-tabs button { font:inherit; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:99px; padding:6px 14px; cursor:pointer; }
  .kb-tabs button.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  .kpi small { display:block; font-size:12px; margin-top:2px; } .up { color:var(--ok); } .down { color:var(--bad); }
  .kb-two { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .kb-thumb { width:40px; height:40px; border-radius:8px; object-fit:cover; background:var(--chip); flex:none; }
  .kb-prod { display:flex; gap:10px; align-items:center; min-width:220px; } .kb-prod a { color:var(--ink); text-decoration:none; } .kb-prod a:hover { text-decoration:underline; }
  .kb-bar { height:8px; border-radius:99px; background:var(--chip); overflow:hidden; } .kb-bar i { display:block; height:100%; background:var(--accent); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th[data-sort] { cursor:pointer; user-select:none; } th[data-sort]:hover { color:var(--ink); }
  .kb-filter { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; } .kb-filter input { flex:1; min-width:180px; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:8px; min-width:0; }
  .bars.many { gap:2px; }
  .bars.many small { display:none; }
  .bars div { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .bars i { display:block; width:100%; background:var(--marigold); border-radius:4px 4px 0 0; min-height:2px; }
  .bars small { font-size:10px; color:var(--muted); }
.live{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lv{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line,#e3e6ea);border-radius:999px;background:var(--card,#fff);font-size:13px}
.lv b{font-size:16px;font-variant-numeric:tabular-nums}

.pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pfcard{display:grid;gap:12px;cursor:pointer;border:1px solid var(--line);font:inherit;color:inherit;background:var(--card,#fff);text-align:start}

.pfico{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;color:#fff;font-weight:800;font-size:14px;flex:none}
.pfstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pfstats div{display:grid;text-align:center;background:var(--bg,#f4f6f9);border-radius:8px;padding:6px 2px}
.pfstats b{font-size:18px}.pfstats span{font-size:11px;color:var(--muted,#6b7290)}
</style>

<body>
<div id="app"></div>
<footer style="text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 28px">© 2026 Ali Almadhoun Mohammed Kinan. All rights reserved. · <a href="/legal" style="color:inherit">Legal notice</a> · <a href="/privacy" style="color:inherit">Privacy</a></footer>

<script>
// The platform owner has full access to every app: act as this app's role
const asMe = (u) => (u && u.owner ? { ...u, role: 'admin' } : u);
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (n, cur) => (Number(n) || 0).toLocaleString('en-GB', { style: cur ? 'currency' : undefined, currency: cur ? cur.toUpperCase() : undefined, maximumFractionDigits: 2 });
const date = (t) => t ? new Date(Number(t)).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const statusClass = (s) => ({ delivered:'ok', shipped:'ok', ready_to_ship:'ok', active:'ok', attention:'bad', cancelled:'bad', refunded:'bad', suspended:'bad', pending:'warn' }[s] || 'warn');

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || 'Please sign in'); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function showLogin(msg = '') {
  renderSeq++;
  clearInterval(window.__live);
  clearInterval(window.__importMonitor);
  $('#app').innerHTML = `<form class="card login" id="lf"><a class="brand" href="/admin"><img class="brand-mark" src="/assets/logo-main.png" width="32" height="32" alt=""><span dir="ltr">KINAN</span><small>Admin</small></a><h2>Sign in to the admin dashboard</h2>
    ${googleSignin ? `<a class="gbtn" href="/auth/google?app=admin"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Continue with Google</a><div class="ordiv"><span>or with email</span></div>` : ''}
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="btn">Sign in</button><div class="err">${esc(msg)}</div><a class="muted" style="font-size:13px" href="/reset?app=admin">Forgot your password?</a></form>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try {
      const r = await api('/api/auth/login', 'POST', { email: f.get('email'), password: f.get('password') });
      if (asMe(r.user).role === 'warehouse') { location.href = '/warehouse'; return; }
      if (!STAFF_LOGIN.includes(asMe(r.user).role)) { await api('/api/auth/logout', 'POST'); return showLogin('This account is not a staff account'); }
      boot(asMe(r.user));
    } catch (err) { showLogin(err.message); }
  };
}

let googleSignin = false; let cfg = {};
// [tab, label, roles that see it]
const ALL_TABS = [
  ['overview','Overview','*'],['imports','Live Imports','admin'],['ai-tools','AI & Product Research','*'],
  ['connections','Integrations','*'],['tools','Admin Tools','admin'],['kinan','KINAN Business','admin'],['advertising','Advertising','admin'],['mail','KINAN Email','admin'],['platforms','Product Catalog','admin'],['listings','Product Review','admin'],['cj','CJdropshipping','admin procurement'],['ebay','eBay','admin'],
  ['exceptions','Exceptions','*'],['orders','Orders','*'],['shipping','Shipping','admin'],['returns','Returns','admin finance support'],['requests','Item Requests','admin procurement support'],
  ['sellers','Sellers','admin'],['users','Users','admin finance support'],['reviews','Reviews','admin support'],
  ['reports','Reports & Analytics','admin finance'],['payouts','Withdrawals','admin finance'],['coupons','Discount Codes','admin'],['backup','Backup & Data','admin']
];
const NAV_GROUPS = [
  ['Workspace',['overview','kinan','advertising','mail']],
  ['Products',['imports','platforms','listings','ai-tools']],
  ['Operations',['exceptions','orders','shipping','returns','requests']],
  ['Suppliers & Channels',['cj','ebay','connections']],
  ['People & Trust',['sellers','users','reviews']],
  ['Finance',['reports','payouts']],
  ['Settings',['tools','coupons','backup']]
];
function adminNav() {
  return NAV_GROUPS.map(([name, ids]) => {
    const links = ids.map(id => TABS.find(([key]) => key === id)).filter(Boolean);
    return links.length ? `<div class="nav-group"><div class="nav-label">${name}</div>${links.map(([key, label]) =>
      `<button type="button" data-t="${key}">${label}</button>`).join('')}</div>` : '';
  }).join('');
}
const STAFF_LOGIN = ['admin', 'procurement', 'finance', 'support'];
const can = (roles) => roles === '*' || roles.split(' ').includes(me?.role);
let TABS = ALL_TABS;
const isAdmin = () => me?.role === 'admin';
const canBuy = () => ['admin', 'procurement'].includes(me?.role);
const canMoney = () => ['admin', 'finance'].includes(me?.role);
let tab = 'overview', me;

function boot(user) {
  me = user;
  TABS = ALL_TABS.filter(([, , r]) => can(r));
  if (!TABS.some(([k]) => k === tab)) tab = 'overview';
  $('#app').innerHTML = `<header><a class="brand" href="/admin"><img class="brand-mark" src="/assets/logo-main.png" width="32" height="32" alt=""><span dir="ltr">KINAN</span><small>${user.role === 'admin' ? 'Admin' : esc(user.role.charAt(0).toUpperCase() + user.role.slice(1))}</small></a>
      <div class="row"><a href="/" target="_blank" rel="noopener"><button class="btn ghost">Kinan Shop</button></a><a href="/seller" target="_blank" rel="noopener"><button class="btn ghost">Seller Center</button></a><a href="/warehouse"><button class="btn ghost">Warehouse</button></a>${KinanLang.button('btn ghost')}${KinanTheme.button('btn ghost')}<span class="muted">${esc(user.email)}</span><button class="btn ghost" id="lo">Sign out</button></div></header>
    <div class="admin-shell">
      <div class="admin-menu"><button type="button" class="btn ghost admin-menu-toggle" id="menutoggle" aria-controls="adminnav" aria-expanded="false">Sections</button>
        <nav id="adminnav" aria-label="Admin sections">${adminNav()}</nav></div>
      <div class="admin-content"><h1 id="viewtitle" tabindex="-1"></h1><main id="view" aria-labelledby="viewtitle"></main></div>
    </div>
    <dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>`;
  $('#lo').onclick = async () => { await api('/api/auth/logout', 'POST'); showLogin(); };
  const toggle = $('#menutoggle');
  const setMenu = (open) => {
    toggle.parentElement.classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', String(open));
  };
  toggle.onclick = () => setMenu(toggle.getAttribute('aria-expanded') === 'false');
  $('#adminnav').querySelectorAll('[data-t]').forEach((button) => button.onclick = () => {
    setMenu(false);
    openSection(button.dataset.t);
  });
  render();
}

function openSection(section, businessTab) {
  if (!TABS.some(([key]) => key === section)) return;
  if (businessTab) KB.sub = businessTab;
  tab = section;
  render();
  $('#viewtitle').focus();
  window.scrollTo(0, 0);
}

// Each render gets a number; a view still loading when the user has already moved on (another tab, or the same tab
// again) must not paint over the newer one — not even with an error.
let renderSeq = 0;
async function render() {
  const run = ++renderSeq;
  clearInterval(window.__importMonitor);
  clearInterval(window.__live);
  $('#viewtitle').textContent = TABS.find(([key]) => key === tab)?.[1] || 'Overview';
  $('#adminnav').querySelectorAll('[data-t]').forEach((button) => {
    const active = button.dataset.t === tab;
    button.classList.toggle('on', active);
    if (active) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
  const previous = $('#view');
  const v = previous.cloneNode(false);
  v.innerHTML = '<p class="muted">Loading…</p>';
  previous.replaceWith(v);
  try { await VIEWS[tab](v); } catch (e) { if (run === renderSeq) v.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

function tgCard() {
  return api('/api/admin/telegram').then((t) => {
    const el = $('#tgcard'); if (!el) return;
    const m = (x) => { const e = $('#tgm'); if (e) e.textContent = x; };
    let body;

function sourcingCard() {
  return api('/api/admin/sourcing').then((d) => {

    const reasons = r && Object.keys(r.reasons || {}).length ? Object.entries(r.reasons).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)}: ${n}`).join(' · ') : '';
    el.innerHTML = `<h2>🛍️ AI catalog builder</h2>
      <p class="muted">Prioritizes CJ products with more listings and requires a shipping quote for the UK and a checked EU destination — like a big marketplace. The AI checks the photos and the product, keeps only good ones, puts each in the right department and section, writes an eBay title and keywords; the AI product review then polishes it before it goes live. Ready for eBay too.</p>

      ${r ? `<p class="muted small">Last run ${new Date(r.started_at).toLocaleString()}: <b>${r.added}</b> added of ${r.target}, ${r.checked} checked, ${r.skipped} turned down${reasons ? ` (${reasons})` : ''}${r.error ? ` — <span class="bad">${esc(r.error)}</span>` : ''}</p>` : ''}
      ${r?.last?.length ? `<details><summary>Latest added</summary><ul class="small">${r.last.map((x) => `<li><a href="/p/${esc(x.id)}" target="_blank" rel="noopener">${esc(x.title)}</a> · ${esc(x.dept)}${x.quality ? ` · AI ${x.quality}/10` : ''}</li>`).join('')}</ul></details>` : ''}
      <div style="overflow-x:auto"><table><thead><tr><th>On</th><th>Department</th><th>Live</th><th>AI checking</th><th>On eBay</th><th>Sections</th><th></th></tr></thead><tbody>${d.departments.map((x) => `<tr><td><input type="checkbox" data-dep="${esc(x.id)}" ${x.on ? 'checked' : ''}></td><td>${x.emoji} ${esc(x.en)}</td><td>${x.live}</td><td>${x.waiting}</td><td>${x.ebay}</td><td class="small muted">${x.groups.map((g) => esc(g.en)).join(', ')}</td><td>${x.live ? `<a href="/shop/${esc(x.id)}" target="_blank" rel="noopener">Shop page</a>` : ''}</td></tr>`).join('')}</tbody></table></div>
      <form id="srcf" class="row" style="flex-wrap:wrap;gap:10px;margin-top:10px">
        <label>Products this run <input type="number" name="batch" min="1" max="1000" value="${p.batch}" style="width:80px"></label>
        <label><input type="checkbox" name="daily" ${p.daily ? 'checked' : ''}> Every day, by itself:</label><label><input type="number" name="per_day" min="0" max="1000" value="${p.per_day}" style="width:72px"> a day</label>
        <label>Markup % <input type="number" name="markup_pct" min="10" max="400" value="${p.markup_pct}" style="width:64px"></label>
        <label>CJ cost $ <input type="number" name="min_cost" min="0" step="0.5" value="${p.min_cost}" style="width:60px"> – <input type="number" name="max_cost" min="2" value="${p.max_cost}" style="width:60px"></label>
        <label title="How many shops already sell it on CJ: a sign of demand">Min. demand <input type="number" name="min_listed" min="0" value="${p.min_listed}" style="width:64px"></label>
        <label>Max delivery days EU <input type="number" name="max_days_eu" min="2" max="20" value="${p.max_days_eu}" style="width:56px"></label>
        <label>UK <input type="number" name="max_days_gb" min="2" max="20" value="${p.max_days_gb}" style="width:56px"></label>
        <label title="The AI's score of the product and its photos">Min. AI quality <input type="number" name="min_quality" min="1" max="10" value="${p.min_quality}" style="width:52px">/10</label>
        <label>Min. stock <input type="number" name="min_stock" min="1" value="${p.min_stock}" style="width:64px"></label>
        <label>Warehouses <input name="warehouses" value="${esc(p.warehouses.join(','))}" style="width:190px"></label>
      </form>
      <p class="row"><button class="btn" id="srcgo" ${d.running ? 'disabled' : ''}>Save &amp; add products now</button><button class="btn ghost" id="srcphotos" ${d.running || !d.ai ? 'disabled' : ''}>Add CJ products · review photos only</button><button class="btn ghost" id="srcsave">Save settings</button>${d.running ? '<button class="btn ghost" id="srcstop">Stop</button>' : ''}<span class="muted" id="srcm"></span></p>
      <p class="muted small">Each product uses a few CJ API calls; CJ's daily limit pauses a run, which then continues by itself. New products wait for the AI product review before they go live.</p>`;
    const m = (t) => { const x = $('#srcm'); if (x) x.textContent = t; };
    const read = () => { const f = $('#srcf'); const x = Object.fromEntries(new FormData(f)); return { ...x, daily: f.daily.checked, departments: [...el.querySelectorAll('[data-dep]')].filter((c) => c.checked).map((c) => c.dataset.dep) }; };

const EX_AREA = { order: 'Order', supplier: 'Supplier', carrier: 'Carrier', warehouse: 'Warehouse', catalog: 'Product sync', finance: 'Finance' };
const EX_RESULT = { failed: 'Failed', stuck: 'Stuck', action: 'Action needed', review: 'To review' };

const VIEWS = {

      <div class="exfilters">${opt('area', d.facets.area, 'Area', EX_AREA)}${opt('provider', d.facets.provider, 'Provider')}${opt('result', d.facets.result, 'Result', EX_RESULT)}
        <label class="muted">Assigned<br><select data-exf="mine"><option value="">Everyone</option><option value="1" ${exFilter.mine ? 'selected' : ''}>Assigned to me</option></select></label></div>

                <div class="muted">Submitted ${date(l.review?.submitted_at || l.created_at)}${l.review?.reason ? ` · <span class="bad">Rejection reason: ${esc(l.review.reason)}</span>` : ''}</div></div>

              <td class="${s.margin_pct === null ? 'muted' : s.margin_pct < 10 ? 'bad' : s.margin_pct < 25 ? 'warn' : 'ok'}">${s.margin_pct === null ? '—' : s.margin_pct + '%'}</td><td>${s.stock >= 200 ? '200+' : s.stock}</td></tr>`).join('')}

          ${lowMargin ? '<div class="warn muted">Warning: very low margin on a variant — after your commission and shipping the seller may lose money.</div>' : ''}
          ${l.status === 'pending_review' || l.status === 'rejected' ? `<div class="row">

              <input placeholder="Rejection reason (shown to the seller)" style="flex:1;min-width:200px" data-reason="${esc(l.id)}">

    // Select all / several, then approve or reject them together
    const sels = [...v.querySelectorAll('[data-sel]')]; const picked = () => sels.filter((c) => c.checked).map((c) => c.dataset.sel);
    const sync = () => { const n = picked().length; const c = v.querySelector('#selcount'); if (!c) return; c.textContent = `${n} selected`; v.querySelector('#bulkok').disabled = !n; v.querySelector('#bulkno').disabled = !n; const all = v.querySelector('#selall'); all.checked = n > 0 && n === sels.length; all.indeterminate = n > 0 && n < sels.length; };
    sels.forEach((c) => c.onchange = sync);
    const selall = v.querySelector('#selall'); if (selall) selall.onchange = () => { sels.forEach((c) => { c.checked = selall.checked; }); sync(); };

      if (!confirm(`${action === 'approve' ? 'Approve and publish' : 'Reject'} ${ids.length} product(s)?`)) return;
      v.querySelector('#bulkok').disabled = true; v.querySelector('#bulkno').disabled = true; v.querySelector('#bulkmsg').textContent = 'Working…';

      render();
    };
    const bo = v.querySelector('#bulkok'); if (bo) bo.onclick = () => bulk('approve');
    const bn = v.querySelector('#bulkno'); if (bn) bn.onclick = () => bulk('reject');
    v.querySelectorAll('[data-reject]').forEach((b) => b.onclick = async () => {
      const reason = v.querySelector(`[data-reason="${b.dataset.reject}"]`).value.trim();

      b.disabled = true; try { await api(`/api/admin/listings/${b.dataset.reject}/reject`, 'POST', { reason }); } catch (e) { alert(e.message); } render();
    });
  },

VIEWS.mail = async (v) => {
  const inboxes = [
    ['hello', 'General enquiries'],
    ['info', 'Company information and partnerships'],
    ['sellers', 'Seller enquiries'],
    ['support', 'Customer support']
  ];
  const view = renderSeq;
  const status = await api('/api/admin/mailbox/status');
  if (view !== renderSeq) return;
  v.innerHTML = `<section class="card">
    <h2>KINAN Email</h2>
    <p class="muted">These addresses forward to your shared Gmail inbox. ${status.configured ? 'Choose an address to read or send mail.' : 'Connect Gmail to read and send here.'}</p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Address</th><th>Purpose</th><th>Setup</th><th>Actions</th></tr></thead>
      <tbody>${inboxes.map(([name, purpose]) => {
        const address = name + '@kinan.shop';
        const query = encodeURIComponent('to:' + address);
        return `<tr><td><b>${esc(address)}</b></td><td>${esc(purpose)}</td>
          <td><span class="pill">Forwarding</span></td>
          <td><div class="row">
            ${status.configured ? `<button type="button" class="btn" data-open-mail="${esc(address)}">Open inbox</button> <button type="button" class="btn ghost" data-new-mail="${esc(address)}">New email</button>` : ''}
            <a class="btn ghost" href="https://mail.google.com/mail/#search/${query}" target="_blank" rel="noopener noreferrer">Open in Gmail</a>
            <button type="button" class="btn ghost" data-copy-email="${esc(address)}">Copy address</button>
          </div></td></tr>`;
      }).join('')}</tbody>
    </table></div>
    <p class="small muted" id="mail-feedback" role="status"></p>
  </section><section id="mail-compose"></section><section id="mail-inbox"></section>`;
  const inbox = v.querySelector('#mail-inbox');
  const composer = v.querySelector('#mail-compose');
  function openComposer(address, message) {
    composer.innerHTML = `<form class="card stack">
          <h3>Send from ${esc(address)}</h3>
          <label>To <input type="email" name="to" required></label>
          <label>Subject <input name="subject" maxlength="140" required></label>
          <label>Message <textarea name="text" maxlength="30000" rows="6" required></textarea></label>
          <button class="btn">Send email</button><p role="status" data-send-status></p>
        </form>`;
    const form = composer.querySelector('form');
    if (message) {
      form.elements.to.value = /<([^<>]+)>$/.exec(message.from)?.[1] || message.from;
      form.elements.subject.value = (/^re:/i.test(message.subject) ? message.subject : 'Re: ' + message.subject).slice(0, 140);
    }
    form.onsubmit = async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      const result = form.querySelector('[data-send-status]');
      button.disabled = true;
      result.textContent = 'Sending…';
      try {
        // a reply carries the original message id: the server keeps it in the same Gmail conversation
        await api('/api/admin/mailbox/send', 'POST', { from: address, ...Object.fromEntries(new FormData(form)), ...(message?.id ? { reply_to_id: message.id } : {}) });
        form.reset();
        result.textContent = 'Email sent.';
      } catch (error) { result.textContent = error.message; }
      finally { button.disabled = false; }
    };
    form.elements.to.focus();
  }
  for (const button of v.querySelectorAll('[data-new-mail]')) {
    button.onclick = () => openComposer(button.dataset.newMail);
  }
  let selection = 0;
  async function openMailbox(address, page) {
    const selected = ++selection;
    inbox.innerHTML = '<p class="muted">Loading inbox…</p>';
    try {
      const result = await api('/api/admin/mailbox/inbox?' + new URLSearchParams({ address, ...(page ? { page } : {}) }));
      if (selected !== selection || view !== renderSeq) return;
      inbox.innerHTML = `<div class="card"><h3>${esc(address)}</h3>
        ${result.messages.map((m) => `<button type="button" class="btn ghost" data-message="${esc(m.id)}">${esc(m.subject || '(No subject)')} · ${esc(m.from)}</button>`).join(' ') || '<p>No matching messages.</p>'}
        ${result.next_page_token ? '<button type="button" class="btn ghost" data-next>Next page</button>' : ''}
        <pre data-body style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>
</div>`;
      inbox.querySelector('[data-next]')?.addEventListener('click', () => openMailbox(address, result.next_page_token));
      const body = inbox.querySelector('[data-body]');
      for (const button of inbox.querySelectorAll('[data-message]')) {
        button.onclick = async () => {
          body.textContent = 'Loading message…';
          try {
            const message = await api('/api/admin/mailbox/messages/' + encodeURIComponent(button.dataset.message) + '?' + new URLSearchParams({ address }));
            body.textContent = message.from + '\n' + message.subject + '\n\n' + message.text;
            openComposer(address, message);
          } catch (error) { body.textContent = error.message; }
        };
      }

    } catch (error) {
      if (selected === selection && view === renderSeq) inbox.textContent = error.message;
    }
  }
  for (const button of v.querySelectorAll('[data-open-mail]')) button.onclick = () => openMailbox(button.dataset.openMail);
  const feedback = v.querySelector('#mail-feedback');
  v.querySelectorAll('[data-copy-email]').forEach((button) => {
    button.onclick = async () => {
      try {
        await navigator.clipboard.writeText(button.dataset.copyEmail);
        feedback.textContent = 'Copied ' + button.dataset.copyEmail;
      } catch {
        feedback.textContent = 'Select the address in the table to copy it.';
      }
    };
  });
};

const importPanel = '<div class="card" id="import-live" aria-live="polite"><h2>Live product imports</h2><p class="muted">Connecting to AliExpress and CJ import status…</p></div>';

function monitorImports() {
  const startedView = renderSeq;
  const refreshImports = async () => {
    const panel = document.getElementById('import-live');
    if (!panel || renderSeq !== startedView) return;
    const sources = [
      ['AliExpress', '/api/admin/ae-sourcing', (s) => s.current || s.last || {}, (s) => Boolean(s.running)],
      ['CJ catalog builder', '/api/admin/sourcing', (s) => s.run || {}, (s) => Boolean(s.running)],
      ['CJ best sellers', '/api/admin/cj/bestsellers', (s) => s.state || {}, (s) => Boolean(s.state?.running)]
    ];
    const results = await Promise.all(sources.map(async ([name, url, runOf, activeOf]) => {
      try {
        const s = await api(url); const r = runOf(s) || {};
        const running = activeOf(s);
        const start = Number(r.started_at || 0), end = running ? Date.now() : Number(r.done_at || r.finished_at || 0);
        const elapsed = start && end > start ? (end - start) / 60000 : 0;
        const added = Number(r.added || 0), checked = Number(r.checked || 0), skipped = Number(r.skipped || 0);
        const rate = elapsed > 0 ? (added / elapsed).toFixed(2) : '—';
        const progress = Number(r.target) > 0 ? Math.min(100, Math.round(added / r.target * 100)) : null;
        const daily = name === 'AliExpress' && s.prefs
          ? `<p class="small">Today <b>${Number(s.today) || 0} / ${Number(s.prefs.per_day) || 0}</b> added · minimum ${Number(s.prefs.min_orders) || 0} supplier orders</p>`
          : '';
        const recent = Array.isArray(r.last) ? r.last.slice(0, 5).map((p) =>
          `<li><a href="/p/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${esc(p.title)}</a></li>`) :
          (r.added_titles || []).slice(-5).reverse().map((title) => `<li>${esc(title)}</li>`);
        const reasons = Object.entries(r.reasons || {}).sort((a, b) => b[1] - a[1]).slice(0, 4)
          .map(([reason, count]) => `<li>${esc(reason)} · ${Number(count) || 0}</li>`);
        return `<div style="padding:12px 0;border-top:1px solid var(--line)"><div class="row" style="justify-content:space-between"><b>${esc(name)}</b><span class="pill ${running ? 'warn' : 'ok'}">${running ? '● Running' : 'Idle / last run'}</span></div>
          <p class="small">Added <b>${added}</b> · Checked ${checked} · Skipped ${skipped} · Speed <b>${rate} products/min</b></p>
          ${daily}
          ${running && r.current ? `<p class="small">Checking <b>${esc(r.current)}</b></p>` : ''}
          ${recent.length ? `<div class="small">Newest additions<ul>${recent.join('')}</ul></div>` : ''}
          ${reasons.length ? `<div class="small">Top skip reasons<ul>${reasons.join('')}</ul></div>` : ''}
          ${r.markets ? `<div class="small">Delivery within the limit, per country (passed / checked): ${Object.entries(r.markets).map(([cc, m]) => `<b>${esc(cc)}</b> ${Number(m.passed) || 0}/${Number(m.checked) || 0}`).join(' · ')}</div>` : ''}
          ${progress === null ? '' : `<progress max="100" value="${progress}" style="width:100%"></progress><small class="muted">${progress}% of target</small>`}
          ${r.error ? `<p class="err small">${esc(String(r.error).slice(0,250))}</p>` : ''}
          ${start ? `<p class="muted small">Started ${new Date(start).toLocaleString()}</p>` : ''}</div>`;
      } catch (e) { return `<p class="err small">${esc(name)}: ${esc(e.message)}</p>`; }
    }));
    if (document.getElementById('import-live') === panel && renderSeq === startedView)
      panel.innerHTML = '<h2>Live product imports</h2><p class="muted small">Refreshes every 10 seconds · daily Telegram report uses Malta time</p>' + results.join('');
  };
  void refreshImports();
  window.__importMonitor = setInterval(refreshImports, 10000);
}

VIEWS.backup = async (v) => {
  v.innerHTML = `<div class="card" style="display:grid;gap:10px"><h2>Backup</h2>
    <p class="muted">Every night (around 2:00 UTC) a full copy of Kinan's data is emailed to the owner as a compressed file. Keep those emails — they are your copy if anything happens to the database. You can also download one now.</p>
    <div class="row"><a class="btn" href="/api/admin/backup">Download backup now</a><button class="btn ghost" id="bk">Email today's backup now</button><span class="muted" id="bkr"></span></div></div>
    <div class="card" style="display:grid;gap:10px"><h2>Encrypted off-site backup</h2>
      <p class="muted">A daily encrypted copy in the private Cloudflare R2 bucket. Setup and restore: docs/BACKUP_RESTORE.md.</p>
      <div id="osb" class="small muted">Checking…</div>
      <div class="row"><button class="btn ghost" id="osnow" hidden>Back up now</button><span class="muted" id="osr"></span></div>
      <details><summary><b>Create the encryption key</b></summary>
        <p class="small muted">The key is made here in your browser and is never sent to Kinan. Copy it into Render (kinan → Environment → <code>BACKUP_ENCRYPTION_KEY</code>) and into your password manager. Keep a paper copy too: without it no backup can be opened. Do not send it by chat or email.</p>
        <div class="row"><button class="btn ghost" id="mkkey">Create a key</button></div>
        <div class="row" id="keybox" hidden><code id="keyv" style="user-select:all;word-break:break-all"></code><button class="btn sm" id="keycp">Copy</button></div></details></div>
    <div class="card" style="display:grid;gap:10px"><h2>Invoices</h2><p class="muted">After paying, customers get a PDF invoice with the Kinan logo attached to their confirmation email, and can download it from their order. Staff can open one at <code>/invoice/&lt;order id&gt;.pdf</code>.</p>
      <div class="row"><button class="btn ghost" id="invs">Email me a sample invoice</button><span class="muted" id="invr"></span></div></div>`;
  $('#invs').onclick = async () => { $('#invs').disabled = true; try { const r = await api('/api/admin/invoice/sample', 'POST'); $('#invr').textContent = r.status === 'sent' ? `Sent to ${r.to}${r.from_order ? ' (your latest paid order)' : ' (example items)'}` : r.error || r.status || 'Done'; } catch (e) { $('#invr').textContent = e.message; } $('#invs').disabled = false; };
  $('#mkkey').onclick = () => { const b = new Uint8Array(32); crypto.getRandomValues(b); $('#keyv').textContent = btoa(String.fromCharCode(...b)); $('#keybox').hidden = false; };
  $('#keycp').onclick = async () => { try { await navigator.clipboard.writeText($('#keyv').textContent); toast('Key copied'); } catch { toast('Select the key and copy it'); } };
  const offsite = async () => {
    try {
      const st = await api('/api/admin/backup/offsite'); const c = st.check || {};
      const lines = [
        `Bucket <b>${esc(c.bucket || st.bucket)}</b>: ${c.reachable ? '<span class="ok">✓ reachable</span>' : `<span class="bad">✗ ${esc(c.missing?.length ? `missing ${c.missing.join(', ')}` : c.error || 'not reachable')}</span>`}`,
        `Encryption key: ${c.encryption_key ? '<span class="ok">✓ set</span>' : '<span class="bad">✗ BACKUP_ENCRYPTION_KEY not set</span>'}`,
        `Last backup: ${st.last ? `${esc(new Date(st.last.at).toLocaleString())} (${st.age_hours} h ago, ${Math.round(st.last.bytes / 1024)} KB)` : 'none yet'}`];
      $('#osb').innerHTML = lines.join('<br>'); $('#osnow').hidden = !st.enabled;
    } catch (e) { $('#osb').textContent = e.message; }
  };
  $('#osnow').onclick = async () => { $('#osnow').disabled = true; try { const r = await api('/api/admin/backup/offsite', 'POST'); $('#osr').textContent = r.skipped || `Saved ${r.key}`; } catch (e) { $('#osr').textContent = e.message; } $('#osnow').disabled = false; offsite(); };
  offsite();
  $('#bk').onclick = async () => { $('#bk').disabled = true; try { const r = await api('/api/admin/backup/email', 'POST'); $('#bkr').textContent = r.status === 'sent' ? `Sent to ${r.to}` : r.skipped || r.status || 'Done'; } catch (e) { $('#bkr').textContent = e.message; } $('#bk').disabled = false; };
};

      ${s.zones.map((z) => `<tr><td><b>${esc(z.name)}</b></td><td class="muted" style="font-size:12px">${esc(z.countries.join(', ') || 'All others')}</td>
        <td><input type="number" step="0.01" min="0" name="first_${z.id}" value="${s.rates[z.id].first}" style="width:90px"></td>
        <td><input type="number" step="0.01" min="0" name="extra_${z.id}" value="${s.rates[z.id].extra}" style="width:90px"></td>

      <label>Ignore differences under <input name="settle_tolerance" type="number" step="0.01" min="0" value="${s.settle_tolerance}" style="width:90px"></label></div>
    <div class="row"><button class="btn">Save</button><span class="ok" id="shok"></span><span class="err" id="sherr"></span></div></form>
    <div class="card" style="display:grid;gap:8px;margin-top:14px"><h2>Exchange rate</h2>
      <p class="muted">${s.fx.fixed_by_env ? 'Fixed by hand in the server settings (CNY_PER_SALE_UNIT).' : `Updated automatically every day. Buying costs use the market rate minus ${s.fx.buffer_pct}% as a safety margin.`}</p>
      <div class="row"><span>Market: <b>1 USD = ${s.fx.cny_market ?? '—'} CNY</b></span><span>Used for costs: <b>${s.fx.cny_used} CNY</b></span><span class="muted">${s.fx.updated_at ? date(s.fx.updated_at) : 'Not updated yet'}</span>
      <button class="btn sm ghost" id="fxr" type="button">Update now</button></div></div>`;
  $('#fxr').onclick = async () => { const b = $('#fxr'); b.disabled = true; try { await api('/api/admin/fx/refresh', 'POST'); VIEWS.shipping(v); } catch (err) { b.disabled = false; b.textContent = err.message; } };
  $('#shf').onsubmit = async (e) => {
    e.preventDefault(); const f = e.target; const rates = {}; const days = {};
    for (const z of s.zones) { rates[z.id] = { first: Number(f[`first_${z.id}`].value), extra: Number(f[`extra_${z.id}`].value) }; days[z.id] = f[`days_${z.id}`].value; }

    catch (err) { $('#sherr').textContent = err.message; }
  };
};

        <div>Test amount: <b style="font-size:18px">${Number(m.test_amount).toFixed(2)} ${esc(m.test_currency)}</b>${m.test_sent_at ? ` <span class="muted">sent ${date(m.test_sent_at)}${m.test_reference ? ` · ref ${esc(m.test_reference)}` : ''}</span>` : ''}</div>

    ${list.map((p) => `<div class="card" style="display:grid;gap:8px">
      <div class="row" style="justify-content:space-between"><div><b>${esc(p.shop)}</b> <span class="muted">· ${date(p.created_at)}</span></div><span class="pill ${PS[p.status][1]}">${PS[p.status][0]}</span></div>
      <div style="font-size:22px;font-weight:700">${fmt(p.net ?? p.amount, p.currency)}${p.fee ? ` <span class="muted" style="font-size:13px;font-weight:400">to send (${fmt(p.amount, p.currency)} − fee ${fmt(p.fee, p.currency)})</span>` : ''}${p.payout_day ? ` <span class="muted" style="font-size:13px;font-weight:400">· payout day ${esc(p.payout_day)}</span>` : ''}</div>

      ${p.reference ? `<div class="muted">Reference: ${esc(p.reference)}</div>` : ''}${p.note ? `<div class="bad">${esc(p.note)}</div>` : ''}

        <input data-note="${esc(p.id)}" placeholder="Reason to decline" style="flex:1;min-width:160px"><button class="btn ghost bad" data-dec="${esc(p.id)}">Decline</button></div>` : ''}

  const pmAct = (sel, action, extra) => v.querySelectorAll(sel).forEach((b) => b.onclick = async () => {
    const [sid, id] = b.dataset[Object.keys(b.dataset)[0]].split('|'); const body = { action, ...extra(id) };

    b.disabled = true; try { await api(`/api/admin/payout-methods/${sid}/${id}`, 'POST', body); render(); } catch (e) { alert(e.message); b.disabled = false; } });
  pmAct('[data-pmsent]', 'test_sent', (id) => ({ reference: v.querySelector(`[data-pmref="${id}"]`)?.value || '' }));
  pmAct('[data-pmok]', 'verify', () => ({}));
  v.querySelectorAll('[data-pmpp]').forEach((b) => b.onclick = async () => { const [sid, id] = b.dataset.pmpp.split('|'); b.disabled = true; try { await api(`/api/admin/payout-methods/${sid}/${id}/send-test`, 'POST'); render(); } catch (e) { alert(e.message); b.disabled = false; } });
  v.querySelectorAll('[data-send]').forEach((b) => b.onclick = async () => { if (!confirm(b.textContent + '?')) return; b.disabled = true; try { await api(`/api/admin/payouts/${b.dataset.send}/send`, 'POST'); render(); } catch (e) { alert(e.message); render(); } });
  const psf = v.querySelector('#psf'); if (psf) psf.onsubmit = async (ev) => {
    ev.preventDefault(); const f = new FormData(psf); const methods = {};

  };
  pmAct('[data-pmno]', 'reject', (id) => ({ note: v.querySelector(`[data-pmnote="${id}"]`)?.value || '' }));
  v.querySelectorAll('[data-pay]').forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/api/admin/payouts/${b.dataset.pay}`, 'POST', { action: 'paid', reference: v.querySelector(`[data-ref="${b.dataset.pay}"]`).value }); render(); } catch (e) { alert(e.message); b.disabled = false; } });
  v.querySelectorAll('[data-dec]').forEach((b) => b.onclick = async () => { b.disabled = true; try { await api(`/api/admin/payouts/${b.dataset.dec}`, 'POST', { action: 'decline', note: v.querySelector(`[data-note="${b.dataset.dec}"]`).value }); render(); } catch (e) { alert(e.message); b.disabled = false; } });
};

      <div class="row">${[['open','Open'],['refunded','Refunded'],['rejected','Rejected'],['all','All']].map(([k, t]) => `<button class="btn ${k === filter ? '' : 'ghost'}" data-rtf="${k}">${t}</button>`).join('')}</div></div>

      ${r.photos.length ? `<div class="row">${r.photos.map((ph) => `<a href="${esc(ph)}" target="_blank"><img src="${esc(ph)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px"></a>`).join('')}</div>` : ''}

  v.querySelectorAll('[data-rtf]').forEach((b) => b.onclick = () => { v.dataset.rtf = b.dataset.rtf; render(); });

  $('#close').onclick = () => { d.close(); render(); };
  const act = (approve) => async (e) => { e.target.disabled = true; try { await api(`/api/admin/sellers/${id}/verification`, 'POST', { approve, reason: $('#kreason')?.value || '' }); d.close(); render(); } catch (err) { $('#ke').textContent = err.message; e.target.disabled = false; } };
  if ($('#kok')) { $('#kok').onclick = act(true); $('#krej').onclick = act(false); }
}

const STATUS_LABEL = { pending_payment:'Awaiting payment', paid:'Paid', procuring:'Buying', awaiting_parcels:'Awaiting parcels', ready_to_ship:'Ready to ship', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled', refunded:'Refunded', attention:'Needs attention' };

let aeApi = false;
async function openOrder(id) {
  aeApi = await api('/api/admin/aliexpress').then((x) => x.mode === 'api').catch(() => false);
  const d = $('#dlg'); const b = $('#dlgBody');
  b.innerHTML = '<p class="muted">Loading…</p>'; d.showModal();
  const o = await api(`/api/admin/orders/${id}`);
  const a = o.shipping_address;
  b.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Order <code>${esc(o.id)}</code></h2><span class="pill ${statusClass(o.status)}">${esc(o.status_label)}</span></div>
    <div class="muted">${date(o.created_at)} · ${fmt(o.total, o.currency)} (Ship ${fmt(o.shipping_fee, o.currency)}) · Payment: ${o.payment?.provider === 'demo' || o.payment?.mode === 'test' ? '<span class="pill bad">TEST — no money received</span>' : esc(o.payment?.provider || '—')}</div>
    <div class="muted">To: ${esc(a.name)}, ${esc(a.line1)}, ${esc(a.city)}, ${esc(a.country)} · ${esc(a.phone)}</div>
    <table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Cost (CNY)</th></tr></thead><tbody>
      ${o.lines.map((l) => `<tr><td>${esc(l.title)}<div class="muted">${esc(l.props)}</div></td><td>${l.qty}</td><td>${fmt(l.price, o.currency)}</td><td>${fmt(l.cost_cny)}</td></tr>`).join('')}</tbody></table>
    ${o.packaging && o.packaging !== 'standard' ? `<div><span class="pill">${o.packaging === 'protect' ? 'Extra protection' : 'Remove boxes'}</span></div>` : ''}${o.hold ? '<div><span class="pill warn">Stored in the warehouse until the customer taps Ship now</span></div>' : ''}
    ${o.qc_photos ? `<h2>Check photos</h2><div class="row">${Array.from({ length: o.qc_photos }, (_, i) => `<a href="/api/admin/orders/${esc(o.id)}/qc/${i}" target="_blank"><img src="/api/admin/orders/${esc(o.id)}/qc/${i}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:8px"></a>`).join('')}</div>
      <div class="muted">Customer: ${{ pending: 'has not answered yet', approved: 'looks good', problem: `<b class="bad">reported a problem</b>${o.qc_note ? ` — “${esc(o.qc_note)}”` : ''}`, resolved: 'problem resolved' }[o.qc_review] || '—'}</div>
      ${o.qc_review === 'problem' ? '<div class="row"><input id="qcres" placeholder="What was agreed with the customer" style="flex:1"><button class="btn" data-qcres>Mark resolved — allow shipping</button></div>' : ''}` : ''}
    <h2>Messages with the customer</h2><div id="amsgs" style="display:grid;gap:6px"><span class="muted">Loading…</span></div>
    ${o.lines.some((l) => !l.direct) ? `<h2>NextSmartShip</h2><div class="sub" id="nssbox">${o.nss?.order_number ? `<div class="row" style="justify-content:space-between"><b>NSS order <code>${esc(o.nss.order_number)}</code></b><span class="pill ${o.nss.status === 'on_hold' ? 'bad' : ['fulfilled'].includes(o.nss.status) ? 'ok' : 'warn'}">${esc({ open: 'Waiting for the goods', requested: 'Getting tracking number', on_hold: 'On hold', scheduled: 'Tracking ready', fulfilling: 'Packing', partially_fulfilled: 'Partly shipped', fulfilled: 'Shipped', cancelled: 'Cancelled' }[o.nss.status] || o.nss.status)}</span></div>
        <div class="muted">${o.nss.route ? `Route: ${esc(o.nss.route)}${o.nss.est_fee ? ` · about $${esc(o.nss.est_fee)}` : ''} · ` : ''}${(o.nss.packages || []).map((x) => `${esc(x.courier || '')} <a href="${esc(x.url || '#')}" target="_blank" rel="noopener">${esc(x.tracking)}</a>`).join(', ') || 'no tracking yet'}</div>
        ${o.nss.hold_reason ? `<div class="err">${esc(o.nss.hold_reason)}</div>` : ''}${o.nss.error ? `<div class="err">${esc(o.nss.error)}</div>` : ''}
        ${canBuy() ? `<div class="row">${['open', 'on_hold'].includes(o.nss.status) ? '<button class="btn" data-nss="options">Ship now…</button>' : ''}<button class="btn ghost" data-nss="sync">Refresh</button></div><div id="nssopts"></div>` : ''}`
      : `<div class="muted">Not at NextSmartShip yet.${o.nss?.error ? ` <span class="err">${esc(o.nss.error)}</span>` : ''}</div>${canBuy() && !['pending_payment', 'cancelled', 'refunded'].includes(o.status) ? '<div class="row"><button class="btn ghost" data-nss="create">Create at NextSmartShip</button></div>' : ''}`}</div>` : ''}
    <h2>${o.sub_orders.every((s) => s.direct) ? 'Supplier orders' : o.sub_orders.some((s) => s.direct) ? 'Supplier and Taobao orders' : 'Taobao purchase orders'}</h2>
    ${o.sub_orders.map((s) => `<div class="sub"><div class="row" style="justify-content:space-between"><b>${esc(s.shop)}</b><span class="pill ${s.status === 'CREATE_FAILED' || s.status === 'TRADE_CLOSED' ? 'bad' : s.status === 'WAIT_BUYER_CONFIRM_GOODS' ? 'ok' : 'warn'}">${esc(s.status_label)}</span></div>
      <div class="muted"><code>${esc(s.outer_purchase_id)}</code> · ${esc((s.purchase_ids || []).join(', ') || '—')}${s.pay_deadline && /WAIT_BUYER_P/.test(s.status) ? ` · pay by ${date(s.pay_deadline)}` : ''}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}
      ${s.direct ? `<div style="display:grid;gap:6px;margin-top:6px"><div class="muted">Ships straight to the customer · ${s.source === 'cj' ? `CJdropshipping order${s.sandbox ? ' <span class="pill bad">SANDBOX</span>' : ''}${s.cj_method ? ` · ${esc(s.cj_method)}` : ''}${s.cj_amount ? ` · CJ cost $${esc(s.cj_amount)}` : ''}` : s.source === 'banggood' ? `Banggood order${s.sale_record_id ? ` (Kinan ref ${esc(s.sale_record_id)})` : ''}${s.bg_status ? ` · ${esc(s.bg_status)}` : ''}${s.bg_amount ? ` · Banggood cost $${esc(s.bg_amount)}` : ''}` : 'AliExpress order'}: ${esc((s.purchase_ids || []).join(', ') || '—')}${(s.logistics || []).length ? ` · tracking ${s.logistics.map((x) => esc(`${x.carrier || ''} ${x.tracking}`)).join(', ')}` : ''}</div>
        ${(s.links || []).map((x) => `<div class="muted">${x.qty} × ${esc(x.title)}${x.props ? ` (${esc(x.props)})` : ''} ${(x.link.match(/https?:\/\/\S+/) || [])[0] ? `· <a href="${esc(x.link.match(/https?:\/\/\S+/)[0])}" target="_blank" rel="noopener noreferrer">Open on ${s.source === 'cj' ? 'CJ' : s.source === 'banggood' ? 'Banggood' : 'AliExpress'}</a>` : ''}</div>`).join('')}
        ${s.source === 'banggood' && s.status === 'AE_PLACED' ? '<div class="muted">Banggood’s API cannot pay: open banggood.com → ApiOrderList, pay this dropship order, then press “Paid on Banggood”.</div>' : ''}
        ${s.status === 'AE_TO_BUY' && !['cj', 'banggood'].includes(s.source) ? `<div class="muted">Order it on AliExpress with the customer’s address: <code>${esc([a.name, a.line1, a.line2, a.city, a.state, a.postal_code, a.country, a.phone].filter(Boolean).join(', '))}</code> <button class="btn ghost" data-copyaddr>Copy</button></div>` : ''}
        ${canBuy() && !['AE_DELIVERED', 'AE_CANCELLED'].includes(s.status) ? `<div class="row"><input placeholder="AliExpress order no." data-aeo="${esc(s.outer_purchase_id)}" value="${esc((s.purchase_ids || []).join(','))}" style="width:170px"><input placeholder="Tracking number" data-aet="${esc(s.outer_purchase_id)}" style="flex:1;min-width:150px"><input placeholder="Carrier" data-aec="${esc(s.outer_purchase_id)}" style="width:110px">
          <button class="btn" data-aesave="${esc(s.outer_purchase_id)}">Save</button>${s.status === 'AE_SHIPPED' ? `<button class="btn ghost" data-aedel="${esc(s.outer_purchase_id)}">Mark delivered</button>` : ''}${s.status === 'AE_TO_BUY' && (aeApi || ['cj', 'banggood'].includes(s.source)) ? `<button class="btn ghost" data-aeplace="${esc(s.outer_purchase_id)}">${s.source === 'cj' ? 'Order on CJ' : s.source === 'banggood' ? 'Order on Banggood' : 'Place via API'}</button>` : ''}${s.source === 'cj' && s.status === 'AE_PLACED' ? `<button class="btn" data-cjpay="${esc(s.outer_purchase_id)}">Pay on CJ</button>` : ''}${s.source === 'banggood' && s.status === 'AE_PLACED' ? `<button class="btn" data-cjpay="${esc(s.outer_purchase_id)}">Paid on Banggood</button>` : ''}</div>` : ''}</div>` : ''}
      ${s.manual ? `<div class="stack" style="display:grid;gap:6px;margin-top:6px">${(s.links || []).map((x) => `<div class="muted">${x.qty} × ${esc(x.title)}${x.props ? ` (${esc(x.props)})` : ''} ${(x.link.match(/https?:\/\/\S+/) || [])[0] ? `· <a href="${esc(x.link.match(/https?:\/\/\S+/)[0])}" target="_blank" rel="noopener noreferrer">Open on Taobao</a>` : x.link ? `· <code>${esc(x.link.slice(0, 80))}</code>` : '· no link'}</div>`).join('')}
        ${canBuy() && ['MANUAL_TO_BUY', 'MANUAL_BOUGHT'].includes(s.status) ? `<div class="row"><input placeholder="Taobao order no." data-mo="${esc(s.outer_purchase_id)}" value="${esc((s.purchase_ids || []).join(','))}" style="width:170px"><input placeholder="Tracking to warehouse (when shipped)" data-mt="${esc(s.outer_purchase_id)}" style="flex:1;min-width:180px"><button class="btn" data-mb="${esc(s.outer_purchase_id)}">${s.status === 'MANUAL_TO_BUY' ? 'Mark bought' : 'Save tracking'}</button></div>` : ''}</div>` : ''}
      ${(s.logistics || []).length ? `<div class="muted">Shipping: ${s.logistics.map((x) => esc(`${x.carrier || ''} ${x.tracking}`)).join(' · ')}</div>` : ''}</div>`).join('') || '<p class="muted">Not created yet.</p>'}
    <div class="row">
      ${canBuy() && ['paid', 'attention'].includes(o.status) ? '<button class="btn" data-a="procure">Retry purchase</button>' : ''}
      ${canBuy() && o.sub_orders.some((s) => /WAIT_BUYER_P/.test(s.status)) ? '<button class="btn" data-a="pay-taobao">Pay Taobao</button>' : ''}
      <button class="btn ghost" data-a="sync">Sync</button>
      ${canMoney() && !['shipped', 'delivered', 'cancelled', 'refunded'].includes(o.status) ? '<button class="btn ghost bad" data-a="cancel">Cancel & refund</button>' : ''}
      <button class="btn ghost" id="close">Close</button></div>
    <details><summary class="muted">Timeline</summary><ul class="muted">${o.timeline.map((t) => `<li>${date(t.at)} — ${esc(t.event)}</li>`).join('')}</ul></details>
    <div class="err" id="oe"></div>`;
  $('#close').onclick = () => d.close();
  const paintMsgs = async () => {
    const ms = await api(`/api/admin/orders/${o.id}/messages`).catch(() => []);
    $('#amsgs').innerHTML = `${ms.map((m) => `<div style="padding:8px 10px;border-radius:10px;background:${m.from === 'staff' ? 'var(--jade-soft, #e6f4ef)' : 'var(--chip, #f1f3f7)'}"><b>${esc(m.name)}</b> <span class="muted">${m.thread === 'kinan' ? '→ Kinan' : `→ ${esc(m.thread)}`} · ${date(m.at)}</span><div dir="auto">${esc(m.text)}</div></div>`).join('') || '<span class="muted">No messages.</span>'}
      <form class="row" id="amf"><input name="text" placeholder="Reply to the customer as Kinan support" style="flex:1" required><button class="btn">Send</button></form>`;
    $('#amf').onsubmit = async (e) => { e.preventDefault(); try { await api(`/api/admin/orders/${o.id}/messages`, 'POST', { text: e.target.text.value }); paintMsgs(); } catch (err) { $('#oe').textContent = err.message; } };
  };
  paintMsgs();
  const qr = b.querySelector('[data-qcres]');
  if (qr) qr.onclick = async () => { qr.disabled = true; try { await api(`/api/admin/orders/${o.id}/qc-resolved`, 'POST', { note: $('#qcres').value }); openOrder(o.id); } catch (e) { $('#oe').textContent = e.message; qr.disabled = false; } };
  const ca = b.querySelector('[data-copyaddr]');
  if (ca) ca.onclick = () => { const t = ca.previousElementSibling.textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { ca.textContent = 'Copied'; }, () => prompt('Copy', t)); };
  const aeDo = (outer, body) => async (ev) => {
    ev.target.disabled = true;
    try { await api(`/api/admin/orders/${id}/aliexpress`, 'POST', { outer_purchase_id: outer, ...body() }); await openOrder(id); render(); }
    catch (e) { $('#oe').textContent = e.message; ev.target.disabled = false; }
  };
  b.querySelectorAll('[data-aesave]').forEach((btn) => { const o = btn.dataset.aesave; btn.onclick = aeDo(o, () => ({ ae_order_no: b.querySelector(`[data-aeo="${o}"]`).value.trim(), tracking: b.querySelector(`[data-aet="${o}"]`).value.trim(), carrier: b.querySelector(`[data-aec="${o}"]`).value.trim() })); });
  b.querySelectorAll('[data-aedel]').forEach((btn) => { btn.onclick = aeDo(btn.dataset.aedel, () => ({ delivered: true })); });
  b.querySelectorAll('[data-aeplace]').forEach((btn) => { btn.onclick = aeDo(btn.dataset.aeplace, () => ({ place: true })); });
  b.querySelectorAll('[data-cjpay]').forEach((btn) => { btn.onclick = aeDo(btn.dataset.cjpay, () => ({ pay: true })); });
  const nssDo = async (body, btn) => { if (btn) btn.disabled = true; try { const r = await api(`/api/admin/orders/${id}/nss`, 'POST', body); return r; } catch (e) { $('#oe').textContent = e.message; if (btn) btn.disabled = false; return null; } };
  b.querySelectorAll('[data-nss]').forEach((btn) => btn.onclick = async () => {
    const a = btn.dataset.nss;
    if (a === 'create') { const test = o.payment?.provider === 'demo' || o.payment?.mode === 'test'; if (test && !confirm('This order was paid with a TEST payment. Create it at NextSmartShip anyway? Shipping it costs real money.')) return; if (await nssDo({ action: 'create', force: test }, btn)) openOrder(id); }
    else if (a === 'sync') { if (await nssDo({ action: 'sync' }, btn)) openOrder(id); }
    else if (a === 'options') {
      const list = await nssDo({ action: 'options' }, btn); btn.disabled = false; if (!list) return;
      $('#nssopts').innerHTML = list.length ? `<div style="display:grid;gap:6px;margin-top:6px">${list.map((x, i) => `<label class="row"><input type="radio" name="nssr" value="${i}" ${i ? '' : 'checked'}> <b>${esc(x.name)}</b> · $${esc(x.fee)} · ${esc(x.min_days)}–${esc(x.max_days)} days</label>`).join('')}<div class="row"><button class="btn" id="nssgo">Send for shipping</button></div></div>` : '<p class="err">No shipping option for this address.</p>';
      const go = $('#nssgo'); if (go) go.onclick = async () => { const x = list[Number(b.querySelector('[name=nssr]:checked').value)]; if (!confirm(`Ship with ${x.name} for about $${x.fee}? It is charged to your NextSmartShip balance.`)) return; if (await nssDo({ action: 'ship', route_id: x.route_id, channel_id: x.channel_id }, go)) { openOrder(id); render(); } };
    }
  });
  b.querySelectorAll('[data-mb]').forEach((btn) => btn.onclick = async () => {
    const outer = btn.dataset.mb; btn.disabled = true;
    try { await api(`/api/admin/orders/${id}/manual-bought`, 'POST', { outer_purchase_id: outer, taobao_order_no: b.querySelector(`[data-mo="${outer}"]`).value.trim(), tracking: b.querySelector(`[data-mt="${outer}"]`).value.trim() }); await openOrder(id); render(); }
    catch (e) { $('#oe').textContent = e.message; btn.disabled = false; }
  });
  b.querySelectorAll('[data-a]').forEach((btn) => btn.onclick = async () => {
    if (btn.dataset.a === 'cancel' && !confirm('Cancel this order and refund the buyer?')) return;
    btn.disabled = true;
    try { await api(`/api/admin/orders/${id}/${btn.dataset.a}`, 'POST'); await openOrder(id); render(); } catch (e) { $('#oe').textContent = e.message; btn.disabled = false; }
  });
}

(async () => {
  const q = new URLSearchParams(location.search); const loginError = q.get('login_error') || '';
  if (q.get('ebay') === 'connected') tab = 'ebay';
  if (q.get('gads') === 'connected') tab = 'ai-tools';
  if (q.get('aliexpress') === 'connected' || q.get('taobao') === 'connected') tab = 'connections';
  if (loginError || q.get('aliexpress')) history.replaceState(null, '', '/admin');
  if (q.get('aliexpress') === 'connected') setTimeout(() => alert('AliExpress account connected'), 300);
  if (q.get('taobao') === 'connected') setTimeout(() => alert('Kinan’s Taobao account connected — sellers can now import from Taobao without signing in'), 300);
  googleSignin = await fetch('/api/config/public').then((r) => r.json()).then((c) => { cfg = c || {}; return Boolean(c.google_signin); }).catch(() => false);
  api('/api/me').then(asMe).then((u) => (STAFF_LOGIN.includes(u.role) ? boot(u) : u.role === 'warehouse' ? (location.href = '/warehouse') : showLogin(loginError || 'You are signed in to the shop with a customer account — use Continue with Google with the admin Gmail'))).catch(() => showLogin(loginError));
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
