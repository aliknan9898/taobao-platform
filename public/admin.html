<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinan Admin</title>
<meta name="theme-color" content="#ffffff">
<script src="/assets/theme.js"></script>
<link rel="manifest" href="/assets/admin.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kinan Admin">
<link rel="stylesheet" href="/assets/fonts.css">

<style>
  :root { --bg:#ffffff; --card:#fff; --ink:#141b3a; --muted:#6b7290; --line:#e1e5ee; --accent:#0e7c66; --accent-ink:#fff; --ok:#1f7a4d; --warn:#9a6400; --bad:#b42318; --chip:#eceff5; --marigold:#f4b400; }
  :root { color-scheme: light; }
  :root[data-theme="dark"] { --bg:#0f1428; --card:#171d36; --ink:#eef0f7; --muted:#9097b3; --line:#2a3150; --chip:#222a47; --accent:#2fb293; --accent-ink:#04221b; color-scheme: dark; }
  [data-theme-toggle] { display:inline-flex; align-items:center; gap:6px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Instrument Sans",system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header > .row { flex-wrap:wrap; justify-content:flex-end; }
  @media (max-width: 760px) {
    header { flex-wrap:wrap; padding:10px 12px; }
    header > .row { width:100%; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; gap:6px; scrollbar-width:none; }
    header > .row::-webkit-scrollbar { display:none; }
    header > .row .btn, header > .row button { padding:6px 10px; font-size:13px; white-space:nowrap; }
    header > .row .muted { display:none; }
  }
  .brand { display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:750; font-size:21px; letter-spacing:-.03em; }
  .brand svg { width:28px; height:28px; } .brand small { font:500 13px "Instrument Sans",system-ui,sans-serif; color:var(--muted); letter-spacing:0; }
  h1, h2 { font-family:"Bricolage Grotesque",system-ui,sans-serif; letter-spacing:-.01em; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  nav button { background:transparent; color:var(--muted); border:0; padding:8px 12px; border-radius:8px; font:inherit; cursor:pointer; white-space:nowrap; }
  nav button.on { background:var(--chip); color:var(--ink); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
  main > * { min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi b { display:block; font-size:22px; font-variant-numeric:tabular-nums; } .kpi span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .scroll { overflow-x:auto; }
  .pill { display:inline-block; font-size:12px; padding:1px 9px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); font-size:13px; }
  button.btn { font:inherit; border:0; border-radius:8px; padding:7px 12px; background:var(--accent); color:var(--accent-ink); cursor:pointer; white-space:nowrap; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  input, select { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .alerts li { margin:4px 0; } .alerts { margin:0; padding-inline-start:18px; }
  code { direction:ltr; unicode-bidi:embed; font-size:12px; background:var(--chip); padding:1px 5px; border-radius:4px; }
  .login { max-width:360px; margin:12vh auto; display:grid; gap:10px; }
  .login input { width:100%; }
  .err { color:var(--bad); white-space:pre-wrap; font-size:14px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); width:min(720px,94vw); padding:0; }
  .gbtn { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; border-radius:8px; border:1px solid #dadce0; background:#fff; color:#1f1f1f; font-weight:600; text-decoration:none; }
  .ordiv { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
  .ordiv::before, .ordiv::after { content:""; flex:1; height:1px; background:var(--line); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg { padding:16px; display:grid; gap:12px; }
  .sub { border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:4px; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:8px; min-width:0; }
  .bars.many { gap:2px; }
  .bars.many small { display:none; }
  .bars div { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .bars i { display:block; width:100%; background:var(--marigold); border-radius:4px 4px 0 0; min-height:2px; }
  .bars small { font-size:10px; color:var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<footer style="text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 28px">© 2026 Ali Almadhoun Mohammed Kinan. All rights reserved. · <a href="/legal" style="color:inherit">Legal notice</a> · <a href="/privacy" style="color:inherit">Privacy</a></footer>

<script>
// The platform owner has full access to every app: act as this app's role
const asMe = (u) => (u && u.owner ? { ...u, role: 'admin' } : u);
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (n, cur) => (Number(n) || 0).toLocaleString('en-GB', { style: cur ? 'currency' : undefined, currency: cur ? cur.toUpperCase() : undefined, maximumFractionDigits: 2 });
const date = (t) => t ? new Date(Number(t)).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const statusClass = (s) => ({ delivered:'ok', shipped:'ok', ready_to_ship:'ok', active:'ok', attention:'bad', cancelled:'bad', refunded:'bad', suspended:'bad', pending:'warn' }[s] || 'warn');

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || 'Please sign in'); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function showLogin(msg = '') {
  $('#app').innerHTML = `<form class="card login" id="lf"><a class="brand" href="/admin"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0e7c66"/><path d="M20 15h8v14l13-14h10L36.5 30.5 52 49H41.5L28 33v16h-8z" fill="#fff"/><circle cx="49" cy="15" r="6" fill="#f4b400"/></svg><span>kinan</span><small>Admin</small></a><h2>Sign in to the admin dashboard</h2>
    ${googleSignin ? `<a class="gbtn" href="/auth/google?app=admin"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Continue with Google</a><div class="ordiv"><span>or with email</span></div>` : ''}
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="btn">Sign in</button><div class="err">${esc(msg)}</div><a class="muted" style="font-size:13px" href="/reset?app=admin">Forgot your password?</a></form>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try {
      const r = await api('/api/auth/login', 'POST', { email: f.get('email'), password: f.get('password') });
      if (asMe(r.user).role === 'warehouse') { location.href = '/warehouse'; return; }
      if (!STAFF_LOGIN.includes(asMe(r.user).role)) { await api('/api/auth/logout', 'POST'); return showLogin('This account is not a staff account'); }
      boot(asMe(r.user));
    } catch (err) { showLogin(err.message); }
  };
}

let googleSignin = false;
// [tab, label, roles that see it]
const ALL_TABS = [['overview','Overview','*'],['orders','Orders','*'],['reports','Reports','admin finance'],['sellers','Sellers','admin'],['listings','Products','admin'],
  ['cj','CJdropshipping','admin procurement'],['requests','Item requests','admin procurement support'],['payouts','Withdrawals','admin finance'],['returns','Returns','admin finance support'],['shipping','Shipping','admin'],['coupons','Discount codes','admin'],['backup','Backup','admin'],['reviews','Reviews','admin support'],['users','Users','admin finance support']];
const STAFF_LOGIN = ['admin', 'procurement', 'finance', 'support'];
const can = (roles) => roles === '*' || roles.split(' ').includes(me?.role);
let TABS = ALL_TABS;
const isAdmin = () => me?.role === 'admin';
const canBuy = () => ['admin', 'procurement'].includes(me?.role);
const canMoney = () => ['admin', 'finance'].includes(me?.role);
let tab = 'overview', me;

function boot(user) {
  me = user;
  TABS = ALL_TABS.filter(([, , r]) => can(r));
  if (!TABS.some(([k]) => k === tab)) tab = 'overview';
  $('#app').innerHTML = `<header><a class="brand" href="/admin"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0e7c66"/><path d="M20 15h8v14l13-14h10L36.5 30.5 52 49H41.5L28 33v16h-8z" fill="#fff"/><circle cx="49" cy="15" r="6" fill="#f4b400"/></svg><span>kinan</span><small>${user.role === 'admin' ? 'Admin' : esc(user.role.charAt(0).toUpperCase() + user.role.slice(1))}</small></a>
      <div class="row"><a href="/" target="_blank" rel="noopener"><button class="btn ghost">Kinan Shop</button></a><a href="/seller" target="_blank" rel="noopener"><button class="btn ghost">Seller Center</button></a><a href="/warehouse"><button class="btn ghost">Warehouse</button></a>${KinanTheme.button('btn ghost')}<span class="muted">${esc(user.email)}</span><button class="btn ghost" id="lo">Sign out</button></div></header>
    <nav>${TABS.map(([k, t]) => `<button data-t="${k}">${t}</button>`).join('')}</nav><main id="view"></main>
    <dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>`;
  $('#lo').onclick = async () => { await api('/api/auth/logout', 'POST'); showLogin(); };
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
  render();
}

async function render() {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  const v = $('#view'); v.innerHTML = '<p class="muted">Loading…</p>';
  try { await VIEWS[tab](v); } catch (e) { v.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

const VIEWS = {
  async overview(v) {
    const d = await api('/api/admin/overview'); const k = d.kpis; const c = d.currency;
    const max = Math.max(1, ...d.daily.map((x) => x.revenue));
    v.innerHTML = `
      <div class="kpis">
        <div class="kpi"><span>Revenue (30 days)</span><b>${fmt(k.revenue_30d, c)}</b></div>
        <div class="kpi"><span>Orders (30 days)</span><b>${fmt(k.orders_30d)}</b></div>
        <div class="kpi"><span>Platform commission</span><b>${fmt(k.commission_total, c)}</b></div>
        <div class="kpi"><span>Payable to sellers</span><b>${fmt(k.payable_to_sellers, c)}</b></div>
        <div class="kpi"><span>Active sellers</span><b>${fmt(k.active_sellers)}</b></div>
        <div class="kpi"><span>Live products</span><b>${fmt(k.listings)}</b></div>
        <div class="kpi" style="cursor:pointer" onclick="tab='listings';render()"><span>Awaiting your approval</span><b class="${k.listings_pending ? 'warn' : ''}">${fmt(k.listings_pending)}</b></div>
      </div>
      <div class="card"><h2>Daily revenue (14 days)</h2>
        <div class="bars">${d.daily.map((x) => `<div title="${esc(x.date)}: ${fmt(x.revenue, c)}"><i style="height:${(x.revenue / max) * 100}%"></i><small>${esc(x.date.slice(3))}</small></div>`).join('')}</div></div>
      <div class="card"><h2>Alerts</h2>${d.alerts.length ? `<ul class="alerts">${d.alerts.map((a) => `<li class="${a.kind === 'order' || a.kind === 'pay_deadline' ? 'bad' : 'warn'}">${esc(a.text)}</li>`).join('')}</ul>` : '<p class="muted">No alerts.</p>'}</div>
      <div class="card" id="aireview"><h2>🤖 AI product review</h2><p class="muted">Loading…</p></div>
      <div class="card"><h2>Orders by status</h2><div class="row">${Object.entries(d.by_status).map(([s, n]) => `<span class="pill ${statusClass(s)}">${esc(STATUS_LABEL[s] || s)}: ${n}</span>`).join('') || '<span class="muted">No orders</span>'}</div></div>
      <div class="card" id="tbcard"><h2>Taobao — Kinan’s account</h2><p class="muted">Loading…</p></div>
      <div class="card" id="aicard"><h2>AI assistant</h2><p class="muted">Loading…</p></div>
      <div class="card" id="ebay"><h2>eBay</h2><p class="muted">Loading…</p></div>
      <div class="card" id="xmascard"><h2>🎄 Christmas Shop</h2><p class="muted">Loading…</p></div>
      <div class="card" id="bgcard"><h2>Banggood</h2><p class="muted">Loading…</p></div>
      <div class="card" id="nsscard"><h2>NextSmartShip — China warehouse &amp; shipping</h2><p class="muted">Loading…</p></div>
      <div class="card" id="aecard"><h2>AliExpress</h2><p class="muted">Loading…</p></div>
      ${isAdmin() ? '' : '<!--'}<div class="card"><h2>Setup & integrations</h2>
        ${d.config_problems.length ? `<p class="warn">Missing: ${d.config_problems.map((x) => `<code>${esc(x)}</code>`).join(' ')}</p>` : '<p class="ok">Configuration complete.</p>'}
        <p class="muted">Taobao Callback URL: <code>${esc(d.webhook_urls.oauth_callback)}</code><br>
        Taobao Message Service: <code>${esc(d.webhook_urls.taobao)}</code><br>Stripe Webhook: <code>${esc(d.webhook_urls.stripe)}</code><br>
        Messages waiting to be processed: ${d.inbox_backlog}</p></div>${isAdmin() ? '' : '-->'}`;
    const aiCard = () => api('/api/admin/ai').then((st) => {
      const el = $('#aicard'); if (!el) return;
      const usd = (n) => `$${Number(n || 0).toFixed(n < 1 ? 3 : 2)}`;
      if (!st.enabled) {
        el.innerHTML = `<h2>AI assistant</h2><p><span class="pill warn">Not switched on</span></p>
          <p class="muted">Everything is ready: sellers get “Improve with AI” (title, description, Arabic, keywords and a photo check) when adding or editing a product from Taobao, CJ, Banggood or by hand, and Kinan’s own products — including the Christmas Shop — are rewritten automatically.</p>
          <p class="muted">To switch it on: create an API key at <a href="https://platform.claude.com" target="_blank" rel="noopener">platform.claude.com</a> → Keys, then add <code>ANTHROPIC_API_KEY</code> in Render → Environment. Optional: <code>AI_MODEL</code> (default <code>${esc(st.model)}</code>).</p>
          <p class="muted small">${esc(st.pending)} Kinan products are waiting to be rewritten. With ${esc(st.model)} that costs about ${usd(st.pending * (st.price_per_million.input * 0.0015 + st.price_per_million.output * 0.0006))}.</p>`;
        return;
      }
      el.innerHTML = `<h2>AI assistant</h2>
        <p><span class="pill ok">On</span> · model <b>${esc(st.model)}</b> · ${esc(st.daily_limit_per_shop)} uses per shop per day</p>
        <div class="row" style="gap:18px;flex-wrap:wrap"><div><div class="muted small">Today</div><b>${st.today.calls} calls · ${usd(st.today.cost)}</b></div><div><div class="muted small">This month</div><b>${st.month.calls} calls · ${usd(st.month.cost)}</b></div><div><div class="muted small">Kinan products waiting</div><b>${st.pending}</b></div></div>
        ${isAdmin() ? `<div class="row" style="margin-top:10px;gap:10px;flex-wrap:wrap"><label class="row" style="gap:6px"><input type="checkbox" id="aiauto" ${st.prefs.auto ? 'checked' : ''}> Rewrite new Kinan products automatically (hourly)</label><button class="btn sm" id="aigo2" ${st.running || !st.pending ? 'disabled' : ''}>Rewrite 40 now</button><span class="muted small" id="aim"></span></div>` : ''}
        ${/^gemini/.test(st.model) ? '<p class="muted small">Google Gemini free tier — no cost. The “AI product review” card below now checks every product (Kinan’s included), so the hourly rewrite here waits while it is on.</p>' : `<p class="muted small">Estimated cost from Anthropic’s list prices (${usd(st.price_per_million.input)} in / ${usd(st.price_per_million.output)} out per million tokens). Your real bill is in the Claude Console.</p>`}`;
      const auto = $('#aiauto'); if (auto) auto.onchange = () => api('/api/admin/ai', 'PUT', { auto: auto.checked }).then(() => toast('Saved'));
      const go = $('#aigo2'); if (go) go.onclick = async () => { go.disabled = true; $('#aim').textContent = 'Working… about a minute'; try { const r = await api('/api/admin/ai/improve', 'POST', {}); $('#aim').textContent = `Rewritten ${r.done}, ${r.left} left`; aiCard(); } catch (e) { $('#aim').textContent = e.message; go.disabled = false; } };
    }).catch(() => {});
    aiCard();
    const xmas = () => api('/api/admin/collections/christmas').then(({ state: st, rows }) => {
      const el = $('#xmascard'); if (!el) return;
      const live = rows.filter((r) => r.status === 'active');
      const avg = live.length ? Math.round(live.reduce((a, r) => a + (r.margin_pct || 0), 0) / live.length) : 0;
      el.innerHTML = `<h2>🎄 Christmas Shop</h2>
        <p>${st.running ? `<span class="pill warn">Importing…</span> ${st.added || 0} added, ${st.checked || 0} checked` : `<span class="pill ok">${live.length} products live</span>`} · average margin ${avg}% · shop page <a href="/christmas" target="_blank" rel="noopener">kinan.shop/christmas</a></p>
        ${st.done_at ? `<p class="muted">Last import ${new Date(st.done_at).toLocaleString()}: added ${st.added}, skipped ${st.skipped}${st.reasons && Object.keys(st.reasons).length ? ` (${Object.entries(st.reasons).map(([k, v]) => `${esc(k)}: ${v}`).join(', ')})` : ''}${st.error ? ` — <span class="bad">${esc(st.error)}</span>` : ''}</p>` : ''}
        <p class="muted">CJ products kept in European warehouses (Germany, France, Spain, Italy, Poland, Czechia, Netherlands, then UK), checked for stock and shipping. Coupon <b>XMAS10</b> (10%) is in Coupons.</p>
        ${isAdmin() ? `<form class="row" id="xf"><label>Products <input type="number" name="count" min="1" max="400" value="${esc(st.prefs?.count || 200)}" style="width:70px"></label><label>Markup % <input type="number" name="markup_pct" min="10" max="400" value="${esc(st.prefs?.markup_pct || 100)}" style="width:70px"></label><label>Max CJ cost $ <input type="number" name="max_cost" min="2" max="200" value="${esc(st.prefs?.max_cost || 35)}" style="width:70px"></label><button class="btn" ${st.running ? 'disabled' : ''}>Add products</button><a href="/api/admin/collections/christmas/export.csv" download><button type="button" class="btn ghost">Download CSV</button></a><span class="muted" id="xm"></span></form>` : ''}

      ${r.items.map((i) => `<div class="muted">${i.qty} × ${esc(i.title)}${i.props ? ` (${esc(i.props)})` : ''} · ${fmt(i.price * i.qty, r.currency)} · ${esc(i.shop)}</div>`).join('')}
      ${r.photos.length ? `<div class="row">${r.photos.map((ph) => `<a href="${esc(ph)}" target="_blank"><img src="${esc(ph)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px"></a>`).join('')}</div>` : ''}
      ${r.admin_note ? `<div class="muted">Your note: ${esc(r.admin_note)}</div>` : ''}${r.refund_amount ? `<div class="ok">Refunded ${fmt(r.refund_amount, r.currency)} to ${r.refund_to === 'card' ? 'card' : 'wallet'}</div>` : ''}
      ${['requested', 'approved'].includes(r.status) ? `<div class="row"><input data-rn="${esc(r.id)}" placeholder="Note to the customer (return address, reason…)" style="flex:1;min-width:220px"></div>
        <div class="row"><input type="number" step="0.01" min="0" data-ra="${esc(r.id)}" value="${r.value}" style="width:110px">
          <select data-rto="${esc(r.id)}"><option value="wallet">to Kinan wallet</option>${r.paid_by === 'stripe' ? '<option value="card">to card</option>' : ''}</select>
          <label class="row" style="gap:4px"><input type="checkbox" data-rcs="${esc(r.id)}" checked style="width:auto">charge seller</label>
          ${canMoney() ? `<button class="btn" data-ract="refund" data-id="${esc(r.id)}">Refund</button>` : ''}
          ${r.status === 'requested' ? `<button class="btn ghost" data-ract="approve" data-id="${esc(r.id)}">Approve return</button>` : ''}
          <button class="btn ghost bad" data-ract="reject" data-id="${esc(r.id)}">Reject</button></div>` : ''}
    </div>`).join('') || '<div class="card muted">No returns here.</div>'}`;
  v.querySelectorAll('[data-rtf]').forEach((b) => b.onclick = () => { v.dataset.rtf = b.dataset.rtf; render(); });
  v.querySelectorAll('[data-ract]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.id; const q = (k) => v.querySelector(`[${k}="${id}"]`);
    if (b.dataset.ract === 'refund' && !confirm(`Refund ${q('data-ra').value}?`)) return;
    b.disabled = true;
    try { await api(`/api/admin/returns/${id}`, 'POST', { action: b.dataset.ract, note: q('data-rn').value, amount: Number(q('data-ra').value), refund_to: q('data-rto').value, charge_seller: q('data-rcs').checked }); render(); }
    catch (e) { alert(e.message); b.disabled = false; }
  });
};

/** Seller identity check: details, document photos and live selfie side by side. */

  b.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Seller verification — ${esc(k.shop_name)}</h2><span class="pill ${k.state === 'approved' ? 'ok' : k.state === 'rejected' ? 'bad' : 'warn'}">${esc({ submitted: 'Waiting for review', approved: 'Verified', rejected: 'Correction asked', none: 'Not sent' }[k.state])}</span></div>
    <div class="muted">${esc(k.email || '')}${k.submitted_at ? ` · sent ${date(k.submitted_at)}` : ''}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0">${pic('selfie', 'Live selfie')}${pic('id_front', 'Document — front / photo page')}${pic('id_back', 'Document — back')}</div>
    <table>${row('Full name', x.full_name)}${row('Date of birth', x.date_of_birth ? `${x.date_of_birth}${age !== null ? ` (${age} years)` : ''}` : '')}${row('Nationality', x.nationality)}${row('Phone', x.phone)}
      ${row('Address', [x.address, x.city, x.postal_code, x.country].filter(Boolean).join(', '))}${row('Shop name', x.shop_name)}${row('Seller type', x.business_type === 'company' ? `Company — ${x.company_name}${x.company_number ? ` (${x.company_number})` : ''}` : 'Individual')}
      ${row('Document', `${k.id_type_label || ''} ${x.id_number || ''}${x.id_expiry ? ` · expires ${x.id_expiry}` : ''}`)}${row('Will sell', x.products)}</table>
    <p class="muted">Check that the face in the selfie matches the document photo, that the name and date of birth match the document, and that the document is not expired.</p>
    ${k.state === 'submitted' || k.state === 'rejected' ? `<div class="row"><input id="kreason" placeholder="If something is wrong: what must the seller correct?" style="flex:1;min-width:220px"><button class="btn ghost bad" id="krej">Ask for correction</button><button class="btn" id="kok">Approve seller</button></div>` : ''}
    ${k.reason ? `<p class="muted">Last note to the seller: “${esc(k.reason)}”</p>` : ''}
    <div class="err" id="ke"></div><div class="row"><button class="btn ghost" id="close">Close</button></div>`;
  $('#close').onclick = () => { d.close(); render(); };
  const act = (approve) => async (e) => { e.target.disabled = true; try { await api(`/api/admin/sellers/${id}/verification`, 'POST', { approve, reason: $('#kreason')?.value || '' }); d.close(); render(); } catch (err) { $('#ke').textContent = err.message; e.target.disabled = false; } };
  if ($('#kok')) { $('#kok').onclick = act(true); $('#krej').onclick = act(false); }
}

  });
  b.querySelectorAll('[data-mb]').forEach((btn) => btn.onclick = async () => {
    const outer = btn.dataset.mb; btn.disabled = true;
    try { await api(`/api/admin/orders/${id}/manual-bought`, 'POST', { outer_purchase_id: outer, taobao_order_no: b.querySelector(`[data-mo="${outer}"]`).value.trim(), tracking: b.querySelector(`[data-mt="${outer}"]`).value.trim() }); await openOrder(id); render(); }
    catch (e) { $('#oe').textContent = e.message; btn.disabled = false; }
  });
  b.querySelectorAll('[data-a]').forEach((btn) => btn.onclick = async () => {
    if (btn.dataset.a === 'cancel' && !confirm('Cancel this order and refund the buyer?')) return;
    btn.disabled = true;
    try { await api(`/api/admin/orders/${id}/${btn.dataset.a}`, 'POST'); await openOrder(id); render(); } catch (e) { $('#oe').textContent = e.message; btn.disabled = false; }
  });
}

(async () => {
  const q = new URLSearchParams(location.search); const loginError = q.get('login_error') || '';
  if (loginError || q.get('aliexpress')) history.replaceState(null, '', '/admin');
  if (q.get('aliexpress') === 'connected') setTimeout(() => alert('AliExpress account connected'), 300);
  if (q.get('taobao') === 'connected') setTimeout(() => alert('Kinan’s Taobao account connected — sellers can now import from Taobao without signing in'), 300);
  googleSignin = await fetch('/api/config/public').then((r) => r.json()).then((c) => Boolean(c.google_signin)).catch(() => false);
  api('/api/me').then(asMe).then((u) => (STAFF_LOGIN.includes(u.role) ? boot(u) : u.role === 'warehouse' ? (location.href = '/warehouse') : showLogin(loginError || 'You are signed in to the shop with a customer account — use Continue with Google with the admin Gmail'))).catch(() => showLogin(loginError));
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
