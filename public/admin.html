<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinan Admin</title>
<meta name="theme-color" content="#ffffff">
<script src="/assets/theme.js"></script>
<link rel="manifest" href="/assets/admin.webmanifest">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kinan Admin">
<link rel="stylesheet" href="/assets/fonts.css">

<style>
  :root { --bg:#ffffff; --card:#fff; --ink:#141b3a; --muted:#6b7290; --line:#e1e5ee; --accent:#0e7c66; --accent-ink:#fff; --ok:#1f7a4d; --warn:#9a6400; --bad:#b42318; --chip:#eceff5; --marigold:#f4b400; }
  :root { color-scheme: light; }
  :root[data-theme="dark"] { --bg:#0f1428; --card:#171d36; --ink:#eef0f7; --muted:#9097b3; --line:#2a3150; --chip:#222a47; --accent:#2fb293; --accent-ink:#04221b; color-scheme: dark; }
  [data-theme-toggle] { display:inline-flex; align-items:center; gap:6px; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Instrument Sans",system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header > .row { flex-wrap:wrap; justify-content:flex-end; }
  @media (max-width: 760px) {
    header { flex-wrap:wrap; padding:10px 12px; }
    header > .row { width:100%; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; gap:6px; scrollbar-width:none; }
    header > .row::-webkit-scrollbar { display:none; }
    header > .row .btn, header > .row button { padding:6px 10px; font-size:13px; white-space:nowrap; }
    header > .row .muted { display:none; }
  }
  .brand { display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:750; font-size:21px; letter-spacing:-.03em; }
  .brand svg { width:28px; height:28px; } .brand small { font:500 13px "Instrument Sans",system-ui,sans-serif; color:var(--muted); letter-spacing:0; }
  h1, h2 { font-family:"Bricolage Grotesque",system-ui,sans-serif; letter-spacing:-.01em; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  nav button { background:transparent; color:var(--muted); border:0; padding:8px 12px; border-radius:8px; font:inherit; cursor:pointer; white-space:nowrap; }
  nav button.on { background:var(--chip); color:var(--ink); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
  main > * { min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi b { display:block; font-size:22px; font-variant-numeric:tabular-nums; } .kpi span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .scroll { overflow-x:auto; }
  .pill { display:inline-block; font-size:12px; padding:1px 9px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); font-size:13px; }
  button.btn { font:inherit; border:0; border-radius:8px; padding:7px 12px; background:var(--accent); color:var(--accent-ink); cursor:pointer; white-space:nowrap; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  input, select { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .alerts li { margin:4px 0; } .alerts { margin:0; padding-inline-start:18px; }
  code { direction:ltr; unicode-bidi:embed; font-size:12px; background:var(--chip); padding:1px 5px; border-radius:4px; }
  .login { max-width:360px; margin:12vh auto; display:grid; gap:10px; }
  .login input { width:100%; }
  .err { color:var(--bad); white-space:pre-wrap; font-size:14px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); width:min(720px,94vw); padding:0; }
  .gbtn { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; border-radius:8px; border:1px solid #dadce0; background:#fff; color:#1f1f1f; font-weight:600; text-decoration:none; }
  .ordiv { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
  .ordiv::before, .ordiv::after { content:""; flex:1; height:1px; background:var(--line); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg { padding:16px; display:grid; gap:12px; }
  .sub { border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:4px; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:8px; min-width:0; }
  .bars.many { gap:2px; }
  .bars.many small { display:none; }
  .bars div { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
  .bars i { display:block; width:100%; background:var(--marigold); border-radius:4px 4px 0 0; min-height:2px; }
  .bars small { font-size:10px; color:var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<footer style="text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 28px">© 2026 Ali Almadhoun Mohammed Kinan. All rights reserved. · <a href="/legal" style="color:inherit">Legal notice</a> · <a href="/privacy" style="color:inherit">Privacy</a></footer>

<script>
// The platform owner has full access to every app: act as this app's role
const asMe = (u) => (u && u.owner ? { ...u, role: 'admin' } : u);
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (n, cur) => (Number(n) || 0).toLocaleString('en-GB', { style: cur ? 'currency' : undefined, currency: cur ? cur.toUpperCase() : undefined, maximumFractionDigits: 2 });
const date = (t) => t ? new Date(Number(t)).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const statusClass = (s) => ({ delivered:'ok', shipped:'ok', ready_to_ship:'ok', active:'ok', attention:'bad', cancelled:'bad', refunded:'bad', suspended:'bad', pending:'warn' }[s] || 'warn');

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error(j.error || 'Please sign in'); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function showLogin(msg = '') {
  $('#app').innerHTML = `<form class="card login" id="lf"><a class="brand" href="/admin"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0e7c66"/><path d="M20 15h8v14l13-14h10L36.5 30.5 52 49H41.5L28 33v16h-8z" fill="#fff"/><circle cx="49" cy="15" r="6" fill="#f4b400"/></svg><span>kinan</span><small>Admin</small></a><h2>Sign in to the admin dashboard</h2>
    ${googleSignin ? `<a class="gbtn" href="/auth/google?app=admin"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.2-8.5 2.2-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Continue with Google</a><div class="ordiv"><span>or with email</span></div>` : ''}
    <input name="email" type="email" placeholder="Email" required autocomplete="username">
    <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <button class="btn">Sign in</button><div class="err">${esc(msg)}</div><a class="muted" style="font-size:13px" href="/reset?app=admin">Forgot your password?</a></form>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try {
      const r = await api('/api/auth/login', 'POST', { email: f.get('email'), password: f.get('password') });
      if (asMe(r.user).role === 'warehouse') { location.href = '/warehouse'; return; }
      if (!STAFF_LOGIN.includes(asMe(r.user).role)) { await api('/api/auth/logout', 'POST'); return showLogin('This account is not a staff account'); }
      boot(asMe(r.user));
    } catch (err) { showLogin(err.message); }
  };
}

let googleSignin = false;
// [tab, label, roles that see it]
const ALL_TABS = [['overview','Overview','*'],['orders','Orders','*'],['reports','Reports','admin finance'],['sellers','Sellers','admin'],['listings','Products','admin'],
  ['cj','CJdropshipping','admin procurement'],['requests','Item requests','admin procurement support'],['payouts','Withdrawals','admin finance'],['returns','Returns','admin finance support'],['shipping','Shipping','admin'],['coupons','Discount codes','admin'],['backup','Backup','admin'],['reviews','Reviews','admin support'],['users','Users','admin finance support']];
const STAFF_LOGIN = ['admin', 'procurement', 'finance', 'support'];
const can = (roles) => roles === '*' || roles.split(' ').includes(me?.role);
let TABS = ALL_TABS;
const isAdmin = () => me?.role === 'admin';
const canBuy = () => ['admin', 'procurement'].includes(me?.role);
const canMoney = () => ['admin', 'finance'].includes(me?.role);
let tab = 'overview', me;

function boot(user) {
  me = user;
  TABS = ALL_TABS.filter(([, , r]) => can(r));
  if (!TABS.some(([k]) => k === tab)) tab = 'overview';
  $('#app').innerHTML = `<header><a class="brand" href="/admin"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0e7c66"/><path d="M20 15h8v14l13-14h10L36.5 30.5 52 49H41.5L28 33v16h-8z" fill="#fff"/><circle cx="49" cy="15" r="6" fill="#f4b400"/></svg><span>kinan</span><small>${user.role === 'admin' ? 'Admin' : esc(user.role.charAt(0).toUpperCase() + user.role.slice(1))}</small></a>
      <div class="row"><a href="/" target="_blank" rel="noopener"><button class="btn ghost">Kinan Shop</button></a><a href="/seller" target="_blank" rel="noopener"><button class="btn ghost">Seller Center</button></a><a href="/warehouse"><button class="btn ghost">Warehouse</button></a>${KinanTheme.button('btn ghost')}<span class="muted">${esc(user.email)}</span><button class="btn ghost" id="lo">Sign out</button></div></header>
    <nav>${TABS.map(([k, t]) => `<button data-t="${k}">${t}</button>`).join('')}</nav><main id="view"></main>
    <dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>`;
  $('#lo').onclick = async () => { await api('/api/auth/logout', 'POST'); showLogin(); };
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
  render();
}

async function render() {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  const v = $('#view'); v.innerHTML = '<p class="muted">Loading…</p>';
  try { await VIEWS[tab](v); } catch (e) { v.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

const VIEWS = {
  async overview(v) {
    const d = await api('/api/admin/overview'); const k = d.kpis; const c = d.currency;
    const max = Math.max(1, ...d.daily.map((x) => x.revenue));
    v.innerHTML = `
      <div class="kpis">
        <div class="kpi"><span>Revenue (30 days)</span><b>${fmt(k.revenue_30d, c)}</b></div>
        <div class="kpi"><span>Orders (30 days)</span><b>${fmt(k.orders_30d)}</b></div>
        <div class="kpi"><span>Platform commission</span><b>${fmt(k.commission_total, c)}</b></div>
        <div class="kpi"><span>Payable to sellers</span><b>${fmt(k.payable_to_sellers, c)}</b></div>
        <div class="kpi"><span>Active sellers</span><b>${fmt(k.active_sellers)}</b></div>
        <div class="kpi"><span>Live products</span><b>${fmt(k.listings)}</b></div>
        <div class="kpi" style="cursor:pointer" onclick="tab='listings';render()"><span>Awaiting your approval</span><b class="${k.listings_pending ? 'warn' : ''}">${fmt(k.listings_pending)}</b></div>
      </div>
      <div class="card"><h2>Daily revenue (14 days)</h2>
        <div class="bars">${d.daily.map((x) => `<div title="${esc(x.date)}: ${fmt(x.revenue, c)}"><i style="height:${(x.revenue / max) * 100}%"></i><small>${esc(x.date.slice(3))}</small></div>`).join('')}</div></div>
      <div class="card"><h2>Alerts</h2>${d.alerts.length ? `<ul class="alerts">${d.alerts.map((a) => `<li class="${a.kind === 'order' || a.kind === 'pay_deadline' ? 'bad' : 'warn'}">${esc(a.text)}</li>`).join('')}</ul>` : '<p class="muted">No alerts.</p>'}</div>
      <div class="card"><h2>Orders by status</h2><div class="row">${Object.entries(d.by_status).map(([s, n]) => `<span class="pill ${statusClass(s)}">${esc(STATUS_LABEL[s] || s)}: ${n}</span>`).join('') || '<span class="muted">No orders</span>'}</div></div>
      <div class="card" id="aecard"><h2>AliExpress</h2><p class="muted">Loading…</p></div>
      ${isAdmin() ? '' : '<!--'}<div class="card"><h2>Setup & integrations</h2>
        ${d.config_problems.length ? `<p class="warn">Missing: ${d.config_problems.map((x) => `<code>${esc(x)}</code>`).join(' ')}</p>` : '<p class="ok">Configuration complete.</p>'}
        <p class="muted">Taobao Callback URL: <code>${esc(d.webhook_urls.oauth_callback)}</code><br>
        Taobao Message Service: <code>${esc(d.webhook_urls.taobao)}</code><br>Stripe Webhook: <code>${esc(d.webhook_urls.stripe)}</code><br>
        Messages waiting to be processed: ${d.inbox_backlog}</p></div>${isAdmin() ? '' : '-->'}`;
    const aeS = await api('/api/admin/aliexpress');
    $('#aecard').innerHTML = `<h2>AliExpress</h2>
      <p>${aeS.mode === 'api' ? `<span class="pill ok">Connected</span> ${esc(aeS.account || '')} — products import from a link; orders are placed automatically.${aeS.needs_reauth_soon ? ' <span class="pill warn">Reconnect soon</span>' : ''}`
        : aeS.api_configured ? '<span class="pill warn">Not connected</span> Connect Kinan’s AliExpress account to place orders automatically.'
        : '<span class="pill warn">Manual mode</span> Sellers add AliExpress products by hand and you order them on AliExpress yourself. Add <code>ALIEXPRESS_APP_KEY</code> and <code>ALIEXPRESS_APP_SECRET</code> to switch on automatic import and ordering.'}</p>
      <p class="muted">AliExpress items ship straight to the customer (about ${esc(aeS.delivery_days)} days). Callback URL for the AliExpress app: <code>${esc(aeS.redirect_uri)}</code></p>
      <div class="row">${aeS.api_configured && isAdmin() ? `<button class="btn" id="aeconn">${aeS.connected ? 'Reconnect' : 'Connect AliExpress account'}</button>` : ''}${aeS.connected && isAdmin() ? '<button class="btn ghost" id="aedis">Disconnect</button>' : ''}</div>`;
    const aeC = $('#aeconn'); if (aeC) aeC.onclick = async () => { try { location.href = (await api('/api/admin/aliexpress/connect', 'POST')).url; } catch (e) { alert(e.message); } };
    const x = $('#aedis'); if (x) x.onclick = async () => { if (confirm('Disconnect AliExpress? New AliExpress orders will need to be placed by hand.')) { await api('/api/admin/aliexpress/disconnect', 'POST'); render(); } };
  },

  async cj(v) {
    const st = await api('/api/admin/cj'); const p = st.prefs;
    if (!st.configured) {
      v.innerHTML = `<div class="card"><h2>CJdropshipping</h2><p><span class="pill warn">Not connected</span></p>
        <ol><li>Create a free account on <a href="https://cjdropshipping.com" target="_blank" rel="noopener">cjdropshipping.com</a>.</li>
        <li>In your CJ account open <b>Authorization → API</b> and generate an <b>API Key</b>.</li>
        <li>On Render → kinan → Environment add <code>CJ_API_KEY</code> with that key, then save.</li></ol>
        <p class="muted">After the restart Kinan signs in to CJ, registers its webhooks and this page shows the CJ catalog, your CJ balance and CJ orders.</p></div>`;
      return;
    }
    const fmtUsd = (n) => `$${Number(n || 0).toFixed(2)}`;
    v.innerHTML = `<div class="card"><h2>CJdropshipping</h2>
        ${st.connected ? `<p><span class="pill ok">Connected</span> CJ balance <b>${fmtUsd(st.balance?.amount)}</b>${st.balance?.bonus ? ` + ${fmtUsd(st.balance.bonus)} bonus` : ''}${st.balance?.frozen ? ` · ${fmtUsd(st.balance.frozen)} frozen` : ''} · <a href="https://cjdropshipping.com/my.html#/myWallet" target="_blank" rel="noopener">Top up on CJ</a></p>` : `<p><span class="pill bad">Cannot sign in</span> ${esc(st.error || '')}</p>`}
        <p class="muted">CJ items ship from CJ straight to the customer. After payment Kinan creates the CJ order with the customer’s address and pays it from your CJ balance. Orders paid with test payments become CJ sandbox orders (nothing is bought).
        Webhooks: ${st.webhooks ? `<code>${esc(st.webhooks.url)}</code>` : '<span class="warn">not registered yet</span>'}</p>
        ${isAdmin() ? `<form class="row" id="cjset">
          <label>Shipping method <select name="shipping"><option value="cheapest" ${p.shipping === 'cheapest' ? 'selected' : ''}>Cheapest</option><option value="balanced" ${p.shipping === 'balanced' ? 'selected' : ''}>Cheapest within max days</option><option value="fastest" ${p.shipping === 'fastest' ? 'selected' : ''}>Fastest</option></select></label>
          <label>Max days <input name="max_days" type="number" min="3" max="60" value="${esc(p.max_days)}" style="width:70px"></label>
          <label>Default markup % <input name="markup_pct" type="number" min="0" max="500" value="${esc(p.markup_pct)}" style="width:80px"></label>
          <label><input type="checkbox" name="auto_pay" ${p.auto_pay ? 'checked' : ''}> Pay CJ orders automatically</label>
          <button class="btn">Save</button><button class="btn ghost" type="button" id="cjhooks">Re-register webhooks</button><button class="btn ghost" type="button" id="cjsync">Check prices & stock now</button></form>` : ''}
        <div class="muted" id="cjmsg"></div></div>
      ${isAdmin() ? `<div class="card"><h2>Add CJ products to the Kinan shop</h2>
        <form class="row" id="cjq"><input name="q" placeholder="Search the CJ catalog (English), or paste a CJ link / SKU" style="flex:1;min-width:220px" required><button class="btn">Search</button></form>
        <div id="cjres" style="display:grid;gap:8px;margin-top:10px"></div></div>` : ''}
      <div class="card"><h2>CJ orders</h2><div class="scroll" id="cjorders"><p class="muted">Loading…</p></div></div>`;
    const msg = (t) => { const m = $('#cjmsg'); if (m) m.textContent = t; };
    const f = $('#cjset');
    if (f) {
      f.onsubmit = async (e) => { e.preventDefault(); const x = Object.fromEntries(new FormData(f)); try { await api('/api/admin/cj/settings', 'PUT', { shipping: x.shipping, max_days: Number(x.max_days), markup_pct: Number(x.markup_pct), auto_pay: Boolean(x.auto_pay) }); msg('Saved.'); } catch (err) { msg(err.message); } };
      $('#cjhooks').onclick = async () => { try { const r = await api('/api/admin/cj/webhooks', 'POST'); msg(r.url ? `Webhooks registered: ${r.url}` : 'Skipped (the site needs an https address).'); } catch (err) { msg(err.message); } };
      $('#cjsync').onclick = async (e) => { e.target.disabled = true; msg('Checking… (CJ allows one request per second)'); try { const r = await api('/api/admin/cj/resync', 'POST'); msg(`Checked ${r.checked} product(s).`); } catch (err) { msg(err.message); } e.target.disabled = false; };
    }
    const importBox = async (ref) => {
      const box = $('#cjres'); box.innerHTML = '<p class="muted">Loading from CJ…</p>';
      try {
        const pv = await api('/api/admin/cj/preview', 'POST', { ref });
        box.innerHTML = `<div class="sub"><div class="row" style="align-items:flex-start">${pv.images[0] ? `<img src="${esc(pv.images[0])}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:8px">` : ''}<div style="flex:1"><b>${esc(pv.title)}</b><div class="muted">${esc(pv.cj_sku)} · ${pv.weight_kg ? `${esc(pv.weight_kg)} kg · ` : ''}${pv.skus.length} option(s)</div></div></div>
          <form id="cjimp" style="display:grid;gap:6px;margin-top:8px"><input name="title" value="${esc(pv.title)}">

    <div class="muted">${esc(k.email || '')}${k.submitted_at ? ` · sent ${date(k.submitted_at)}` : ''}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0">${pic('selfie', 'Live selfie')}${pic('id_front', 'Document — front / photo page')}${pic('id_back', 'Document — back')}</div>
    <table>${row('Full name', x.full_name)}${row('Date of birth', x.date_of_birth ? `${x.date_of_birth}${age !== null ? ` (${age} years)` : ''}` : '')}${row('Nationality', x.nationality)}${row('Phone', x.phone)}
      ${row('Address', [x.address, x.city, x.postal_code, x.country].filter(Boolean).join(', '))}${row('Shop name', x.shop_name)}${row('Seller type', x.business_type === 'company' ? `Company — ${x.company_name}${x.company_number ? ` (${x.company_number})` : ''}` : 'Individual')}
      ${row('Document', `${k.id_type_label || ''} ${x.id_number || ''}${x.id_expiry ? ` · expires ${x.id_expiry}` : ''}`)}${row('Will sell', x.products)}</table>
    <p class="muted">Check that the face in the selfie matches the document photo, that the name and date of birth match the document, and that the document is not expired.</p>
    ${k.state === 'submitted' || k.state === 'rejected' ? `<div class="row"><input id="kreason" placeholder="If something is wrong: what must the seller correct?" style="flex:1;min-width:220px"><button class="btn ghost bad" id="krej">Ask for correction</button><button class="btn" id="kok">Approve seller</button></div>` : ''}
    ${k.reason ? `<p class="muted">Last note to the seller: “${esc(k.reason)}”</p>` : ''}
    <div class="err" id="ke"></div><div class="row"><button class="btn ghost" id="close">Close</button></div>`;
  $('#close').onclick = () => { d.close(); render(); };
  const act = (approve) => async (e) => { e.target.disabled = true; try { await api(`/api/admin/sellers/${id}/verification`, 'POST', { approve, reason: $('#kreason')?.value || '' }); d.close(); render(); } catch (err) { $('#ke').textContent = err.message; e.target.disabled = false; } };
  if ($('#kok')) { $('#kok').onclick = act(true); $('#krej').onclick = act(false); }
}

const STATUS_LABEL = { pending_payment:'Awaiting payment', paid:'Paid', procuring:'Buying', awaiting_parcels:'Awaiting parcels', ready_to_ship:'Ready to ship', shipped:'Shipped', delivered:'Delivered', cancelled:'Cancelled', refunded:'Refunded', attention:'Needs attention' };

let aeApi = false;
async function openOrder(id) {
  aeApi = await api('/api/admin/aliexpress').then((x) => x.mode === 'api').catch(() => false);
  const d = $('#dlg'); const b = $('#dlgBody');
  b.innerHTML = '<p class="muted">Loading…</p>'; d.showModal();
  const o = await api(`/api/admin/orders/${id}`);
  const a = o.shipping_address;
  b.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Order <code>${esc(o.id)}</code></h2><span class="pill ${statusClass(o.status)}">${esc(o.status_label)}</span></div>
    <div class="muted">${date(o.created_at)} · ${fmt(o.total, o.currency)} (Ship ${fmt(o.shipping_fee, o.currency)}) · Payment: ${o.payment?.provider === 'demo' || o.payment?.mode === 'test' ? '<span class="pill bad">TEST — no money received</span>' : esc(o.payment?.provider || '—')}</div>
    <div class="muted">To: ${esc(a.name)}, ${esc(a.line1)}, ${esc(a.city)}, ${esc(a.country)} · ${esc(a.phone)}</div>
    <table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Cost (CNY)</th></tr></thead><tbody>
      ${o.lines.map((l) => `<tr><td>${esc(l.title)}<div class="muted">${esc(l.props)}</div></td><td>${l.qty}</td><td>${fmt(l.price, o.currency)}</td><td>${fmt(l.cost_cny)}</td></tr>`).join('')}</tbody></table>
    ${o.packaging && o.packaging !== 'standard' ? `<div><span class="pill">${o.packaging === 'protect' ? 'Extra protection' : 'Remove boxes'}</span></div>` : ''}${o.hold ? '<div><span class="pill warn">Stored in the warehouse until the customer taps Ship now</span></div>' : ''}
    ${o.qc_photos ? `<h2>Check photos</h2><div class="row">${Array.from({ length: o.qc_photos }, (_, i) => `<a href="/api/admin/orders/${esc(o.id)}/qc/${i}" target="_blank"><img src="/api/admin/orders/${esc(o.id)}/qc/${i}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:8px"></a>`).join('')}</div>
      <div class="muted">Customer: ${{ pending: 'has not answered yet', approved: 'looks good', problem: `<b class="bad">reported a problem</b>${o.qc_note ? ` — “${esc(o.qc_note)}”` : ''}`, resolved: 'problem resolved' }[o.qc_review] || '—'}</div>
      ${o.qc_review === 'problem' ? '<div class="row"><input id="qcres" placeholder="What was agreed with the customer" style="flex:1"><button class="btn" data-qcres>Mark resolved — allow shipping</button></div>' : ''}` : ''}
    <h2>Messages with the customer</h2><div id="amsgs" style="display:grid;gap:6px"><span class="muted">Loading…</span></div>
    <h2>Taobao purchase orders</h2>
    ${o.sub_orders.map((s) => `<div class="sub"><div class="row" style="justify-content:space-between"><b>${esc(s.shop)}</b><span class="pill ${s.status === 'CREATE_FAILED' || s.status === 'TRADE_CLOSED' ? 'bad' : s.status === 'WAIT_BUYER_CONFIRM_GOODS' ? 'ok' : 'warn'}">${esc(s.status_label)}</span></div>
      <div class="muted"><code>${esc(s.outer_purchase_id)}</code> · ${esc((s.purchase_ids || []).join(', ') || '—')}${s.pay_deadline && /WAIT_BUYER_P/.test(s.status) ? ` · pay by ${date(s.pay_deadline)}` : ''}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}
      ${s.direct ? `<div style="display:grid;gap:6px;margin-top:6px"><div class="muted">Ships straight to the customer · ${s.source === 'cj' ? `CJdropshipping order${s.sandbox ? ' <span class="pill bad">SANDBOX</span>' : ''}${s.cj_method ? ` · ${esc(s.cj_method)}` : ''}${s.cj_amount ? ` · CJ cost $${esc(s.cj_amount)}` : ''}` : 'AliExpress order'}: ${esc((s.purchase_ids || []).join(', ') || '—')}${(s.logistics || []).length ? ` · tracking ${s.logistics.map((x) => esc(`${x.carrier || ''} ${x.tracking}`)).join(', ')}` : ''}</div>
        ${(s.links || []).map((x) => `<div class="muted">${x.qty} × ${esc(x.title)}${x.props ? ` (${esc(x.props)})` : ''} ${(x.link.match(/https?:\/\/\S+/) || [])[0] ? `· <a href="${esc(x.link.match(/https?:\/\/\S+/)[0])}" target="_blank" rel="noopener noreferrer">Open on ${s.source === 'cj' ? 'CJ' : 'AliExpress'}</a>` : ''}</div>`).join('')}
        ${s.status === 'AE_TO_BUY' && s.source !== 'cj' ? `<div class="muted">Order it on AliExpress with the customer’s address: <code>${esc([a.name, a.line1, a.line2, a.city, a.state, a.postal_code, a.country, a.phone].filter(Boolean).join(', '))}</code> <button class="btn ghost" data-copyaddr>Copy</button></div>` : ''}
        ${canBuy() && !['AE_DELIVERED', 'AE_CANCELLED'].includes(s.status) ? `<div class="row"><input placeholder="AliExpress order no." data-aeo="${esc(s.outer_purchase_id)}" value="${esc((s.purchase_ids || []).join(','))}" style="width:170px"><input placeholder="Tracking number" data-aet="${esc(s.outer_purchase_id)}" style="flex:1;min-width:150px"><input placeholder="Carrier" data-aec="${esc(s.outer_purchase_id)}" style="width:110px">
          <button class="btn" data-aesave="${esc(s.outer_purchase_id)}">Save</button>${s.status === 'AE_SHIPPED' ? `<button class="btn ghost" data-aedel="${esc(s.outer_purchase_id)}">Mark delivered</button>` : ''}${s.status === 'AE_TO_BUY' && (aeApi || s.source === 'cj') ? `<button class="btn ghost" data-aeplace="${esc(s.outer_purchase_id)}">${s.source === 'cj' ? 'Order on CJ' : 'Place via API'}</button>` : ''}${s.source === 'cj' && s.status === 'AE_PLACED' ? `<button class="btn" data-cjpay="${esc(s.outer_purchase_id)}">Pay on CJ</button>` : ''}</div>` : ''}</div>` : ''}
      ${s.manual ? `<div class="stack" style="display:grid;gap:6px;margin-top:6px">${(s.links || []).map((x) => `<div class="muted">${x.qty} × ${esc(x.title)}${x.props ? ` (${esc(x.props)})` : ''} ${(x.link.match(/https?:\/\/\S+/) || [])[0] ? `· <a href="${esc(x.link.match(/https?:\/\/\S+/)[0])}" target="_blank" rel="noopener noreferrer">Open on Taobao</a>` : x.link ? `· <code>${esc(x.link.slice(0, 80))}</code>` : '· no link'}</div>`).join('')}
        ${canBuy() && ['MANUAL_TO_BUY', 'MANUAL_BOUGHT'].includes(s.status) ? `<div class="row"><input placeholder="Taobao order no." data-mo="${esc(s.outer_purchase_id)}" value="${esc((s.purchase_ids || []).join(','))}" style="width:170px"><input placeholder="Tracking to warehouse (when shipped)" data-mt="${esc(s.outer_purchase_id)}" style="flex:1;min-width:180px"><button class="btn" data-mb="${esc(s.outer_purchase_id)}">${s.status === 'MANUAL_TO_BUY' ? 'Mark bought' : 'Save tracking'}</button></div>` : ''}</div>` : ''}
      ${(s.logistics || []).length ? `<div class="muted">Shipping: ${s.logistics.map((x) => esc(`${x.carrier || ''} ${x.tracking}`)).join(' · ')}</div>` : ''}</div>`).join('') || '<p class="muted">Not created yet.</p>'}
    <div class="row">
      ${canBuy() && ['paid', 'attention'].includes(o.status) ? '<button class="btn" data-a="procure">Retry purchase</button>' : ''}
      ${canBuy() && o.sub_orders.some((s) => /WAIT_BUYER_P/.test(s.status)) ? '<button class="btn" data-a="pay-taobao">Pay Taobao</button>' : ''}
      <button class="btn ghost" data-a="sync">Sync</button>
      ${canMoney() && !['shipped', 'delivered', 'cancelled', 'refunded'].includes(o.status) ? '<button class="btn ghost bad" data-a="cancel">Cancel & refund</button>' : ''}
      <button class="btn ghost" id="close">Close</button></div>
    <details><summary class="muted">Timeline</summary><ul class="muted">${o.timeline.map((t) => `<li>${date(t.at)} — ${esc(t.event)}</li>`).join('')}</ul></details>
    <div class="err" id="oe"></div>`;
  $('#close').onclick = () => d.close();
  const paintMsgs = async () => {
    const ms = await api(`/api/admin/orders/${o.id}/messages`).catch(() => []);
    $('#amsgs').innerHTML = `${ms.map((m) => `<div style="padding:8px 10px;border-radius:10px;background:${m.from === 'staff' ? 'var(--jade-soft, #e6f4ef)' : 'var(--chip, #f1f3f7)'}"><b>${esc(m.name)}</b> <span class="muted">${m.thread === 'kinan' ? '→ Kinan' : `→ ${esc(m.thread)}`} · ${date(m.at)}</span><div dir="auto">${esc(m.text)}</div></div>`).join('') || '<span class="muted">No messages.</span>'}
      <form class="row" id="amf"><input name="text" placeholder="Reply to the customer as Kinan support" style="flex:1" required><button class="btn">Send</button></form>`;
    $('#amf').onsubmit = async (e) => { e.preventDefault(); try { await api(`/api/admin/orders/${o.id}/messages`, 'POST', { text: e.target.text.value }); paintMsgs(); } catch (err) { $('#oe').textContent = err.message; } };
  };
  paintMsgs();
  const qr = b.querySelector('[data-qcres]');
  if (qr) qr.onclick = async () => { qr.disabled = true; try { await api(`/api/admin/orders/${o.id}/qc-resolved`, 'POST', { note: $('#qcres').value }); openOrder(o.id); } catch (e) { $('#oe').textContent = e.message; qr.disabled = false; } };
  const ca = b.querySelector('[data-copyaddr]');
  if (ca) ca.onclick = () => { const t = ca.previousElementSibling.textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { ca.textContent = 'Copied'; }, () => prompt('Copy', t)); };
  const aeDo = (outer, body) => async (ev) => {
    ev.target.disabled = true;
    try { await api(`/api/admin/orders/${id}/aliexpress`, 'POST', { outer_purchase_id: outer, ...body() }); await openOrder(id); render(); }
    catch (e) { $('#oe').textContent = e.message; ev.target.disabled = false; }
  };
  b.querySelectorAll('[data-aesave]').forEach((btn) => { const o = btn.dataset.aesave; btn.onclick = aeDo(o, () => ({ ae_order_no: b.querySelector(`[data-aeo="${o}"]`).value.trim(), tracking: b.querySelector(`[data-aet="${o}"]`).value.trim(), carrier: b.querySelector(`[data-aec="${o}"]`).value.trim() })); });
  b.querySelectorAll('[data-aedel]').forEach((btn) => { btn.onclick = aeDo(btn.dataset.aedel, () => ({ delivered: true })); });
  b.querySelectorAll('[data-aeplace]').forEach((btn) => { btn.onclick = aeDo(btn.dataset.aeplace, () => ({ place: true })); });
  b.querySelectorAll('[data-cjpay]').forEach((btn) => { btn.onclick = aeDo(btn.dataset.cjpay, () => ({ pay: true })); });
  b.querySelectorAll('[data-mb]').forEach((btn) => btn.onclick = async () => {
    const outer = btn.dataset.mb; btn.disabled = true;
    try { await api(`/api/admin/orders/${id}/manual-bought`, 'POST', { outer_purchase_id: outer, taobao_order_no: b.querySelector(`[data-mo="${outer}"]`).value.trim(), tracking: b.querySelector(`[data-mt="${outer}"]`).value.trim() }); await openOrder(id); render(); }
    catch (e) { $('#oe').textContent = e.message; btn.disabled = false; }
  });
  b.querySelectorAll('[data-a]').forEach((btn) => btn.onclick = async () => {
    if (btn.dataset.a === 'cancel' && !confirm('Cancel this order and refund the buyer?')) return;
    btn.disabled = true;
    try { await api(`/api/admin/orders/${id}/${btn.dataset.a}`, 'POST'); await openOrder(id); render(); } catch (e) { $('#oe').textContent = e.message; btn.disabled = false; }
  });
}

(async () => {
  const q = new URLSearchParams(location.search); const loginError = q.get('login_error') || '';
  if (loginError || q.get('aliexpress')) history.replaceState(null, '', '/admin');
  if (q.get('aliexpress') === 'connected') setTimeout(() => alert('AliExpress account connected'), 300);
  googleSignin = await fetch('/api/config/public').then((r) => r.json()).then((c) => Boolean(c.google_signin)).catch(() => false);
  api('/api/me').then(asMe).then((u) => (STAFF_LOGIN.includes(u.role) ? boot(u) : u.role === 'warehouse' ? (location.href = '/warehouse') : showLogin(loginError || 'You are signed in to the shop with a customer account — use Continue with Google with the admin Gmail'))).catch(() => showLogin(loginError));
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
