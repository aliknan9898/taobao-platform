name: kinan_shop
description: KINAN Shop mobile pilot (buyer app) for Android and iOS. Uses the existing KINAN Shop API.
publish_to: none
version: 0.1.0+1

environment:
  # Flutter 3.50.1 stable (Dart 3.13). See README.md for the exact SDK used.
  sdk: ^3.13.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Versions checked against the packages' release tags on 2026-11-22; run `flutter pub outdated` before upgrading.
  flutter_stripe: ^15.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.0
  http: ^1.5.0
  intl: any # pinned by flutter_localizations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
